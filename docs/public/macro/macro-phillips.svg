<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">菲利普斯曲线：短期取舍、长期垂直与滞胀</text>

  <rect x="24" y="48" width="450" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#1e3a8a">π–u 图（横轴失业率 u，纵轴通胀率 π）</text>
  <line x1="70" y1="288" x2="450" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="288" x2="70" y2="86" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="94" text-anchor="end" font-size="11" fill="#6b7280">π</text>
  <text x="442" y="306" text-anchor="end" font-size="11" fill="#6b7280">u</text>
  <line x1="280" y1="288" x2="280" y2="90" stroke="#c0392b" stroke-width="3"/>
  <text x="286" y="102" font-size="11" fill="#c0392b">长期 PC（u*）</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#c0392b">u*（自然失业率）</text>
  <path d="M100,110 C170,160 230,230 420,262" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <text x="410" y="276" font-size="11" fill="#1e3a8a">短期 PC（πᵉ 较低）</text>
  <path d="M100,150 C170,200 230,258 420,286" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="330" y="248" font-size="11" fill="#0891b2">预期上升 → PC 上移</text>
  <circle cx="200" cy="196" r="5" fill="#1e3a8a"/>
  <text x="206" y="190" font-size="11" fill="#1e3a8a">A</text>
  <circle cx="330" cy="196" r="5" fill="#92400e"/>
  <text x="336" y="190" font-size="11" fill="#92400e">滞胀：π↑ 且 u↑</text>

  <text x="494" y="70" font-size="13" font-weight="700" fill="#1e3a8a">三个层次</text>
  <g font-size="12" fill="#1f2937">
    <rect x="494" y="82" width="382" height="66" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="510" y="104" font-weight="700" fill="#1e3a8a">原始 / 短期 PC</text>
    <text x="510" y="124" font-size="11" fill="#374151">通胀率与失业率反向替代，政策面临取舍</text>
    <text x="510" y="140" font-size="11" fill="#374151">替代关系来自「未预期到的」通胀</text>
    <rect x="494" y="154" width="382" height="66" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="510" y="176" font-weight="700" fill="#1e3a8a">附加预期：π = πᵉ − ε(u − u*)</text>
    <text x="510" y="196" font-size="11" fill="#374151">预期通胀上升 → 短期 PC 整体右上移</text>
    <text x="510" y="212" font-size="11" fill="#374151">不利供给冲击 + 高通胀预期 → 滞胀</text>
    <rect x="494" y="226" width="382" height="66" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="510" y="248" font-weight="700" fill="#92400e">长期 PC：在 u* 处垂直</text>
    <text x="510" y="268" font-size="11" fill="#78350f">弗里德曼—费尔普斯：长期不存在替代关系</text>
    <text x="510" y="284" font-size="11" fill="#78350f">「用通胀换就业」只在短期、预期未调整时有效</text>
  </g>

  <text x="24" y="344" font-size="13" font-weight="700" fill="#1e3a8a">流派分歧</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="356" width="272" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="379" text-anchor="middle" font-size="11" fill="#374151">货币主义：短期有效、长期无效</text>
    <rect x="310" y="356" width="272" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="446" y="379" text-anchor="middle" font-size="11" fill="#374151">理性预期：连短期也系统性无效</text>
    <rect x="596" y="356" width="280" height="36" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="736" y="379" text-anchor="middle" font-size="11" fill="#374151">新凯恩斯：黏性使政策仍有效</text>
  </g>
</svg>
