<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">蒙代尔-弗莱明模型 与 不可能三角</text>

  <text x="24" y="58" font-size="13" font-weight="700" fill="#1e3a8a">① 资本完全流动下的政策效果（BP 水平，r = r*）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="70" width="414" height="118" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="231" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">固定汇率制</text>
    <text x="44" y="118" font-size="12" fill="#374151">财政政策：G↑ → r 上行 → 资本流入 → 央行购汇投放货币 → Y 进一步增加</text>
    <text x="44" y="142" font-size="13" font-weight="700" fill="#1e3a8a">财政政策有效</text>
    <text x="44" y="164" font-size="12" fill="#7f1d1d">货币政策：M↑ → r 下行 → 资本外流 → 储备减少 → M 回到原点</text>
    <text x="44" y="182" font-size="13" font-weight="700" fill="#b91c1c">货币政策无效</text>
    <rect x="452" y="70" width="424" height="118" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="664" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">浮动汇率制</text>
    <text x="472" y="118" font-size="12" fill="#78350f">财政政策：G↑ → r 上行 → 资本流入 → 本币升值 → NX 减少完全抵消</text>
    <text x="472" y="142" font-size="13" font-weight="700" fill="#b91c1c">财政政策无效</text>
    <text x="472" y="164" font-size="12" fill="#78350f">货币政策：M↑ → r 下行 → 资本流出 → 本币贬值 → NX 增加 → Y 大幅上升</text>
    <text x="472" y="182" font-size="13" font-weight="700" fill="#1e3a8a">货币政策有效</text>
  </g>

  <text x="24" y="222" font-size="13" font-weight="700" fill="#1e3a8a">② BP 曲线形态取决于资本流动程度</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="234" width="272" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="256" text-anchor="middle" font-weight="600" fill="#1e3a8a">完全不流动 → BP 垂直</text>
    <text x="160" y="276" text-anchor="middle" font-size="11" fill="#374151">只有收入变动调节贸易收支</text>
    <rect x="310" y="234" width="272" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="446" y="256" text-anchor="middle" font-weight="600" fill="#1e3a8a">不完全流动 → BP 右上倾</text>
    <text x="446" y="276" text-anchor="middle" font-size="11" fill="#374151">收入与利率共同调节</text>
    <rect x="596" y="234" width="280" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="736" y="256" text-anchor="middle" font-weight="700" fill="#1e3a8a">完全流动 → BP 水平</text>
    <text x="736" y="276" text-anchor="middle" font-size="11" fill="#374151">国内利率必须等于世界利率 r*</text>
  </g>

  <text x="24" y="320" font-size="13" font-weight="700" fill="#1e3a8a">③ 不可能三角（三元悖论）：三者只能取其二</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="332" width="272" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="354" text-anchor="middle" font-weight="600" fill="#1e3a8a">货币政策独立性</text>
    <text x="160" y="374" text-anchor="middle" font-size="11" fill="#374151">自主调节利率与货币量</text>
    <rect x="310" y="332" width="272" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="446" y="354" text-anchor="middle" font-weight="600" fill="#1e3a8a">资本自由流动</text>
    <text x="446" y="374" text-anchor="middle" font-size="11" fill="#374151">无跨境资本管制</text>
    <rect x="596" y="332" width="280" height="56" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="736" y="354" text-anchor="middle" font-weight="600" fill="#1e3a8a">汇率稳定 / 固定汇率</text>
    <text x="736" y="374" text-anchor="middle" font-size="11" fill="#374151">本币钉住外币</text>
  </g>
  <rect x="24" y="392" width="852" height="24" rx="7" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="408" text-anchor="middle" font-size="11" fill="#78350f">口诀：固定汇率看财政、浮动汇率看货币（资本完全流动时）；我国取向为独立货币政策 + 管理浮动 + 有限资本开放。</text>
</svg>
