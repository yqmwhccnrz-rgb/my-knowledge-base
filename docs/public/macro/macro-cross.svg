<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">收入-支出模型：45 度线、均衡产出与乘数</text>

  <rect x="24" y="48" width="470" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#1e3a8a">Y–AE 图（横轴：收入 Y；纵轴：总支出 AE）</text>
  <line x1="70" y1="288" x2="470" y2="288" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="288" x2="70" y2="86" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="94" text-anchor="end" font-size="11" fill="#6b7280">AE</text>
  <text x="462" y="306" text-anchor="end" font-size="11" fill="#6b7280">Y</text>
  <line x1="70" y1="288" x2="430" y2="100" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="420" y="96" font-size="11" fill="#6b7280">45° 线（Y = AE）</text>
  <line x1="70" y1="238" x2="430" y2="170" stroke="#1e3a8a" stroke-width="3"/>
  <text x="424" y="162" font-size="11" fill="#1e3a8a">AE = a + I₀ + bY</text>
  <line x1="70" y1="208" x2="430" y2="140" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="424" y="132" font-size="11" fill="#c0392b">AE′（投资增加 ΔI）</text>
  <circle cx="250" cy="204" r="5" fill="#1e3a8a"/>
  <circle cx="330" cy="166" r="5" fill="#c0392b"/>
  <line x1="250" y1="204" x2="250" y2="288" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="166" x2="330" y2="288" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="250" y="306" text-anchor="middle" font-size="11" fill="#1e3a8a">Y₁</text>
  <text x="330" y="306" text-anchor="middle" font-size="11" fill="#c0392b">Y₂</text>
  <text x="290" y="278" text-anchor="middle" font-size="11" fill="#6b7280">ΔY ≫ ΔI</text>

  <text x="516" y="70" font-size="13" font-weight="700" fill="#1e3a8a">乘数的级数推导</text>
  <g font-size="12" fill="#1f2937">
    <rect x="516" y="82" width="360" height="96" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="532" y="106" font-size="12" fill="#374151">ΔA → ΔY₁ = ΔA → 消费 b·ΔA → ΔY₂ = b·ΔA …</text>
    <text x="532" y="132" font-size="14" font-weight="700" fill="#1e3a8a">ΔY = ΔA (1 + b + b² + …)</text>
    <text x="532" y="158" font-size="15" font-weight="700" fill="#1e3a8a">k = ΔY / ΔA = 1 / (1 − b)</text>
    <rect x="516" y="190" width="360" height="76" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="532" y="212" font-weight="700" fill="#92400e">乘数发挥作用的前提</text>
    <text x="532" y="232" font-size="11" fill="#78350f">① 存在闲置资源（未充分就业） ② 利率不变</text>
    <text x="532" y="252" font-size="11" fill="#78350f">③ 价格不变（短期） ④ MPC 稳定且大于 0</text>
  </g>

  <text x="24" y="344" font-size="13" font-weight="700" fill="#1e3a8a">各类乘数一览</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="356" width="204" height="42" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">k_G = k_I = 1/(1−b)</text>
    <rect x="238" y="356" width="204" height="42" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="340" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">k_T = −b/(1−b)</text>
    <rect x="452" y="356" width="204" height="42" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="554" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">k_TR = b/(1−b)</text>
    <rect x="666" y="356" width="210" height="42" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="771" y="382" text-anchor="middle" font-weight="700" fill="#1e3a8a">平衡预算乘数 = 1</text>
  </g>
</svg>
