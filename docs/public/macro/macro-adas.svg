<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">AD-AS 模型：三种总供给、需求冲击与滞胀</text>

  <rect x="24" y="48" width="420" height="272" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="70" font-size="13" font-weight="700" fill="#1e3a8a">P–Y 图（横轴 Y，纵轴价格水平 P）</text>
  <line x1="70" y1="292" x2="420" y2="292" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="292" x2="70" y2="86" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="94" text-anchor="end" font-size="11" fill="#6b7280">P</text>
  <text x="412" y="310" text-anchor="end" font-size="11" fill="#6b7280">Y</text>
  <line x1="300" y1="292" x2="300" y2="90" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="304" y="102" font-size="11" fill="#0891b2">LRAS（Y_f）</text>
  <line x1="100" y1="258" x2="410" y2="110" stroke="#1e3a8a" stroke-width="3"/>
  <text x="396" y="106" font-size="12" fill="#1e3a8a">AD</text>
  <line x1="100" y1="216" x2="410" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <text x="396" y="146" font-size="11" fill="#c0392b">SRAS</text>
  <line x1="100" y1="258" x2="220" y2="258" stroke="#92400e" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="104" y="252" font-size="11" fill="#92400e">凯恩斯 AS（水平）</text>
  <circle cx="256" cy="183" r="5" fill="#1e3a8a"/>
  <text x="264" y="178" font-size="11" fill="#1e3a8a">短期均衡</text>
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="#0891b2">Y_f（潜在产出）</text>

  <text x="464" y="70" font-size="13" font-weight="700" fill="#1e3a8a">AD 为何右下倾：三大效应</text>
  <g font-size="12" fill="#1f2937">
    <rect x="464" y="82" width="412" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="480" y="102" font-weight="600" fill="#1e3a8a">利率效应</text>
    <text x="480" y="122" font-size="11" fill="#374151">P↓ → M/P↑ → r↓ → I↑ → Y↑</text>
    <rect x="464" y="140" width="412" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="480" y="160" font-weight="600" fill="#1e3a8a">实际余额效应（庇古）</text>
    <text x="480" y="180" font-size="11" fill="#374151">P↓ → 实际财富↑ → C↑ → Y↑</text>
    <rect x="464" y="198" width="412" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="480" y="218" font-weight="600" fill="#1e3a8a">汇率效应（开放经济）</text>
    <text x="480" y="238" font-size="11" fill="#374151">P↓ → r↓ → 本币贬值 → NX↑ → Y↑</text>
    <rect x="464" y="256" width="412" height="64" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="480" y="278" font-weight="700" fill="#92400e">从 IS-LM 推导 AD</text>
    <text x="480" y="298" font-size="11" fill="#78350f">P 变动 → M/P 变动 → LM 平移 → 均衡 Y 变动</text>
    <text x="480" y="314" font-size="11" fill="#78350f">不同 P 下均衡点的连线即 AD；凡使 IS/LM 右移者使 AD 右移</text>
  </g>

  <text x="24" y="350" font-size="13" font-weight="700" fill="#1e3a8a">冲击分析</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="362" width="272" height="46" rx="7" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="160" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">正向需求冲击：Y↑、P↑（过热）</text>
    <text x="160" y="400" text-anchor="middle" font-size="11" fill="#374151">负向需求冲击：Y↓、P↓（衰退）</text>
    <rect x="310" y="362" width="272" height="46" rx="7" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="446" y="382" text-anchor="middle" font-weight="700" fill="#b91c1c">不利供给冲击（AS 左移）</text>
    <text x="446" y="400" text-anchor="middle" font-size="11" fill="#7f1d1d">Y↓ 且 P↑ → 滞胀</text>
    <rect x="596" y="362" width="280" height="46" rx="7" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="736" y="382" text-anchor="middle" font-weight="700" fill="#92400e">政策两难</text>
    <text x="736" y="400" text-anchor="middle" font-size="11" fill="#78350f">刺激需求加剧通胀，抑通胀又压产出</text>
  </g>
</svg>
