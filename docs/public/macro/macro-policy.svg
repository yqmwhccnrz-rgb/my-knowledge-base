<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">IS-LM 中的政策效果：挤出效应与两个极端</text>

  <text x="24" y="58" font-size="13" font-weight="700" fill="#1e3a8a">① 财政扩张（IS 右移）与挤出效应</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="70" width="272" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="92" text-anchor="middle" font-weight="700" fill="#1e3a8a">传导链</text>
    <text x="40" y="114" font-size="11" fill="#374151">G ↑ → IS 右移 → Y ↑ 且 r ↑</text>
    <text x="40" y="134" font-size="11" fill="#c0392b">r ↑ 挤掉私人投资 = 挤出效应</text>
    <text x="40" y="152" font-size="11" fill="#374151">效果被部分抵消</text>
    <rect x="310" y="70" width="272" height="92" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="446" y="92" text-anchor="middle" font-weight="700" fill="#92400e">挤出大小的决定因素</text>
    <text x="326" y="114" font-size="11" fill="#78350f">d 大（投资对利率敏感）→ 挤出大</text>
    <text x="326" y="134" font-size="11" fill="#78350f">h 小（LM 陡）→ 利率升得多 → 挤出大</text>
    <text x="326" y="152" font-size="11" fill="#78350f">LM 水平 → 挤出为 0</text>
    <rect x="596" y="70" width="280" height="92" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="736" y="92" text-anchor="middle" font-weight="700" fill="#1e3a8a">货币扩张（LM 右移）</text>
    <text x="612" y="114" font-size="11" fill="#374151">M ↑ → LM 右移 → r ↓ → I ↑ → Y ↑</text>
    <text x="612" y="134" font-size="11" fill="#374151">传导：M↑ → r↓ → I↑ → Y↑</text>
    <text x="612" y="152" font-size="11" fill="#374151">受 h 与 d 共同影响</text>
  </g>

  <text x="24" y="196" font-size="13" font-weight="700" fill="#1e3a8a">② 两个极端：政策效果完全相反</text>
  <g font-size="12">
    <rect x="24" y="208" width="414" height="94" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="231" y="230" text-anchor="middle" font-weight="700" fill="#1e3a8a">凯恩斯区域（流动性陷阱，LM 水平，h → ∞）</text>
    <text x="44" y="254" font-size="12" fill="#374151">利率极低时公众愿意持有任何数量的货币</text>
    <text x="44" y="276" font-size="13" font-weight="700" fill="#1e3a8a">财政政策最有效（挤出为 0） · 货币政策完全无效</text>
    <text x="44" y="294" font-size="11" fill="#6b7280">增发货币全被投机需求吸收，利率不再下降</text>
    <rect x="452" y="208" width="424" height="94" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="664" y="230" text-anchor="middle" font-weight="700" fill="#b91c1c">古典区域（LM 垂直，h → 0）</text>
    <text x="472" y="254" font-size="12" fill="#7f1d1d">货币需求与利率无关，LM 垂直</text>
    <text x="472" y="276" font-size="13" font-weight="700" fill="#b91c1c">货币政策完全有效 · 财政政策完全无效</text>
    <text x="472" y="294" font-size="11" fill="#7f1d1d">财政扩张只推高利率，完全挤出私人投资</text>
  </g>

  <text x="24" y="336" font-size="13" font-weight="700" fill="#1e3a8a">③ 政策配合（Y 与 r 的组合）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="348" width="204" height="58" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="370" text-anchor="middle" font-weight="600" fill="#1e3a8a">双松</text>
    <text x="126" y="390" text-anchor="middle" font-size="11" fill="#374151">Y 大幅↑，r 不定</text>
    <rect x="238" y="348" width="204" height="58" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="340" y="370" text-anchor="middle" font-weight="600" fill="#1e3a8a">松财政 + 紧货币</text>
    <text x="340" y="390" text-anchor="middle" font-size="11" fill="#374151">r 大幅↑，Y 不定</text>
    <rect x="452" y="348" width="204" height="58" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="554" y="370" text-anchor="middle" font-weight="600" fill="#1e3a8a">紧财政 + 松货币</text>
    <text x="554" y="390" text-anchor="middle" font-size="11" fill="#374151">r 大幅↓，私人投资占比↑</text>
    <rect x="666" y="348" width="210" height="58" rx="7" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="771" y="370" text-anchor="middle" font-weight="700" fill="#92400e">双紧</text>
    <text x="771" y="390" text-anchor="middle" font-size="11" fill="#78350f">Y 大幅↓，抑制通胀</text>
  </g>
</svg>
