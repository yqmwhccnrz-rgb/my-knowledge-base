<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">技术分析核心图式：K线构造 · 八浪循环 · 反转形态</text>

  <!-- ① K-line anatomy -->
  <text x="120" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">① K线构造</text>
  <!-- bullish candle -->
  <line x1="70" y1="80" x2="70" y2="200" stroke="#dc2626" stroke-width="2"/>
  <rect x="58" y="105" width="24" height="70" fill="#dc2626"/>
  <text x="90" y="86" font-size="10.5" fill="#334155">最高价</text>
  <text x="90" y="110" font-size="10.5" fill="#334155">收盘价</text>
  <text x="90" y="176" font-size="10.5" fill="#334155">开盘价</text>
  <text x="90" y="204" font-size="10.5" fill="#334155">最低价</text>
  <text x="38" y="98" font-size="10" fill="#64748b">上影线</text>
  <text x="38" y="145" font-size="10" fill="#dc2626" font-weight="600">实体</text>
  <text x="38" y="192" font-size="10" fill="#64748b">下影线</text>
  <text x="70" y="224" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">阳线（红）</text>
  <!-- bearish candle -->
  <line x1="170" y1="80" x2="170" y2="200" stroke="#16a34a" stroke-width="2"/>
  <rect x="158" y="105" width="24" height="70" fill="#16a34a"/>
  <text x="190" y="110" font-size="10.5" fill="#334155">开盘价</text>
  <text x="190" y="176" font-size="10.5" fill="#334155">收盘价</text>
  <text x="170" y="224" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="600">阴线（绿）</text>

  <!-- ② eight wave -->
  <text x="440" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">② 波浪理论：八浪循环（5 推动 + 3 调整）</text>
  <polyline points="290,200 320,140 335,165 375,110 390,135 430,75 448,120 470,95 500,160 520,130 545,190"
    fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <g font-size="12" font-weight="700" fill="#dc2626">
    <circle cx="320" cy="140" r="11" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="144" text-anchor="middle">1</text>
    <circle cx="335" cy="165" r="11" fill="#dcfce7" stroke="#16a34a"/><text x="335" y="169" text-anchor="middle" fill="#16a34a">2</text>
    <circle cx="375" cy="110" r="11" fill="#fee2e2" stroke="#dc2626"/><text x="375" y="114" text-anchor="middle">3</text>
    <circle cx="390" cy="135" r="11" fill="#dcfce7" stroke="#16a34a"/><text x="390" y="139" text-anchor="middle" fill="#16a34a">4</text>
    <circle cx="430" cy="75" r="11" fill="#fee2e2" stroke="#dc2626"/><text x="430" y="79" text-anchor="middle">5</text>
  </g>
  <g font-size="12" font-weight="700" fill="#16a34a">
    <circle cx="500" cy="160" r="11" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="164" text-anchor="middle" fill="#16a34a">a</text>
    <circle cx="520" cy="130" r="11" fill="#dcfce7" stroke="#16a34a"/><text x="520" y="134" text-anchor="middle" fill="#16a34a">b</text>
    <circle cx="545" cy="190" r="11" fill="#dcfce7" stroke="#16a34a"/><text x="545" y="194" text-anchor="middle" fill="#16a34a">c</text>
  </g>
  <text x="368" y="228" font-size="10.5" fill="#b91c1c">浪3最长最具爆发力</text>
  <text x="368" y="243" font-size="10.5" fill="#b91c1c">浪2不破浪1起点·浪4底不低于浪1顶</text>
  <text x="480" y="228" font-size="10.5" fill="#15803d">b浪=逃命浪（多头陷阱）</text>

  <!-- ③ head and shoulders -->
  <text x="740" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">③ 头肩顶（反转形态）</text>
  <polyline points="620,150 660,100 685,140 730,70 775,140 800,100 830,140"
    fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="615" y1="140" x2="865" y2="140" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="868" y="144" font-size="11" fill="#b45309">颈线</text>
  <g font-size="11" fill="#6d28d9" font-weight="600">
    <text x="652" y="92">左肩</text>
    <text x="722" y="62">头</text>
    <text x="795" y="92">右肩</text>
  </g>
  <polyline points="830,140 855,205" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ar5)"/>
  <text x="770" y="228" font-size="10.5" fill="#6d28d9">有效跌破颈线→形态确立</text>
  <text x="770" y="243" font-size="10.5" fill="#6d28d9">量度跌幅=头到颈线垂直距离</text>

  <!-- bottom: indicator table -->
  <g font-size="11.5">
    <rect x="24" y="264" width="852" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="286" font-weight="700" fill="#1e3a8a">主要技术指标速查</text>
    <g fill="#334155">
      <text x="44" y="308" font-weight="600">MA 移动平均线</text><text x="170" y="308">葛兰威尔法则：金叉买、死叉卖；适用于趋势行情，盘整失效</text>
      <text x="44" y="328" font-weight="600">MACD</text><text x="170" y="328">DIF（正负差）+ DEA（DIF的平滑）；滤除MA假信号，柱线由正转负为卖出信号</text>
      <text x="44" y="348" font-weight="600">WMS 威廉指标</text><text x="170" y="348">n日WMS=(Hn−Ct)/(Hn−Ln)×100；&gt;80 超卖（买），&lt;20 超买（卖）——方向与KD相反！</text>
      <text x="44" y="368" font-weight="600">KDJ 随机指标</text><text x="170" y="368">RSV→K=2/3昨K+1/3RSV→D=2/3昨D+1/3K→J=3D−2K；80以上超买、20以下超卖</text>
      <text x="44" y="388" font-weight="600">RSI 相对强弱</text><text x="170" y="388">RSI=A/(A+B)×100（A=14日涨幅和，B=跌幅和）；80-100极强卖出，0-20极弱买入</text>
      <text x="44" y="408" font-weight="600">BIAS 乖离率</text><text x="170" y="408">(收盘价−MA)/MA×100%；正乖离过大回调、负乖离过大反弹</text>
    </g>
  </g>
</svg>
