<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">证券市场体系：功能 · 分类 · 参与主体 · 监管</text>

  <text x="24" y="62" font-size="14" font-weight="700" fill="#1e3a8a">① 基本功能与分类</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="76" width="180" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="114" y="96" text-anchor="middle" font-weight="600">筹资—投资</text>
    <text x="114" y="113" text-anchor="middle" font-size="11" fill="#374151">资金融通的基本功能</text>
    <rect x="220" y="76" width="180" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="310" y="96" text-anchor="middle" font-weight="600">资本定价</text>
    <text x="310" y="113" text-anchor="middle" font-size="11" fill="#374151">发现合理价格</text>
    <rect x="416" y="76" width="180" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="506" y="96" text-anchor="middle" font-weight="600">资本配置</text>
    <text x="506" y="113" text-anchor="middle" font-size="11" fill="#374151">引导资金流向</text>

    <rect x="612" y="76" width="264" height="46" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="744" y="96" text-anchor="middle" font-weight="600" fill="#166534">四种分类口径</text>
    <text x="744" y="113" text-anchor="middle" font-size="11" fill="#166534">功能→一/二级市场；条件→主/二板</text>
  </g>
  <g font-size="11" fill="#374151">
    <text x="620" y="138">对象→股票/债券/基金/衍生品市场；组织形式→场内/场外</text>
  </g>

  <text x="24" y="170" font-size="14" font-weight="700" fill="#1e3a8a">② 一级市场与二级市场的关系</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="184" width="380" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="214" y="207" text-anchor="middle" font-weight="700" fill="#1e40af">一级市场（发行市场）</text>
    <text x="214" y="227" text-anchor="middle" font-size="11" fill="#1e3a8a">证券首次出售给投资者：承销商发行定价</text>
    <line x1="408" y1="214" x2="486" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="447" y="206" text-anchor="middle" font-size="11" fill="#64748b">基础</text>
    <rect x="492" y="184" width="384" height="60" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="684" y="207" text-anchor="middle" font-weight="700" fill="#92400e">二级市场（流通市场）</text>
    <text x="684" y="227" text-anchor="middle" font-size="11" fill="#78350f">已发行证券转让：为一级市场提供定价参照</text>
  </g>

  <text x="24" y="282" font-size="14" font-weight="700" fill="#1e3a8a">③ 市场参与主体（五类）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="296" width="160" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="104" y="318" text-anchor="middle" font-weight="600" fill="#1e3a8a">发行人</text>
    <text x="104" y="336" text-anchor="middle" font-size="11" fill="#374151">公司（仅股份公司</text>
    <text x="104" y="351" text-anchor="middle" font-size="11" fill="#374151">可发股票）、政府</text>
    <rect x="196" y="296" width="160" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="276" y="318" text-anchor="middle" font-weight="600" fill="#1e3a8a">投资人</text>
    <text x="276" y="336" text-anchor="middle" font-size="11" fill="#374151">机构投资者</text>
    <text x="276" y="351" text-anchor="middle" font-size="11" fill="#374151">个人投资者</text>
    <rect x="368" y="296" width="160" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="448" y="318" text-anchor="middle" font-weight="600" fill="#1e3a8a">中介机构</text>
    <text x="448" y="336" text-anchor="middle" font-size="11" fill="#374151">证券公司：经纪商</text>
    <text x="448" y="351" text-anchor="middle" font-size="11" fill="#374151">自营商·承销商</text>
    <rect x="540" y="296" width="160" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="620" y="318" text-anchor="middle" font-weight="600" fill="#1e3a8a">自律组织</text>
    <text x="620" y="336" text-anchor="middle" font-size="11" fill="#374151">证券交易所</text>
    <text x="620" y="351" text-anchor="middle" font-size="11" fill="#374151">证券业协会</text>
    <rect x="712" y="296" width="164" height="66" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="794" y="318" text-anchor="middle" font-weight="600" fill="#991b1b">监管机构</text>
    <text x="794" y="336" text-anchor="middle" font-size="11" fill="#7f1d1d">中国证监会及</text>
    <text x="794" y="351" text-anchor="middle" font-size="11" fill="#7f1d1d">其派出机构</text>
  </g>

  <text x="24" y="398" font-size="14" font-weight="700" fill="#1e3a8a">④ 交易场所</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="412" width="416" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="232" y="431" text-anchor="middle" font-weight="600" fill="#1e3a8a">交易所：上交所 + 深交所（均为会员制，不以营利为目的）</text>
    <text x="232" y="449" text-anchor="middle" font-size="11" fill="#374151">公司制交易所以营利为目的（对照记忆）</text>
    <rect x="456" y="412" width="420" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="666" y="431" text-anchor="middle" font-weight="600" fill="#166534">场外市场：银行间债券市场 · 全国股转系统 · 债券柜台市场</text>
    <text x="666" y="449" text-anchor="middle" font-size="11" fill="#374151">拓宽中小企业融资渠道，提供风险分层管理渠道</text>
  </g>
</svg>
