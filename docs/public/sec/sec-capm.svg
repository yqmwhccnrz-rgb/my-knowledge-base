<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">CAPM 的两条线：资本市场线 CML 与证券市场线 SML</text>

  <!-- Left: CML -->
  <text x="230" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">① 资本市场线 CML</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="70" y1="330" x2="420" y2="330"/>
    <line x1="70" y1="330" x2="70" y2="80"/>
  </g>
  <line x1="70" y1="330" x2="420" y2="80" stroke="#475569" stroke-width="1.2" marker-end="url(#ar3)" stroke-dasharray="0"/>
  <!-- efficient frontier curve -->
  <path d="M70,300 Q150,300 210,250 T330,150" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="70" cy="300" r="5" fill="#0ea5e9"/>
  <text x="40" y="296" font-size="11" fill="#0369a1">r_f</text>
  <text x="40" y="310" font-size="10" fill="#64748b">(无风险利率)</text>
  <circle cx="250" cy="212" r="6" fill="#dc2626"/>
  <text x="262" y="208" font-size="12" font-weight="700" fill="#dc2626">M</text>
  <text x="262" y="224" font-size="10" fill="#7f1d1d">市场组合</text>
  <path d="M70,300 Q150,300 210,250 T330,150" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="300" y="128" font-size="10.5" fill="#2563eb">有效边界</text>
  <text x="120" y="352" font-size="11" fill="#334155">横轴 σ_P（标准差/总风险）</text>
  <text x="24" y="180" font-size="11" fill="#334155" transform="rotate(-90 24,180)">纵轴 E(r_P) 期望收益</text>
  <text x="245" y="368" text-anchor="middle" font-size="11" fill="#475569">E(r_P)=r_f+[(E(r_M)−r_f)/σ_M]·σ_P</text>

  <!-- Right: SML -->
  <text x="660" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">② 证券市场线 SML</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="500" y1="330" x2="850" y2="330"/>
    <line x1="500" y1="330" x2="500" y2="80"/>
  </g>
  <line x1="500" y1="300" x2="820" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar3)"/>
  <circle cx="500" cy="300" r="5" fill="#0ea5e9"/>
  <text x="470" y="296" font-size="11" fill="#0369a1">r_f</text>
  <circle cx="640" cy="221" r="6" fill="#16a34a"/>
  <text x="650" y="218" font-size="12" font-weight="700" fill="#16a34a">M (β=1)</text>
  <!-- over/under priced points -->
  <circle cx="590" cy="180" r="5" fill="#f59e0b"/>
  <text x="500" y="170" font-size="10" fill="#b45309">线上方=低估(应买)</text>
  <circle cx="720" cy="265" r="5" fill="#8b5cf6"/>
  <text x="700" y="290" font-size="10" fill="#6d28d9">线下方=高估(应卖)</text>
  <text x="555" y="352" font-size="11" fill="#334155">横轴 β（系统性风险）</text>
  <text x="454" y="200" font-size="11" fill="#334155" transform="rotate(-90 454,200)">纵轴 E(r_i) 期望收益</text>
  <text x="675" y="368" text-anchor="middle" font-size="11" fill="#b91c1c">E(r_i)=r_f+[E(r_M)−r_f]·β_i</text>

  <!-- comparison -->
  <g font-size="11.5">
    <rect x="24" y="384" width="852" height="70" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="44" y="404" font-weight="700" fill="#9a3412">CML vs SML 关键区别</text>
    <text x="44" y="423" fill="#7c2d12">· CML 横轴是标准差（总风险），只对「无风险资产 + 市场组合」构成的有效组合成立；</text>
    <text x="44" y="441" fill="#7c2d12">· SML 横轴是 β（系统性风险），对任何单个资产或组合都成立。非系统性风险可分散，市场只补偿系统性风险。</text>
  </g>
</svg>
