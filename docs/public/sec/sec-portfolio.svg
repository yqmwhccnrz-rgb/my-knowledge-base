<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">马科维茨有效边界与风险分散</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="70" y1="330" x2="440" y2="330"/>
    <line x1="70" y1="330" x2="70" y2="70"/>
  </g>
  <text x="200" y="352" font-size="11" fill="#334155">σ_P 组合标准差（风险）</text>
  <text x="20" y="200" font-size="11" fill="#334155" transform="rotate(-90 20,200)">E(r_P) 期望收益</text>
  <!-- feasible set blob -->
  <path d="M110,320 Q90,250 120,190 Q160,140 230,150 Q300,158 340,200 Q370,240 350,300 Q300,330 200,332 Z" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="210" y="270" text-anchor="middle" font-size="11" fill="#0369a1">可行集</text>
  <!-- efficient frontier upper edge -->
  <path d="M120,190 Q160,140 230,150 Q300,158 340,200" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="250" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">有效边界（上半部）</text>
  <circle cx="120" cy="190" r="5" fill="#0891b2"/>
  <text x="66" y="186" font-size="10" fill="#0891b2">MVP</text>
  <text x="52" y="200" font-size="9" fill="#0891b2">最小方差</text>
  <!-- indifference curve tangent -->
  <path d="M90,250 Q210,205 380,120" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,4"/>
  <circle cx="228" cy="176" r="6" fill="#16a34a"/>
  <text x="240" y="180" font-size="11" font-weight="700" fill="#16a34a">最优组合</text>
  <text x="330" y="96" font-size="10" fill="#15803d">投资者无差异曲线</text>

  <!-- Right: risk decomposition -->
  <text x="660" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">组合风险的分解</text>
  <g font-size="12" fill="#1f2937">
    <rect x="500" y="88" width="360" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="680" y="111" text-anchor="middle" font-weight="700" fill="#991b1b">总风险 = 系统性风险 + 非系统性风险</text>
    <text x="680" y="130" text-anchor="middle" font-size="11" fill="#7f1d1d">σ_P 由协方差决定，而非个别方差平均</text>

    <rect x="500" y="158" width="172" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="586" y="182" text-anchor="middle" font-weight="600" fill="#9a3412">系统性风险</text>
    <text x="586" y="201" text-anchor="middle" font-size="11" fill="#7c2d12">市场共同因素</text>
    <text x="586" y="218" text-anchor="middle" font-size="11" fill="#7c2d12">不可分散（β）</text>

    <rect x="688" y="158" width="172" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="774" y="182" text-anchor="middle" font-weight="600" fill="#166534">非系统性风险</text>
    <text x="774" y="201" text-anchor="middle" font-size="11" fill="#166534">个别公司因素</text>
    <text x="774" y="218" text-anchor="middle" font-size="11" fill="#166534">可分散（多元化）</text>
  </g>
  <g font-size="11.5">
    <rect x="500" y="246" width="360" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="520" y="266" font-weight="700" fill="#1e3a8a">单一指数模型（夏普简化）</text>
    <text x="520" y="285" fill="#3730a3">r_i = α_i + β_i·r_M + ε_i</text>
    <text x="520" y="303" fill="#475569" font-size="11">β_i 衡量系统风险；ε_i 为可分散的特质风险</text>
  </g>
  <g font-size="11.5">
    <rect x="24" y="368" width="852" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="388" font-weight="700" fill="#334155">核心思想</text>
    <text x="44" y="406" fill="#475569">组合风险取决于资产间协方差（相关性）而非个别风险平均；资产数增多只能消除非系统风险，系统风险无法靠分散化消除。</text>
  </g>
</svg>
