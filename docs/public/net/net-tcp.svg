<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">TCP 三次握手与四次挥手</text>

  <defs>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- 左：三次握手 -->
  <rect x="16" y="46" width="322" height="286" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="177" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">① 建立连接：三次握手</text>
  <text x="66" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">客户端</text>
  <text x="286" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">服务端</text>
  <line x1="66" y1="92" x2="66" y2="268" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="286" y1="92" x2="286" y2="268" stroke="#94a3b8" stroke-dasharray="4 3"/>

  <line x1="66" y1="118" x2="282" y2="118" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="174" y="112" text-anchor="middle" font-size="9.5" fill="#1e3a8a">SYN=1, seq=x</text>
  <text x="174" y="133" text-anchor="middle" font-size="9" fill="#64748b">CLOSED → SYN-SENT ｜ 服务端 LISTEN</text>

  <line x1="286" y1="160" x2="70" y2="160" stroke="#15803d" stroke-width="1.6" marker-end="url(#arL)"/>
  <text x="174" y="154" text-anchor="middle" font-size="9.5" fill="#15803d">SYN=1, ACK=1, seq=y, ack=x+1</text>
  <text x="174" y="175" text-anchor="middle" font-size="9" fill="#64748b">服务端进入 SYN-RCVD（半连接队列）</text>

  <line x1="66" y1="202" x2="282" y2="202" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="174" y="196" text-anchor="middle" font-size="9.5" fill="#1e3a8a">ACK=1, seq=x+1, ack=y+1</text>
  <text x="174" y="217" text-anchor="middle" font-size="9" fill="#64748b">双方进入 ESTABLISHED，可开始传数据</text>

  <rect x="32" y="236" width="290" height="76" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="42" y="254" font-size="10" font-weight="700" fill="#991b1b">为什么不是两次？</text>
  <text x="42" y="271" font-size="9.5" fill="#334155">防止「已失效的连接请求报文段」突然又到达服务端，</text>
  <text x="42" y="287" font-size="9.5" fill="#334155">服务端误建连接并白白等待资源；三次握手让客户端</text>
  <text x="42" y="303" font-size="9.5" fill="#334155">能对历史 SYN 发 RST。SYN 不携带数据但消耗序号。</text>

  <!-- 右：四次挥手 -->
  <rect x="346" y="46" width="318" height="286" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">② 释放连接：四次挥手</text>
  <text x="396" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">主动方 A</text>
  <text x="614" y="86" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">被动方 B</text>
  <line x1="396" y1="92" x2="396" y2="268" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="614" y1="92" x2="614" y2="268" stroke="#94a3b8" stroke-dasharray="4 3"/>

  <line x1="396" y1="114" x2="610" y2="114" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="505" y="108" text-anchor="middle" font-size="9.5" fill="#1e3a8a">FIN=1, seq=u</text>
  <line x1="614" y1="146" x2="400" y2="146" stroke="#15803d" stroke-width="1.6" marker-end="url(#arL)"/>
  <text x="505" y="140" text-anchor="middle" font-size="9.5" fill="#15803d">ACK=1, ack=u+1</text>
  <text x="505" y="163" text-anchor="middle" font-size="9" fill="#64748b">A→B 方向关闭；B 仍可发数据（半关闭 CLOSE-WAIT）</text>

  <line x1="614" y1="190" x2="400" y2="190" stroke="#15803d" stroke-width="1.6" marker-end="url(#arL)"/>
  <text x="505" y="184" text-anchor="middle" font-size="9.5" fill="#15803d">FIN=1, seq=w, ack=u+1</text>
  <line x1="396" y1="222" x2="610" y2="222" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="505" y="216" text-anchor="middle" font-size="9.5" fill="#1e3a8a">ACK=1, ack=w+1</text>

  <rect x="362" y="236" width="286" height="76" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="372" y="254" font-size="10" font-weight="700" fill="#92400e">TIME-WAIT = 2MSL 的两个作用</text>
  <text x="372" y="271" font-size="9.5" fill="#334155">① 保证 A 的最后一个 ACK 能到达 B（丢失可重发）；</text>
  <text x="372" y="287" font-size="9.5" fill="#334155">② 让本连接所有旧报文段在网络中消散，避免被同</text>
  <text x="372" y="303" font-size="9.5" fill="#334155">四元组的新连接误收。B 收 ACK 后立即 CLOSED。</text>

  <line x1="16" y1="344" x2="664" y2="344" stroke="#e2e8f0"/>
  <text x="16" y="364" font-size="10.5" fill="#334155">• 状态：客户端 SYN-SENT → ESTABLISHED → FIN-WAIT-1/2 → TIME-WAIT → CLOSED；服务端 LISTEN → SYN-RCVD → ESTABLISHED → CLOSE-WAIT → LAST-ACK → CLOSED。</text>
  <text x="16" y="382" font-size="10.5" fill="#334155">• SYN / FIN 即使不携带数据也各消耗一个序号；ACK 若不携带数据则不消耗序号。SYN Flood 靠半连接队列耗尽资源，用 SYN Cookie 防御。</text>
  <text x="16" y="400" font-size="10.5" fill="#64748b">• TCP 连接由四元组（源 IP、源端口、目的 IP、目的端口）唯一确定，因此服务端一个 80 端口可同时服务大量客户端。</text>
</svg>
