<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">密码体制、数字签名、PKI 与安全协议层次</text>

  <!-- ① 对称 -->
  <rect x="16" y="46" width="318" height="118" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="28" y="66" font-size="11.5" font-weight="700" fill="#1e3a8a">① 对称密钥密码（快，用于加密数据）</text>
  <rect x="28" y="78" width="70" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="63" y="97" text-anchor="middle" font-size="10" fill="#1e3a8a">明文 P</text>
  <line x1="98" y1="93" x2="136" y2="93" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="138" y="78" width="80" height="30" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="178" y="97" text-anchor="middle" font-size="9.5" fill="#1e3a8a">E(K, P) → C</text>
  <line x1="218" y1="93" x2="252" y2="93" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="254" y="78" width="66" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="287" y="97" text-anchor="middle" font-size="10" fill="#1e3a8a">密文 C</text>
  <text x="28" y="128" font-size="9.5" fill="#334155">收发双方共用同一密钥 K；AES / ChaCha20 / SM4</text>
  <text x="28" y="146" font-size="9.5" fill="#64748b">难题：密钥分发（n 个用户需 n(n−1)/2 个密钥）</text>
  <text x="28" y="160" font-size="9.5" fill="#b91c1c">DES（56 bit）/ 3DES 已不安全，勿用于新系统</text>

  <!-- ② 公钥 -->
  <rect x="346" y="46" width="318" height="118" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="358" y="66" font-size="11.5" font-weight="700" fill="#5b21b6">② 公钥密码（慢，用于签名 / 密钥协商）</text>
  <text x="358" y="88" font-size="9.5" fill="#334155">每人一对：公钥公开、私钥保密；加密用对方公钥，</text>
  <text x="358" y="106" font-size="9.5" fill="#334155">解密用自己的私钥。基于单向陷门函数：</text>
  <text x="358" y="124" font-size="9.5" fill="#334155">RSA（大数分解）、ECC（椭圆曲线）、DH 密钥交换。</text>
  <text x="358" y="142" font-size="9.5" fill="#334155">难题：公钥的真实性 → 由 CA 证书绑定身份。</text>
  <text x="358" y="160" font-size="9.5" fill="#64748b">实际系统用混合：公钥协商会话密钥 + 对称加密数据</text>

  <!-- ③ 数字签名 -->
  <rect x="16" y="174" width="318" height="128" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="28" y="194" font-size="11.5" font-weight="700" fill="#15803d">③ 数字签名（私钥签、公钥验）</text>
  <text x="28" y="214" font-size="9.5" fill="#334155">发送方：报文 → 哈希 H(M) → 用<tspan font-weight="700">自己私钥</tspan>签名 → 附在报文后</text>
  <text x="28" y="232" font-size="9.5" fill="#334155">接收方：用<tspan font-weight="700">发送方公钥</tspan>验签，并重新计算哈希比对</text>
  <rect x="28" y="242" width="294" height="24" rx="4" fill="#dcfce7"/>
  <text x="175" y="258" text-anchor="middle" font-size="9.5" fill="#14532d">报文鉴别 ✔  完整性 ✔  不可否认 ✔</text>
  <text x="28" y="284" font-size="9.5" fill="#b91c1c">签名不提供保密性！要保密需再加密。</text>
  <text x="28" y="298" font-size="9.5" fill="#64748b">报文鉴别码 MAC/HMAC 共享密钥，不能防抵赖；MD5/SHA-1 已禁用</text>

  <!-- ④ PKI / CA -->
  <rect x="346" y="174" width="318" height="128" rx="8" fill="#ffffff" stroke="#b45309"/>
  <text x="358" y="194" font-size="11.5" font-weight="700" fill="#92400e">④ CA / X.509 证书与 PKI</text>
  <text x="358" y="214" font-size="9.5" fill="#334155">CA 把「实体身份 ↔ 公钥」绑定成证书，并用 CA 私钥签名；</text>
  <text x="358" y="232" font-size="9.5" fill="#334155">终端用内置的根 CA 公钥逐级验证证书链（根 → 中间 → 叶）。</text>
  <rect x="358" y="242" width="294" height="24" rx="4" fill="#fef3c7"/>
  <text x="505" y="258" text-anchor="middle" font-size="9.5" fill="#78350f">证书含有效期 / 域名 / 公钥 / CA 签名</text>
  <text x="358" y="284" font-size="9.5" fill="#334155">吊销用 CRL / OCSP；对称体制下则由 KDC（Kerberos）分发会话密钥。</text>
  <text x="358" y="298" font-size="9.5" fill="#64748b">TLS 握手先验证证书链与域名，再用 ECDHE 协商会话密钥</text>

  <!-- 层次表 -->
  <text x="16" y="326" font-size="11.5" font-weight="700" fill="#334155">⑤ 安全协议所在的层次（保护范围逐层不同）</text>
  <rect x="16" y="336" width="648" height="24" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="24" y="353" font-size="9.5" font-weight="700" fill="#334155">层次</text>
  <text x="140" y="353" font-size="9.5" font-weight="700" fill="#334155">协议</text>
  <text x="400" y="353" font-size="9.5" font-weight="700" fill="#334155">保护范围</text>
  <line x1="132" y1="336" x2="132" y2="392" stroke="#cbd5e1"/>
  <line x1="392" y1="336" x2="392" y2="392" stroke="#cbd5e1"/>
  <text x="24" y="374" font-size="9.5" fill="#1e293b">应用层</text>
  <text x="140" y="374" font-size="9.5" fill="#1e293b">PGP / S/MIME / SSH / HTTPS 鉴权</text>
  <text x="400" y="374" font-size="9.5" fill="#1e293b">特定应用，可端到端</text>
  <text x="24" y="390" font-size="9.5" fill="#1e293b">运输 / 网络 / 链路</text>
  <text x="140" y="390" font-size="9.5" fill="#1e293b">TLS1.3、DTLS ｜ IPsec(AH/ESP) ｜ WPA3</text>
  <text x="400" y="390" font-size="9.5" fill="#1e293b">进程间 / 主机间 / 一段链路</text>

  <text x="16" y="412" font-size="10" fill="#64748b">• 课件提到的 SSL 3.0 / TLS 1.0 已被禁用，应使用 TLS 1.3（1-RTT、强制前向保密、仅 AEAD 套件）；另有 HSTS、证书透明度、零信任与国密 SM2/SM3/SM4/SM9。</text>
</svg>
