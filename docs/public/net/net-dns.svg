<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">DNS 解析流程与应用层端口速查</text>

  <defs>
    <marker id="arD" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 左：解析流程 -->
  <rect x="16" y="46" width="330" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="66" font-size="11.5" font-weight="700" fill="#334155">主机查询 www.example.com 的 IP（递归 + 迭代）</text>

  <rect x="28" y="78" width="120" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="88" y="97" text-anchor="middle" font-size="10" fill="#1e3a8a">① 主机</text>
  <rect x="206" y="78" width="126" height="30" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="269" y="97" text-anchor="middle" font-size="10" fill="#14532d">② 本地 DNS（递归解析器）</text>
  <line x1="148" y1="93" x2="202" y2="93" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arD)"/>
  <text x="175" y="86" text-anchor="middle" font-size="8.5" fill="#2563eb">递归查询</text>
  <text x="28" y="126" font-size="9.5" fill="#64748b">「请替我查到底，给我最终 IP」；缓存命中就直接返回</text>

  <rect x="206" y="138" width="126" height="26" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="269" y="156" text-anchor="middle" font-size="9.5" fill="#92400e">③ 根域名服务器</text>
  <line x1="269" y1="108" x2="269" y2="136" stroke="#b45309" stroke-width="1.3" marker-end="url(#arD)"/>

  <rect x="206" y="178" width="126" height="26" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="269" y="196" text-anchor="middle" font-size="9.5" fill="#92400e">④ TLD（.com）服务器</text>
  <line x1="269" y1="164" x2="269" y2="176" stroke="#b45309" stroke-width="1.3" marker-end="url(#arD)"/>

  <rect x="206" y="218" width="126" height="26" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="269" y="236" text-anchor="middle" font-size="9.5" fill="#92400e">⑤ 权限域名服务器</text>
  <line x1="269" y1="204" x2="269" y2="216" stroke="#b45309" stroke-width="1.3" marker-end="url(#arD)"/>

  <text x="30" y="151" font-size="9.5" fill="#334155">迭代查询：根只回答「去问 .com」</text>
  <text x="30" y="191" font-size="9.5" fill="#334155">TLD 回答「去问该域的 NS」</text>
  <text x="30" y="231" font-size="9.5" fill="#334155">权限服务器给出 A / AAAA 记录</text>
  <text x="30" y="262" font-size="9.5" fill="#15803d">⑥ 本地 DNS 缓存结果（按 TTL）并返回主机</text>
  <text x="30" y="280" font-size="9.5" fill="#15803d">⑦ 主机用该 IP 建立 TCP/TLS 连接</text>
  <text x="30" y="308" font-size="9.5" fill="#64748b">资源记录：A / AAAA / CNAME / MX / NS / PTR / SOA / TXT</text>
  <text x="30" y="326" font-size="9.5" fill="#64748b">DNS 用 UDP 53；区域传送或大响应可用 TCP 53</text>

  <!-- 右：端口速查 -->
  <rect x="356" y="46" width="308" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="368" y="66" font-size="11.5" font-weight="700" fill="#334155">熟知端口速查（0 ~ 1023）</text>
  <rect x="366" y="76" width="288" height="22" fill="#f1f5f9"/>
  <text x="374" y="91" font-size="9.5" font-weight="700" fill="#334155">协议 / 应用</text>
  <text x="520" y="91" font-size="9.5" font-weight="700" fill="#334155">运输层与端口</text>
  <text x="374" y="112" font-size="9.5" fill="#1e293b">DNS 域名解析</text>
  <text x="520" y="112" font-size="9.5" fill="#1e293b">UDP/TCP 53</text>
  <text x="374" y="131" font-size="9.5" fill="#1e293b">FTP 控制 / 数据</text>
  <text x="520" y="131" font-size="9.5" fill="#1e293b">TCP 21 / 20</text>
  <text x="374" y="150" font-size="9.5" fill="#1e293b">TFTP / TELNET / SSH</text>
  <text x="520" y="150" font-size="9.5" fill="#1e293b">UDP 69 / TCP 23 / 22</text>
  <text x="374" y="169" font-size="9.5" fill="#1e293b">SMTP / POP3 / IMAP</text>
  <text x="520" y="169" font-size="9.5" fill="#1e293b">TCP 25 / 110 / 143</text>
  <text x="374" y="188" font-size="9.5" fill="#1e293b">DHCP 服务器 / 客户端</text>
  <text x="520" y="188" font-size="9.5" fill="#1e293b">UDP 67 / 68</text>
  <text x="374" y="207" font-size="9.5" fill="#1e293b">HTTP / HTTPS</text>
  <text x="520" y="207" font-size="9.5" fill="#1e293b">TCP 80 / 443</text>
  <text x="374" y="226" font-size="9.5" fill="#1e293b">SNMP get / trap</text>
  <text x="520" y="226" font-size="9.5" fill="#1e293b">UDP 161 / 162</text>
  <text x="374" y="245" font-size="9.5" fill="#1e293b">RTSP / SIP</text>
  <text x="520" y="245" font-size="9.5" fill="#1e293b">554 / 5060</text>
  <text x="374" y="264" font-size="9.5" fill="#1e293b">RTP / RTCP</text>
  <text x="520" y="264" font-size="9.5" fill="#1e293b">UDP 偶数 / 相邻奇数</text>
  <text x="368" y="292" font-size="9.5" fill="#64748b">端口分用：网络层只送到主机，运输层</text>
  <text x="368" y="310" font-size="9.5" fill="#64748b">按端口把数据交给具体应用进程。</text>
  <text x="368" y="328" font-size="9.5" fill="#64748b">套接字 = IP 地址 : 端口号。</text>

  <line x1="16" y1="348" x2="664" y2="348" stroke="#e2e8f0"/>
  <text x="16" y="368" font-size="10.5" fill="#334155">• 域名是层次树状结构，不区分大小写；全球 13 个「逻辑」根服务器，实际通过任播部署数百台镜像。</text>
  <text x="16" y="386" font-size="10.5" fill="#334155">• 传统 DNS 明文且不认证：DNSSEC 用签名保证真实性，DoT(853) / DoH(443) 用 TLS/HTTPS 保护隐私。</text>
  <text x="16" y="404" font-size="10" fill="#64748b">• CDN 与 DNS 负载均衡会对同一域名返回不同 IP，因此「域名 ↔ IP 一一对应」是错的。</text>
</svg>
