<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">802.11 CSMA/CA：帧间隔、确认、隐藏站与 RTS/CTS</text>

  <!-- 时序 -->
  <rect x="16" y="44" width="648" height="142" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="62" font-size="11.5" font-weight="700" fill="#334155">① 一次成功发送的时间序列（SIFS &lt; DIFS，ACK 优先抢占信道）</text>
  <text x="28" y="88" font-size="10" fill="#1e293b">发送站</text>
  <text x="28" y="128" font-size="10" fill="#1e293b">接收站</text>
  <text x="28" y="164" font-size="10" fill="#1e293b">其他站</text>

  <rect x="96" y="74" width="70" height="26" rx="3" fill="#e2e8f0" stroke="#64748b"/>
  <text x="131" y="92" text-anchor="middle" font-size="9.5" fill="#334155">DIFS</text>
  <rect x="166" y="74" width="76" height="26" rx="3" fill="#fed7aa" stroke="#c2410c"/>
  <text x="204" y="92" text-anchor="middle" font-size="9.5" fill="#7c2d12">随机退避</text>
  <rect x="242" y="74" width="170" height="26" rx="3" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="327" y="92" text-anchor="middle" font-size="10" fill="#1e3a8a">DATA 帧（含 NAV 时长）</text>
  <rect x="412" y="74" width="52" height="26" rx="3" fill="#e2e8f0" stroke="#64748b"/>
  <text x="438" y="92" text-anchor="middle" font-size="9" fill="#334155">SIFS</text>
  <rect x="464" y="114" width="80" height="26" rx="3" fill="#bbf7d0" stroke="#15803d"/>
  <text x="504" y="132" text-anchor="middle" font-size="9.5" fill="#14532d">ACK 帧</text>
  <rect x="96" y="152" width="448" height="20" rx="3" fill="#fef3c7" stroke="#b45309"/>
  <text x="320" y="166" text-anchor="middle" font-size="9.5" fill="#92400e">NAV：其他站按帧中「持续时间」保持虚拟载波静默，不竞争信道</text>
  <text x="556" y="92" font-size="9.5" fill="#64748b">收不到 ACK</text>
  <text x="556" y="108" font-size="9.5" fill="#64748b">就重传</text>

  <!-- 隐藏站 -->
  <rect x="16" y="196" width="318" height="140" rx="8" fill="#ffffff" stroke="#b91c1c"/>
  <text x="28" y="216" font-size="11.5" font-weight="700" fill="#991b1b">② 隐藏站问题（为什么不能用 CSMA/CD）</text>
  <rect x="36" y="240" width="62" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="67" y="262" text-anchor="middle" font-size="11" fill="#1e3a8a">站 A</text>
  <rect x="130" y="240" width="62" height="34" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="161" y="262" text-anchor="middle" font-size="11" fill="#14532d">AP B</text>
  <rect x="224" y="240" width="62" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="255" y="262" text-anchor="middle" font-size="11" fill="#1e3a8a">站 C</text>
  <line x1="98" y1="257" x2="128" y2="257" stroke="#15803d" stroke-width="2"/>
  <line x1="192" y1="257" x2="222" y2="257" stroke="#15803d" stroke-width="2"/>
  <line x1="98" y1="288" x2="222" y2="288" stroke="#b91c1c" stroke-dasharray="5 3"/>
  <text x="161" y="302" text-anchor="middle" font-size="9.5" fill="#b91c1c">A 与 C 互相听不到（彼此是隐藏站）</text>
  <text x="28" y="322" font-size="9.5" fill="#334155">A、C 同时向 B 发送 → 在 B 处碰撞，但双方都检测不到</text>

  <!-- RTS/CTS -->
  <rect x="346" y="196" width="318" height="140" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="358" y="216" font-size="11.5" font-weight="700" fill="#15803d">③ RTS/CTS + NAV 解决隐藏站</text>
  <text x="358" y="238" font-size="9.5" fill="#334155">① A 先发 RTS（申请信道，含预计占用时长）</text>
  <text x="358" y="257" font-size="9.5" fill="#334155">② B 广播回 CTS（同意，并声明时长）</text>
  <text x="358" y="276" font-size="9.5" fill="#334155">③ 听到 CTS 的 C 设置 NAV，静默等待</text>
  <text x="358" y="295" font-size="9.5" fill="#334155">④ A 发 DATA → B 回 ACK（SIFS 后）</text>
  <rect x="358" y="306" width="294" height="22" rx="4" fill="#dcfce7"/>
  <text x="505" y="321" text-anchor="middle" font-size="9.5" fill="#14532d">代价是额外握手开销，故通常只对长帧启用</text>

  <line x1="16" y1="346" x2="664" y2="346" stroke="#e2e8f0"/>
  <text x="16" y="366" font-size="10.5" fill="#334155">• 无线无法「边发边听」（自身发射信号淹没接收信号），因此 802.11 用<tspan font-weight="700">碰撞避免 + 每个单播帧必须 ACK</tspan>，而不是以太网的碰撞检测。</text>
  <text x="16" y="384" font-size="10.5" fill="#334155">• 帧间隔：SIFS 最短（ACK/CTS 用）→ DIFS（普通竞争前等待）→ 退避计数器只在信道空闲时递减；信道忙则冻结。</text>
  <text x="16" y="402" font-size="10.5" fill="#64748b">• DCF（分布式竞争）是必选且唯一广泛使用的；PCF（AP 集中轮询）基本未落地。802.11 MAC 帧最多含 4 个地址字段，支持 ESS 内经 AP 转发。</text>
</svg>
