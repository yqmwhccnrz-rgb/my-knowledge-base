<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arJ" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">年金公式树：一个母公式推出全部</text>

  <!-- root -->
  <rect x="300" y="44" width="300" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="450" y="66" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">母公式：aₙ = (1−vⁿ)/i</text>
  <text x="450" y="84" text-anchor="middle" font-size="11.5" fill="#334155">期末付、每年 1 元、n 年（v = 1/(1+i)）</text>

  <!-- level 2: four branches -->
  <line x1="450" y1="92" x2="450" y2="112" stroke="#475569" stroke-width="1.3"/>
  <line x1="120" y1="112" x2="780" y2="112" stroke="#475569" stroke-width="1.3"/>
  <line x1="120" y1="112" x2="120" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arJ)"/>
  <line x1="340" y1="112" x2="340" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arJ)"/>
  <line x1="560" y1="112" x2="560" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arJ)"/>
  <line x1="780" y1="112" x2="780" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arJ)"/>

  <rect x="30" y="132" width="180" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="120" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">期初付（提前一期）</text>
  <text x="120" y="172" text-anchor="middle" font-size="11.5" fill="#166534">äₙ = (1+i)·aₙ</text>
  <text x="120" y="190" text-anchor="middle" font-size="11.5" fill="#166534">= (1−vⁿ)/d</text>

  <rect x="250" y="132" width="180" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="340" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">每年付 m 次</text>
  <text x="340" y="172" text-anchor="middle" font-size="11.5" fill="#7f1d1d">aₙ⁽ᵐ⁾ = (i/i⁽ᵐ⁾)·aₙ</text>
  <text x="340" y="190" text-anchor="middle" font-size="11.5" fill="#7f1d1d">äₙ⁽ᵐ⁾ = (i/d⁽ᵐ⁾)·aₙ</text>

  <rect x="470" y="132" width="180" height="74" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.4"/>
  <text x="560" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">连续支付（m→∞）</text>
  <text x="560" y="172" text-anchor="middle" font-size="11.5" fill="#6b21a8">āₙ = (1−vⁿ)/δ</text>
  <text x="560" y="190" text-anchor="middle" font-size="11.5" fill="#6b21a8">= (i/δ)·aₙ</text>

  <rect x="690" y="132" width="180" height="74" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="780" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">终值（累积 n 期）</text>
  <text x="780" y="172" text-anchor="middle" font-size="11.5" fill="#9a3412">sₙ = aₙ(1+i)ⁿ</text>
  <text x="780" y="190" text-anchor="middle" font-size="11.5" fill="#9a3412">= [(1+i)ⁿ−1]/i</text>

  <!-- perpetuity -->
  <rect x="30" y="232" width="400" height="66" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="230" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">永续年金（n→∞）</text>
  <text x="230" y="276" text-anchor="middle" font-size="11.5" fill="#475569">a∞ = 1/i    ä∞ = 1/d    a∞⁽ᵐ⁾ = 1/i⁽ᵐ⁾    ā∞ = 1/δ</text>

  <!-- deferred -->
  <rect x="470" y="232" width="400" height="66" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="670" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">延期 m 期</text>
  <text x="670" y="276" text-anchor="middle" font-size="11.5" fill="#475569">ₘ|aₙ = vᵐ·aₙ = a₍ₘ₊ₙ₎ − aₘ</text>

  <!-- varying annuities -->
  <text x="450" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">变额年金三大类（期末付现值）</text>

  <rect x="30" y="344" width="270" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="165" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">递增 (Ia)ₙ：1,2,…,n</text>
  <text x="165" y="388" text-anchor="middle" font-size="12" fill="#334155">(Ia)ₙ = (äₙ − nvⁿ)/i</text>
  <text x="165" y="408" text-anchor="middle" font-size="11.5" fill="#475569">递减 (Da)ₙ：n,n−1,…,1</text>
  <text x="165" y="428" text-anchor="middle" font-size="12" fill="#334155">(Da)ₙ = (n − aₙ)/i</text>

  <rect x="320" y="344" width="260" height="100" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
  <text x="450" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#be185d">复递增 (Ca)ₙ：按 (1+r) 增长</text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="#9d174d">= [1−(1+j)⁻ⁿ]/(1+r)j</text>
  <text x="450" y="408" text-anchor="middle" font-size="11.5" fill="#475569">j = (i−r)/(1+r) 净利率</text>
  <text x="450" y="428" text-anchor="middle" font-size="11.5" fill="#475569">r = i 时：(Ca)ₙ = n/(1+i)</text>

  <rect x="600" y="344" width="270" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="735" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">连续支付变额</text>
  <text x="735" y="388" text-anchor="middle" font-size="12" fill="#166534">(Iā)ₙ = (āₙ − nvⁿ)/δ</text>
  <text x="735" y="408" text-anchor="middle" font-size="12" fill="#166534">(Dā)ₙ = (n − āₙ)/δ</text>
  <text x="735" y="428" text-anchor="middle" font-size="11.5" fill="#166534">连续递增永续 (Iā)∞ = 1/δ²</text>

  <text x="450" y="474" text-anchor="middle" font-size="11.5" fill="#64748b">通用换算：每年 m 次 = 每年 1 次 × i/i⁽ᵐ⁾（期末）或 i/d⁽ᵐ⁾（期初）；连续 = 每年 1 次 × i/δ；期初 = 期末 × (1+i)^(1/m)</text>
  <text x="450" y="496" text-anchor="middle" font-size="11.5" fill="#64748b">终值 = 现值 × (1+i)ⁿ；一般连续现金流：PV = ∫ₐᵇ p(t)·exp[−∫₀ᵗδ(s)ds]dt</text>
</svg>
