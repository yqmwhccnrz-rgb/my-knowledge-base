<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arI" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">利息度量工具全家福：以累积函数 a(t) 为中心的换算网络</text>

  <!-- center -->
  <rect x="330" y="52" width="240" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="450" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">累积函数 a(t) = (1+i)ᵗ</text>
  <text x="450" y="96" text-anchor="middle" font-size="12" fill="#334155">贴现函数 a⁻¹(t) = vᵗ = (1−d)ᵗ</text>

  <!-- left column: rates -->
  <rect x="30" y="150" width="200" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="130" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">实际利率 i</text>
  <text x="130" y="190" text-anchor="middle" font-size="11" fill="#7f1d1d">期末利息 / 期初本金</text>

  <rect x="30" y="222" width="200" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="130" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">名义利率 i⁽ᵐ⁾</text>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#9a3412">每年复利 m 次，每期 i⁽ᵐ⁾/m</text>

  <rect x="30" y="294" width="200" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="130" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">利息力 δ</text>
  <text x="130" y="334" text-anchor="middle" font-size="11" fill="#166534">δ = ln(1+i)，连续复利</text>

  <!-- right column -->
  <rect x="670" y="150" width="200" height="52" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
  <text x="770" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">实际贴现率 d</text>
  <text x="770" y="190" text-anchor="middle" font-size="11" fill="#9d174d">期初预收利息 / 期末累积值</text>

  <rect x="670" y="222" width="200" height="52" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.4"/>
  <text x="770" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">名义贴现率 d⁽ᵐ⁾</text>
  <text x="770" y="262" text-anchor="middle" font-size="11" fill="#6b21a8">每年贴现 m 次，每期 d⁽ᵐ⁾/m</text>

  <rect x="670" y="294" width="200" height="52" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="770" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">贴现因子 v</text>
  <text x="770" y="334" text-anchor="middle" font-size="11" fill="#075985">v = 1/(1+i) = 1−d</text>

  <!-- arrows from center -->
  <line x1="360" y1="108" x2="170" y2="150" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>
  <line x1="345" y1="108" x2="140" y2="222" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>
  <line x1="345" y1="108" x2="145" y2="294" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>
  <line x1="540" y1="108" x2="730" y2="150" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>
  <line x1="555" y1="108" x2="760" y2="222" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>
  <line x1="555" y1="108" x2="755" y2="294" stroke="#475569" stroke-width="1.2" marker-end="url(#arI)"/>

  <!-- middle formulas -->
  <rect x="290" y="150" width="320" height="196" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">核心换算关系（复利条件下）</text>
  <text x="306" y="196" font-size="12" fill="#334155">1+i = (1+i⁽ᵐ⁾/m)ᵐ = (1−d)⁻¹ = eᵈ</text>
  <text x="306" y="218" font-size="12" fill="#334155">d = i/(1+i) = iv      i = d/(1−d)</text>
  <text x="306" y="240" font-size="12" fill="#334155">i − d = id             d = 1 − v</text>
  <text x="306" y="262" font-size="12" fill="#334155">i⁽ᵐ⁾/m − d⁽ᵐ⁾/m = i⁽ᵐ⁾d⁽ᵐ⁾/m²</text>
  <text x="306" y="284" font-size="12" fill="#334155">δ = ln(1+i) = −ln(1−d) = −ln v</text>
  <text x="306" y="306" font-size="12" fill="#334155">lim i⁽ᵐ⁾ = lim d⁽ᵐ⁾ = δ  (m→∞)</text>
  <text x="306" y="330" font-size="11.5" fill="#64748b">a(t) = (1+i)ᵗ = (1−d)⁻ᵗ = e^δᵗ = exp(∫₀ᵗδ(s)ds)</text>

  <!-- ordering -->
  <rect x="60" y="382" width="780" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="450" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">等价工具的数值大小关系（m &lt; n，如 m=2、n=12）</text>
  <text x="450" y="432" text-anchor="middle" font-size="13.5" fill="#78350f">d ≤ d⁽ⁿ⁾ ≤ d⁽ᵐ⁾ ≤ δ ≤ i⁽ᵐ⁾ ≤ i⁽ⁿ⁾ ≤ i</text>
  <text x="450" y="458" text-anchor="middle" font-size="11.5" fill="#92400e">记忆：支付越早数值越小（贴现率年初收 → 最小；利率年末收 → 最大；利息力连续收 → 居中）</text>
</svg>
