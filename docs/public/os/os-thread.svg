<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="390" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">三种线程实现模型与优缺点</text>

  <defs>
    <marker id="t1" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#475569"/></marker>
  </defs>

  <rect x="24" y="48" width="204" height="238" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="126" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">多对一 · 用户级线程 ULT</text>
  <text x="126" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">线程库在用户态管理</text>
  <rect x="52" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="74" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T1</text>
  <rect x="107" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="129" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T2</text>
  <rect x="162" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="184" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T3</text>
  <line x1="126" y1="126" x2="126" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <rect x="66" y="146" width="120" height="30" rx="5" fill="#e0e7ff" stroke="#4f46e5"/><text x="126" y="166" text-anchor="middle" font-size="10" fill="#3730a3">1 个内核调度实体</text>
  <line x1="126" y1="176" x2="126" y2="192" stroke="#475569" marker-end="url(#t1)"/>
  <rect x="86" y="196" width="80" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="126" y="215" text-anchor="middle" font-size="10" fill="#166534">CPU 单核</text>
  <text x="38" y="244" font-size="9.5" fill="#166534">＋ 切换不陷内核、可自定义调度</text>
  <text x="38" y="261" font-size="9.5" fill="#991b1b">－ 一处阻塞则全进程阻塞</text>
  <text x="38" y="278" font-size="9.5" fill="#991b1b">－ 多线程无法在多核上并行</text>

  <rect x="238" y="48" width="204" height="238" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">一对一 · 内核级线程 KLT</text>
  <text x="340" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">内核逐线程调度（Linux NPTL）</text>
  <rect x="266" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="288" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T1</text>
  <rect x="321" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="343" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T2</text>
  <rect x="376" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="398" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T3</text>
  <line x1="288" y1="126" x2="288" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <line x1="343" y1="126" x2="343" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <line x1="398" y1="126" x2="398" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <rect x="266" y="146" width="44" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="288" y="164" text-anchor="middle" font-size="9" fill="#5b21b6">K1</text>
  <rect x="321" y="146" width="44" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="343" y="164" text-anchor="middle" font-size="9" fill="#5b21b6">K2</text>
  <rect x="376" y="146" width="44" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="398" y="164" text-anchor="middle" font-size="9" fill="#5b21b6">K3</text>
  <rect x="266" y="196" width="44" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="288" y="215" text-anchor="middle" font-size="9" fill="#166534">核1</text>
  <rect x="321" y="196" width="44" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="343" y="215" text-anchor="middle" font-size="9" fill="#166534">核2</text>
  <rect x="376" y="196" width="44" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="398" y="215" text-anchor="middle" font-size="9" fill="#166534">核3</text>
  <text x="252" y="244" font-size="9.5" fill="#166534">＋ 一个阻塞不影响其它，可真并行</text>
  <text x="252" y="261" font-size="9.5" fill="#991b1b">－ 切换需陷入内核，开销较大</text>
  <text x="252" y="278" font-size="9.5" fill="#64748b">　 线程数多时内核资源占用高</text>

  <rect x="452" y="48" width="204" height="238" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="554" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">多对多 · 混合 / 两级</text>
  <text x="554" y="88" text-anchor="middle" font-size="9.5" fill="#64748b">用户线程复用少量内核实体</text>
  <rect x="480" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="502" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T1</text>
  <rect x="535" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="557" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T2</text>
  <rect x="590" y="100" width="44" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="612" y="118" text-anchor="middle" font-size="9" fill="#1e3a8a">T3</text>
  <line x1="520" y1="126" x2="520" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <line x1="590" y1="126" x2="590" y2="142" stroke="#475569" marker-end="url(#t1)"/>
  <rect x="484" y="146" width="72" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="520" y="164" text-anchor="middle" font-size="9" fill="#5b21b6">LWP1</text>
  <rect x="566" y="146" width="72" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="602" y="164" text-anchor="middle" font-size="9" fill="#5b21b6">LWP2</text>
  <rect x="484" y="196" width="72" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="520" y="215" text-anchor="middle" font-size="9" fill="#166534">核1</text>
  <rect x="566" y="196" width="72" height="28" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="602" y="215" text-anchor="middle" font-size="9" fill="#166534">核2</text>
  <text x="466" y="244" font-size="9.5" fill="#166534">＋ 兼顾灵活调度与多核并行</text>
  <text x="466" y="261" font-size="9.5" fill="#991b1b">－ 实现最复杂，须处理阻塞激活</text>
  <text x="466" y="278" font-size="9.5" fill="#64748b">　 现代回归：协程 / 虚拟线程</text>

  <rect x="24" y="300" width="632" height="72" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="36" y="320" font-size="11" font-weight="700" fill="#92400e">共享与独占（同一进程内）</text>
  <text x="36" y="339" font-size="10" fill="#78350f">共享：地址空间 / 全局变量 / 打开的文件表 / 信号处理器 / 代码段与堆</text>
  <text x="36" y="358" font-size="10" fill="#78350f">独享：线程 ID、TCB、栈、寄存器上下文、PC、errno、线程私有存储；同进程线程切换不需换页表</text>
</svg>
