<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">信号量 PV 机制与生产者-消费者问题</text>

  <defs><marker id="v1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker></defs>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">记录型信号量（P = wait，V = signal，均为原子操作）</text>
  <rect x="30" y="62" width="290" height="94" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="42" y="82" font-size="10.5" font-weight="700" fill="#1e3a8a">P(S)：S.value--</text>
  <text x="42" y="101" font-size="10" fill="#1e40af">若 value &lt; 0：本进程自我阻塞，插入等待队列 L</text>
  <text x="42" y="120" font-size="10" fill="#1e40af">value &gt; 0：表示可用资源数；value &lt; 0：|value| 为阻塞进程数</text>
  <text x="42" y="141" font-size="10" fill="#1e40af">P 可能阻塞；V 永不阻塞</text>
  <rect x="30" y="164" width="290" height="76" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="184" font-size="10.5" font-weight="700" fill="#166534">V(S)：S.value++</text>
  <text x="42" y="203" font-size="10" fill="#15803d">若 value ≤ 0：从 L 唤醒一个等待进程</text>
  <text x="42" y="225" font-size="10" fill="#15803d">唤醒是被动的（由别的进程或中断执行 V）</text>

  <text x="350" y="52" font-size="12" font-weight="700" fill="#334155">生产者-消费者（n 个缓冲区，三类信号量）</text>
  <rect x="350" y="62" width="300" height="178" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="362" y="82" font-size="10" fill="#475569">semaphore mutex = 1;　empty = n;　full = 0;</text>
  <text x="362" y="104" font-size="10.5" font-weight="700" fill="#1e3a8a">producer()：</text>
  <text x="362" y="122" font-size="10" fill="#334155">　produce(item);　P(empty);　P(mutex);</text>
  <text x="362" y="139" font-size="10" fill="#334155">　append(item);　V(mutex);　V(full);</text>
  <text x="362" y="163" font-size="10.5" font-weight="700" fill="#166534">consumer()：</text>
  <text x="362" y="181" font-size="10" fill="#334155">　P(full);　P(mutex);　item = take();</text>
  <text x="362" y="198" font-size="10" fill="#334155">　V(mutex);　V(empty);　consume(item);</text>
  <text x="362" y="224" font-size="9.5" fill="#dc2626">顺序铁律：先同步 P(empty/full)，后互斥 P(mutex)</text>

  <rect x="30" y="252" width="620" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="42" y="272" font-size="11" font-weight="700" fill="#991b1b">反例：把两个 P 颠倒会死锁</text>
  <text x="42" y="291" font-size="10" fill="#7f1d1d">若先 P(mutex) 再 P(empty)：缓冲区满时生产者持着互斥锁阻塞，消费者永远进不去取数据 → 互相等待。</text>

  <rect x="30" y="314" width="620" height="72" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="334" font-size="11" font-weight="700" fill="#92400e">其它经典结构速记</text>
  <text x="42" y="353" font-size="10" fill="#78350f">读者-写者：readcount + rmutex + wmutex，首个读者上锁、末个读者解锁（读者优先会让写者饥饿）。</text>
  <text x="42" y="372" font-size="10" fill="#78350f">哲学家进餐：room=4 限人数 / 奇偶号反向取叉 / AND 型信号量原子取两叉；三者都在破坏环路等待。</text>
</svg>
