<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">请求分页：页面置换算法与 Belady 异常</text>

  <text x="30" y="52" font-size="11" font-weight="700" fill="#334155">① 经典页面走向（20 次访问，3 个物理块）</text>
  <rect x="30" y="62" width="620" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="42" y="82" font-size="10" fill="#334155">7　0　1　2　0　3　0　4　2　3　0　3　2　1　2　0　1　7　0　1</text>

  <rect x="30" y="102" width="196" height="62" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="128" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">FIFO 先进先出</text>
  <text x="128" y="144" text-anchor="middle" font-size="12" fill="#991b1b">15 次缺页 / 75.0%</text>
  <rect x="242" y="102" width="196" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">LRU 最近最久未用</text>
  <text x="340" y="144" text-anchor="middle" font-size="12" fill="#166534">12 次缺页 / 60.0%</text>
  <rect x="454" y="102" width="196" height="62" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="552" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">OPT 最佳（不可实现）</text>
  <text x="552" y="144" text-anchor="middle" font-size="12" fill="#1e3a8a">9 次缺页 / 45.0%</text>

  <text x="30" y="190" font-size="11" font-weight="700" fill="#334155">② Belady 异常：增加物理块，FIFO 缺页反而变多</text>
  <text x="30" y="208" font-size="9.5" fill="#64748b">页面走向：1 2 3 4 1 2 5 1 2 3 4 5（12 次访问）</text>
  <rect x="30" y="216" width="300" height="76" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="236" font-size="10" font-weight="700" fill="#92400e">FIFO：3 块 = 9 次　→　4 块 = 10 次（异常）</text>
  <text x="42" y="256" font-size="9.5" fill="#78350f">原因：FIFO 不满足栈式性质（n 块驻留集不是 n+1 块的子集）</text>
  <text x="42" y="277" font-size="9.5" fill="#78350f">只按"进入先后"淘汰，可能把马上要用的页换出</text>
  <rect x="350" y="216" width="300" height="76" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="362" y="236" font-size="10" font-weight="700" fill="#166534">LRU：3 块 = 10 次　→　4 块 = 8 次（正常）</text>
  <text x="362" y="256" font-size="9.5" fill="#15803d">另一组 4 3 2 1 4 3 5 4 3 2 1 5：</text>
  <text x="362" y="277" font-size="9.5" fill="#15803d">FIFO 3 块 9 次 / 4 块 10 次；LRU 10 次 / 8 次</text>

  <rect x="30" y="302" width="620" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="42" y="320" font-size="10.5" font-weight="700" fill="#5b21b6">改进型 Clock：按 (访问位 A, 修改位 D) 四类依次扫描淘汰</text>
  <text x="42" y="337" font-size="10" fill="#4c1d95">(0,0) 优先换出且无需写回 → (0,1) 需写回 → (1,0) 清 A 给一次机会 → (1,1) 最后考虑</text>

  <rect x="30" y="352" width="620" height="38" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="42" y="377" font-size="10" fill="#991b1b">EAT = (1−p)·ma + p·缺页处理时间：ma=100 ns、缺页处理 8 ms 时，p=1% 已使访问时间放大约 1000 倍 → 必须靠局部性把 p 压到极低。</text>
</svg>
