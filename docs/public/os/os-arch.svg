<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">操作系统层次、双工作模式与系统调用</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker>
  </defs>

  <text x="30" y="56" font-size="12" font-weight="700" fill="#334155">系统层次（自上而下）</text>
  <rect x="30" y="66" width="290" height="34" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="175" y="88" text-anchor="middle" font-size="11" fill="#075985">用户程序 / 命令 / GUI（用户态 ring3）</text>
  <rect x="30" y="106" width="290" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="175" y="126" text-anchor="middle" font-size="10.5" fill="#334155">库函数：printf / fread / malloc（多数不进内核）</text>
  <rect x="30" y="142" width="290" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="175" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">系统调用接口（唯一合法入口 · 陷入指令）</text>
  <rect x="30" y="178" width="290" height="86" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="175" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">OS 内核（内核态 ring0）</text>
  <text x="175" y="219" text-anchor="middle" font-size="10" fill="#1e40af">进程／处理机管理　　存储器管理</text>
  <text x="175" y="238" text-anchor="middle" font-size="10" fill="#1e40af">设备管理　　文件管理　　接口管理</text>
  <text x="175" y="256" text-anchor="middle" font-size="9" fill="#64748b">支撑：中断处理 · 时钟管理 · 原语</text>
  <rect x="30" y="270" width="290" height="32" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="175" y="291" text-anchor="middle" font-size="10.5" fill="#5b21b6">硬件：CPU / MMU / 内存 / 磁盘 / 网卡</text>

  <line x1="175" y1="100" x2="175" y2="105" stroke="#475569" marker-end="url(#ar)"/>
  <line x1="175" y1="136" x2="175" y2="141" stroke="#475569" marker-end="url(#ar)"/>
  <line x1="175" y1="172" x2="175" y2="177" stroke="#d97706" marker-end="url(#arb)"/>
  <line x1="175" y1="264" x2="175" y2="269" stroke="#475569" marker-end="url(#ar)"/>

  <text x="360" y="56" font-size="12" font-weight="700" fill="#334155">一次 read 的陷入与返回</text>
  <rect x="360" y="66" width="290" height="46" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="374" y="84" font-size="10" fill="#334155">① 用户态：参数与系统调用号入寄存器</text>
  <text x="374" y="101" font-size="10" fill="#334155">② 执行 syscall 陷入指令</text>
  <rect x="360" y="120" width="290" height="60" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="374" y="139" font-size="10" fill="#1e40af">③ 硬件切内核态，查系统调用表</text>
  <text x="374" y="157" font-size="10" fill="#1e40af">④ sys_read → VFS → 驱动 → 页缓存</text>
  <text x="374" y="173" font-size="9.5" fill="#64748b">数据未就绪则进程阻塞，调度其它进程</text>
  <rect x="360" y="188" width="290" height="44" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="374" y="206" font-size="10" fill="#991b1b">⑤ 磁盘 DMA 完成 → 中断 → 唤醒</text>
  <text x="374" y="223" font-size="10" fill="#991b1b">⑥ 重新调度，copy_to_user</text>
  <rect x="360" y="240" width="290" height="34" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="374" y="262" font-size="10" fill="#166534">⑦ 恢复现场，返回用户态（至少 2 次态切换）</text>
  <line x1="505" y1="112" x2="505" y2="119" stroke="#475569" marker-end="url(#ar)"/>
  <line x1="505" y1="180" x2="505" y2="187" stroke="#475569" marker-end="url(#ar)"/>
  <line x1="505" y1="232" x2="505" y2="239" stroke="#475569" marker-end="url(#ar)"/>

  <rect x="30" y="316" width="620" height="68" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="336" font-size="11" font-weight="700" fill="#92400e">三类陷入的统一机制（来源不同，都查向量表并切态）</text>
  <text x="42" y="355" font-size="10" fill="#78350f">中断：CPU 外部、异步（时钟 / I/O 完成）→ 返回下一条指令　　异常：当前指令、同步（缺页 / 除零）→ 可能重执行当前指令</text>
  <text x="42" y="373" font-size="10" fill="#78350f">系统调用：程序主动请求（trap）→ 返回下一条指令　　特权指令只能在内核态执行，用户程序不能自改 PSW 模式位</text>
</svg>
