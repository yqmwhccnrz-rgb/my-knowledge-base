<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">死锁：资源分配图化简与银行家安全序列</text>

  <defs>
    <marker id="d1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="d2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
  </defs>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 资源分配图：P = 进程，R = 资源（方框内圆点为实例）</text>
  <rect x="30" y="62" width="300" height="150" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="42" y="80" font-size="10" font-weight="700" fill="#991b1b">不可完全化简 → 已死锁</text>
  <rect x="50" y="94" width="66" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="83" y="114" text-anchor="middle" font-size="10" fill="#1e3a8a">P1</text>
  <rect x="238" y="94" width="66" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/><text x="271" y="114" text-anchor="middle" font-size="10" fill="#1e3a8a">P2</text>
  <rect x="138" y="94" width="76" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="176" y="114" text-anchor="middle" font-size="9" fill="#92400e">R1 (2 个)</text>
  <rect x="138" y="154" width="76" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="176" y="174" text-anchor="middle" font-size="9" fill="#92400e">R2 (1 个)</text>
  <line x1="116" y1="106" x2="137" y2="106" stroke="#dc2626" marker-end="url(#d2)"/>
  <text x="116" y="100" font-size="8.5" fill="#dc2626">请求</text>
  <line x1="138" y1="120" x2="116" y2="120" stroke="#2563eb" marker-end="url(#d1)"/>
  <line x1="214" y1="106" x2="237" y2="106" stroke="#dc2626" marker-end="url(#d2)"/>
  <line x1="238" y1="120" x2="214" y2="120" stroke="#2563eb" marker-end="url(#d1)"/>
  <line x1="83" y1="124" x2="140" y2="156" stroke="#dc2626" marker-end="url(#d2)"/>
  <line x1="271" y1="124" x2="212" y2="156" stroke="#2563eb" marker-end="url(#d1)"/>
  <text x="42" y="200" font-size="9" fill="#7f1d1d">P1 等 R2（被 P2 占）、P2 等 R1（全部分配完）</text>

  <rect x="350" y="62" width="300" height="150" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="362" y="80" font-size="10" font-weight="700" fill="#166534">可完全化简 → 无死锁（R1 有空闲实例）</text>
  <text x="362" y="103" font-size="10" fill="#15803d">化简步骤：</text>
  <text x="362" y="123" font-size="10" fill="#15803d">1) P2 的请求可被空闲 R1 满足 → 孤立 P2</text>
  <text x="362" y="143" font-size="10" fill="#15803d">2) 抹去 P2 全部边（释放 R1、R2）</text>
  <text x="362" y="163" font-size="10" fill="#15803d">3) P1 得到 R2 → 孤立 P1 → 图化简完毕</text>
  <text x="362" y="190" font-size="9" fill="#64748b">注意：有环 ≠ 死锁；仅当每类资源 1 个实例时环才是充要条件</text>

  <text x="30" y="234" font-size="12" font-weight="700" fill="#334155">② 银行家算法：Available = (3,3,2)，Need = Max − Allocation</text>
  <rect x="30" y="244" width="620" height="92" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="263" font-size="9.5" font-weight="700" fill="#334155">步骤　　　Work 初值　　选中　　Need ≤ Work 判据　　　　　　Work 归还后 = Work + Allocation</text>
  <text x="42" y="282" font-size="9.5" fill="#475569">1　　　　 (3,3,2)　　　 P1　　 (1,2,2) ≤ (3,3,2)　　　　　 (5,3,2)</text>
  <text x="42" y="300" font-size="9.5" fill="#475569">2　　　　 (5,3,2)　　　 P3　　 (0,1,1) ≤ (5,3,2)　　　　　 (7,4,3)</text>
  <text x="42" y="318" font-size="9.5" fill="#475569">3~5　　　 (7,4,3)　　　 P0→P2→P4　依次满足　　　　　　　 (10,5,7)</text>

  <rect x="30" y="346" width="620" height="50" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="365" font-size="10.5" font-weight="700" fill="#92400e">结论：存在安全序列 ⟨P1, P3, P0, P2, P4⟩ → 状态安全（序列不唯一）；安全必无死锁，不安全未必已死锁。</text>
  <text x="42" y="384" font-size="10" fill="#78350f">四必要条件：互斥 · 请求和保持 · 不可剥夺 · 环路等待；处理：预防（破条件）→ 避免（银行家）→ 检测+解除。</text>
</svg>
