<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">进程五态 / 七态转换与触发条件</text>

  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="p2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="p3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#7c3aed"/></marker>
  </defs>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">五态模型（实线＝正常转换，虚线＝挂起相关）</text>
  <rect x="30" y="102" width="104" height="38" rx="19" fill="#e2e8f0" stroke="#64748b"/><text x="82" y="126" text-anchor="middle" font-size="11" fill="#334155">创建 New</text>
  <rect x="180" y="62" width="110" height="42" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="235" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">就绪 Ready</text>
  <rect x="350" y="62" width="110" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="405" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">运行 Running</text>
  <rect x="350" y="170" width="110" height="42" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="405" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">阻塞 Blocked</text>
  <rect x="530" y="62" width="116" height="42" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="588" y="88" text-anchor="middle" font-size="11" fill="#334155">终止 Terminated</text>

  <line x1="134" y1="121" x2="179" y2="98" stroke="#2563eb" marker-end="url(#p1)"/>
  <text x="140" y="103" font-size="9" fill="#2563eb">接纳</text>
  <line x1="290" y1="83" x2="349" y2="83" stroke="#2563eb" marker-end="url(#p1)"/>
  <text x="296" y="76" font-size="9" fill="#2563eb">调度 / 分派</text>
  <line x1="350" y1="98" x2="291" y2="98" stroke="#dc2626" marker-end="url(#p2)"/>
  <text x="296" y="112" font-size="9" fill="#dc2626">时间片到 / 被抢占</text>
  <line x1="405" y1="104" x2="405" y2="169" stroke="#dc2626" marker-end="url(#p2)"/>
  <text x="412" y="138" font-size="9" fill="#dc2626">等待事件（主动）</text>
  <line x1="350" y1="184" x2="291" y2="106" stroke="#16a34a" marker-end="url(#p1)"/>
  <text x="256" y="164" font-size="9" fill="#16a34a">事件发生（被动唤醒）</text>
  <line x1="460" y1="83" x2="529" y2="83" stroke="#2563eb" marker-end="url(#p1)"/>
  <text x="466" y="76" font-size="9" fill="#2563eb">正常 / 异常结束</text>

  <rect x="30" y="232" width="620" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="251" font-size="10.5" font-weight="700" fill="#334155">转换规则速记</text>
  <text x="42" y="269" font-size="10" fill="#475569">阻塞 → 运行 不可能（须先回就绪排队）；就绪 → 阻塞 不可能；阻塞由进程自己发起，唤醒由中断或其它进程完成。</text>

  <text x="30" y="308" font-size="12" font-weight="700" fill="#334155">七态模型：引入挂起（换出到外存）</text>
  <rect x="30" y="322" width="146" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="103" y="346" text-anchor="middle" font-size="10.5" fill="#5b21b6">活动就绪 → 静止就绪</text>
  <rect x="192" y="322" width="146" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="265" y="346" text-anchor="middle" font-size="10.5" fill="#5b21b6">活动阻塞 → 静止阻塞</text>
  <rect x="354" y="322" width="146" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="427" y="346" text-anchor="middle" font-size="10.5" fill="#92400e">静止阻塞 → 静止就绪</text>
  <rect x="516" y="322" width="134" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="583" y="346" text-anchor="middle" font-size="10.5" fill="#166534">激活 → 活动就绪</text>
  <line x1="176" y1="341" x2="191" y2="341" stroke="#7c3aed" marker-end="url(#p3)"/>
  <line x1="338" y1="341" x2="353" y2="341" stroke="#7c3aed" marker-end="url(#p3)"/>
  <line x1="500" y1="341" x2="515" y2="341" stroke="#7c3aed" marker-end="url(#p3)"/>

  <rect x="30" y="374" width="620" height="34" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="395" font-size="10" fill="#78350f">挂起 ≠ 阻塞：阻塞仍在内存、只等事件；挂起已被换出外存且不能被直接调度。触发原因：内存不足、用户/父进程请求、负荷调节。</text>
</svg>
