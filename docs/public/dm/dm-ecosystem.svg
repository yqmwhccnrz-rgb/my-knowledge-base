<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Python 数据科学生态与常用库分层</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 分层工具栈（自下而上：越往上越贴近业务）</text>
  <rect x="30" y="62" width="620" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="45" y="79" font-size="10.5" font-weight="700" fill="#5b21b6">应用层</text>
  <text x="45" y="95" font-size="9.5" fill="#5b21b6">Jupyter Notebook /Lab · Spyder · PyCharm · Anaconda（环境与包管理 conda / pip）</text>
  <rect x="30" y="110" width="620" height="42" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="45" y="127" font-size="10.5" font-weight="700" fill="#9d174d">领域应用</text>
  <text x="45" y="143" font-size="9.5" fill="#9d174d">networkx（社会网络）· bibliometrix / CiteSpace 思路 · wordcloud / jieba（文本）· pyspark（大数据）</text>
  <rect x="30" y="158" width="620" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="45" y="175" font-size="10.5" font-weight="700" fill="#166534">建模层</text>
  <text x="45" y="191" font-size="9.5" fill="#166534">scikit-learn（回归/聚类/降维/分类）· statsmodels（统计检验/OLS/ARIMA）· scipy.stats · scipy.optimize</text>
  <rect x="30" y="206" width="620" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="45" y="223" font-size="10.5" font-weight="700" fill="#92400e">可视化</text>
  <text x="45" y="239" font-size="9.5" fill="#92400e">matplotlib（基础绘图）· seaborn（统计图）· pandas.plot 快捷接口 · pyecharts（交互）</text>
  <rect x="30" y="254" width="620" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="45" y="271" font-size="10.5" font-weight="700" fill="#1e3a8a">数据处理</text>
  <text x="45" y="287" font-size="9.5" fill="#1e3a8a">pandas：Series / DataFrame、groupby、pivot_table、merge、缺失值与时间序列索引</text>
  <rect x="30" y="302" width="620" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="45" y="319" font-size="10.5" font-weight="700" fill="#075985">数值底座</text>
  <text x="45" y="335" font-size="9.5" fill="#075985">numpy：ndarray、向量化运算、广播、线性代数 linalg、随机数 random；Python 语法与标准库</text>

  <text x="30" y="368" font-size="10.5" fill="#334155">核心数据结构对照：numpy 一维 ndarray ↔ pandas Series；二维 ndarray ↔ DataFrame（带行列标签，可含异构列）。</text>
  <text x="30" y="386" font-size="10" fill="#64748b">易错：sklearn 关注预测精度与交叉验证，statsmodels 关注系数推断与 p 值；同一线性回归两者输出侧重不同，勿混用结论。</text>
</svg>
