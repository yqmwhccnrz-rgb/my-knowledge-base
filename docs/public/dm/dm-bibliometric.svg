<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">文献计量与科研评价（第 7 章）</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 文献计量学与分析流程</text>
  <rect x="30" y="62" width="620" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="42" y="82" font-size="10.5" fill="#334155">定义：用数学与统计学方法，定量分析一切知识载体（文献）的分布结构、数量关系与变化规律。</text>
  <text x="42" y="100" font-size="9.5" fill="#64748b">数据源：Web of Science / Scopus / CNKI / 万方；导出题录字段（作者、机构、关键词、参考文献、基金、被引频次）。</text>
  <defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker></defs>
  <rect x="30" y="114" width="118" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="89" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#075985">检索与下载题录</text>
  <rect x="160" y="114" width="118" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="219" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">去重与字段清洗</text>
  <rect x="290" y="114" width="118" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="349" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">描述统计</text>
  <rect x="420" y="114" width="118" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="479" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">共现/共被引网络</text>
  <rect x="550" y="114" width="100" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="600" y="139" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">可视化与评价</text>
  <line x1="148" y1="134" x2="159" y2="134" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="278" y1="134" x2="289" y2="134" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="408" y1="134" x2="419" y2="134" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="538" y1="134" x2="549" y2="134" stroke="#2563eb" marker-end="url(#ar1)"/>

  <text x="30" y="180" font-size="12" font-weight="700" fill="#334155">② 课件 7.2.2 的三类统计 + 常用指标</text>
  <rect x="30" y="190" width="200" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="130" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#075985">科研单位与基金统计</text>
  <text x="42" y="228" font-size="9.5" fill="#334155">按机构 / 基金分组计数排序</text>
  <text x="42" y="246" font-size="9.5" fill="#334155">机构合作、资助产出分布</text>
  <text x="42" y="264" font-size="9" fill="#64748b">value_counts / groupby + barh</text>
  <rect x="240" y="190" width="200" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">作者与关键词统计</text>
  <text x="252" y="228" font-size="9.5" fill="#334155">高产作者、高频关键词</text>
  <text x="252" y="246" font-size="9.5" fill="#334155">共词分析 → 研究热点</text>
  <text x="252" y="264" font-size="9" fill="#64748b">词频、共现矩阵、词云</text>
  <rect x="450" y="190" width="200" height="88" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="208" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">评价指标（补充）</text>
  <text x="462" y="228" font-size="9.5" fill="#92400e">h 指数：有 h 篇每篇被引 ≥ h 次</text>
  <text x="462" y="246" font-size="9.5" fill="#92400e">总被引 / 篇均被引 / 影响因子</text>
  <text x="462" y="264" font-size="9" fill="#64748b">g 指数、FWCI、Altmetric</text>

  <text x="30" y="302" font-size="12" font-weight="700" fill="#334155">③ h 指数工作例题</text>
  <rect x="30" y="312" width="620" height="52" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="332" font-size="10" fill="#334155">某作者 8 篇论文被引降序：25, 14, 9, 6, 5, 3, 1, 0 → 第 5 篇被引 5 ≥ 5，第 6 篇 3 &lt; 6，故 h = 5。</text>
  <text x="42" y="352" font-size="9.5" fill="#64748b">h 指数兼顾数量与质量，但受学科、年限、自引、合作署名影响；跨领域比较须归一化，不能单独用于人才评价。</text>

  <text x="30" y="388" font-size="10" fill="#64748b">补充：洛特卡定律（作者频次）、普赖斯定律（核心作者）、共被引 / 文献耦合 / 突发词检测；工具 CiteSpace、VOSviewer、bibliometrix；课件章节标题误写为「多元数据的综合分析」，应为「文献计量与科研评价」。</text>
</svg>
