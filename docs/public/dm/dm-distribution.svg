<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">随机变量、常见分布与随机模拟（第 3 章）</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 常见分布：参数、期望、方差、典型用途</text>
  <rect x="30" y="62" width="620" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="42" y="80" font-size="10" font-weight="700" fill="#1e3a8a">分布</text><text x="152" y="80" font-size="10" font-weight="700" fill="#1e3a8a">参数</text><text x="272" y="80" font-size="10" font-weight="700" fill="#1e3a8a">E(X) / Var(X)</text><text x="452" y="80" font-size="10" font-weight="700" fill="#1e3a8a">典型用途</text>
  <text x="42" y="106" font-size="10" fill="#334155">正态分布</text><text x="152" y="106" font-size="10" fill="#334155">μ, σ²</text><text x="272" y="106" font-size="10" fill="#334155">μ / σ²</text><text x="452" y="106" font-size="10" fill="#334155">误差、连续测量值</text>
  <text x="42" y="128" font-size="10" fill="#334155">标准正态 N(0,1)</text><text x="152" y="128" font-size="10" fill="#334155">—</text><text x="272" y="128" font-size="10" fill="#334155">0 / 1</text><text x="452" y="128" font-size="10" fill="#334155">Z 检验、置信区间</text>
  <text x="42" y="150" font-size="10" fill="#334155">t 分布</text><text x="152" y="150" font-size="10" fill="#334155">自由度 n−1</text><text x="272" y="150" font-size="10" fill="#334155">0 (n&gt;1) / n/(n−2)</text><text x="452" y="150" font-size="10" fill="#334155">小样本、σ 未知</text>
  <text x="42" y="172" font-size="10" fill="#334155">χ² 分布</text><text x="152" y="172" font-size="10" fill="#334155">自由度 k</text><text x="272" y="172" font-size="10" fill="#334155">k / 2k</text><text x="452" y="172" font-size="10" fill="#334155">方差检验、拟合优度</text>
  <text x="42" y="194" font-size="10" fill="#334155">F 分布</text><text x="152" y="194" font-size="10" fill="#334155">d₁, d₂</text><text x="272" y="194" font-size="10" fill="#334155">d₂/(d₂−2)</text><text x="452" y="194" font-size="10" fill="#334155">方差分析、回归整体检验</text>
  <text x="42" y="216" font-size="10" fill="#334155">二项分布 B(n,p)</text><text x="152" y="216" font-size="10" fill="#334155">n, p</text><text x="272" y="216" font-size="10" fill="#334155">np / np(1−p)</text><text x="452" y="216" font-size="10" fill="#334155">n 次独立试验成功次数</text>
  <text x="42" y="238" font-size="10" fill="#334155">泊松分布 P(λ)</text><text x="152" y="238" font-size="10" fill="#334155">λ</text><text x="272" y="238" font-size="10" fill="#334155">λ / λ</text><text x="452" y="238" font-size="10" fill="#334155">单位时间稀有事件计数</text>
  <text x="42" y="260" font-size="10" fill="#334155">均匀分布 U(a,b)</text><text x="152" y="260" font-size="10" fill="#334155">a, b</text><text x="272" y="260" font-size="10" fill="#334155">(a+b)/2 / (b−a)²/12</text><text x="452" y="260" font-size="10" fill="#334155">随机数生成的基础</text>

  <text x="30" y="290" font-size="12" font-weight="700" fill="#334155">② 随机模拟（蒙特卡罗方法）四步</text>
  <rect x="30" y="300" width="146" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="103" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#075985">建立概率模型</text><text x="103" y="334" text-anchor="middle" font-size="9" fill="#075985">明确分布与参数</text>
  <rect x="188" y="300" width="146" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="261" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">生成随机数</text><text x="261" y="334" text-anchor="middle" font-size="9" fill="#1e3a8a">np.random + seed</text>
  <rect x="346" y="300" width="146" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="419" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">重复试验 N 次</text><text x="419" y="334" text-anchor="middle" font-size="9" fill="#166534">向量化避免循环</text>
  <rect x="504" y="300" width="146" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="577" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">统计频率近似</text><text x="577" y="334" text-anchor="middle" font-size="9" fill="#92400e">大数定律保证收敛</text>

  <text x="30" y="366" font-size="10.5" fill="#334155">工作例题：投针估算 π —— 在 [0,1]² 均匀投 N 点，落入单位圆四分之一的比例 p ≈ π/4，故 π ≈ 4 × (落入数/N)。</text>
  <text x="30" y="384" font-size="10" fill="#64748b">易错：np.random.seed() 只保证可复现，不改变分布；中心极限定理说的是「样本均值的分布」趋近正态，不是总体变正态。</text>
</svg>
