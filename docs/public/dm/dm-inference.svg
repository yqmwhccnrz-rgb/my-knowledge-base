<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">单变量统计推断与一元线性回归（第 3 章）</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 假设检验六步与两类错误</text>
  <rect x="30" y="62" width="620" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="82" font-size="10" fill="#334155">① 设 H₀ / H₁　② 选检验统计量　③ 定显著性水平 α（常用 0.05）　④ 由样本算统计量与 p 值</text>
  <text x="42" y="102" font-size="10" fill="#334155">⑤ p ≤ α 则拒绝 H₀　⑥ 结合业务解释结论（统计显著 ≠ 实际重要）</text>
  <text x="42" y="118" font-size="9.5" fill="#64748b">第一类错误：H₀ 真却拒绝（概率 α）；第二类错误：H₀ 假却未拒绝（概率 β）；功效 = 1 − β。</text>

  <text x="30" y="146" font-size="12" font-weight="700" fill="#334155">② 单样本 t 检验（σ 未知、小样本）</text>
  <rect x="30" y="156" width="300" height="106" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="180" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">公式与判定</text>
  <text x="42" y="196" font-size="10" fill="#334155">t = (x̄ − μ₀) / (s / √n)，自由度 df = n − 1</text>
  <text x="42" y="214" font-size="10" fill="#334155">|t| &gt; t_{α/2}(n−1) 或 p &lt; α → 拒绝 H₀</text>
  <text x="42" y="232" font-size="10" fill="#334155">置信区间：x̄ ± t_{α/2} · s/√n</text>
  <text x="42" y="252" font-size="9.5" fill="#64748b">μ₀ 已知且 σ 已知时用 Z 检验；大样本 t ≈ Z</text>
  <rect x="342" y="156" width="308" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="496" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">工作例题</text>
  <text x="354" y="196" font-size="10" fill="#334155">n=16，x̄=52，s=4，检验 H₀: μ=50</text>
  <text x="354" y="214" font-size="10" fill="#334155">t = (52−50)/(4/4) = 2.00，df=15</text>
  <text x="354" y="232" font-size="10" fill="#334155">t₀.₀₂₅(15)=2.131 → |t| &lt; 临界值</text>
  <text x="354" y="252" font-size="9.5" fill="#166534">结论：α=0.05 下不拒绝 H₀；95%CI=[49.87, 54.13] 含 50</text>

  <text x="30" y="286" font-size="12" font-weight="700" fill="#334155">③ 一元线性回归模型</text>
  <rect x="30" y="296" width="620" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="42" y="316" font-size="10" fill="#334155">模型 y = β₀ + β₁x + ε；最小二乘 β̂₁ = Σ(x−x̄)(y−ȳ)/Σ(x−x̄)²，β̂₀ = ȳ − β̂₁x̄</text>
  <text x="42" y="336" font-size="10" fill="#334155">检验：系数 t 值与 p 值、R² = SSR/SST、残差 e = y − ŷ；预测用 fm.predict(pd.DataFrame({'x':[…]}))</text>
  <text x="42" y="352" font-size="9.5" fill="#64748b">statsmodels 用 smf.ols('y ~ x', data).fit() 给完整推断表；sklearn 只给系数与 score。</text>

  <text x="30" y="380" font-size="10.5" fill="#334155">工作例题：x=[1,2,3,4,5], y=[2,4,5,7,9] → β̂₁=1.7, β̂₀=0.3, R²≈0.9897；x=6 时 ŷ=10.5（外推须谨慎）。</text>
  <text x="30" y="396" font-size="10" fill="#64748b">易错：p 值不是「H₀ 为真的概率」；不拒绝 H₀ ≠ 证明 H₀ 成立；回归显著 ≠ 存在因果关系。</text>
</svg>
