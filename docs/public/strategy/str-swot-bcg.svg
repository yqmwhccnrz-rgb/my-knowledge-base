<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="232" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">SWOT 四象限与对应战略</text>
  <text x="668" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">波士顿矩阵（BCG）</text>
  <line x1="452" y1="46" x2="452" y2="392" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-size="12">
    <text x="24" y="58" fill="#64748b">内部优势 S</text>
    <text x="24" y="76" fill="#64748b">内部劣势 W</text>
    <rect x="24" y="88" width="196" height="126" rx="9" fill="#dcfce7" stroke="#86efac"/>
    <text x="34" y="108" font-size="11" font-weight="700" fill="#166534">机会 O（外部）</text>
    <text x="122" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">增长型 SO</text>
    <text x="122" y="174" text-anchor="middle" font-size="11" fill="#166534">优势 + 机会</text>
    <text x="122" y="192" text-anchor="middle" font-size="11" fill="#166534">进攻、扩张</text>

    <rect x="232" y="88" width="196" height="126" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="242" y="108" font-size="11" font-weight="700" fill="#92400e">机会 O（外部）</text>
    <text x="330" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">扭转型 WO</text>
    <text x="330" y="174" text-anchor="middle" font-size="11" fill="#92400e">劣势 + 机会</text>
    <text x="330" y="192" text-anchor="middle" font-size="11" fill="#92400e">先补短板再利用机会</text>

    <rect x="24" y="226" width="196" height="126" rx="9" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="34" y="246" font-size="11" font-weight="700" fill="#075985">威胁 T（外部）</text>
    <text x="122" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">多种经营 ST</text>
    <text x="122" y="312" text-anchor="middle" font-size="11" fill="#075985">优势 + 威胁</text>
    <text x="122" y="330" text-anchor="middle" font-size="11" fill="#075985">分散风险、多元化</text>

    <rect x="232" y="226" width="196" height="126" rx="9" fill="#fee2e2" stroke="#f87171"/>
    <text x="242" y="246" font-size="11" font-weight="700" fill="#991b1b">威胁 T（外部）</text>
    <text x="330" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">防御型 WT</text>
    <text x="330" y="312" text-anchor="middle" font-size="11" fill="#991b1b">劣势 + 威胁</text>
    <text x="330" y="330" text-anchor="middle" font-size="11" fill="#991b1b">收缩、退出、防御</text>
  </g>
  <text x="232" y="374" text-anchor="middle" font-size="11" fill="#64748b">上图两列为内部条件，两行为外部条件；资料解析中曾把 WO 误写成「优势+机会」</text>

  <g font-size="12">
    <line x1="500" y1="342" x2="866" y2="342" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="500" y1="70" x2="500" y2="342" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="62" font-size="11" fill="#6b7280">市场增长率 ↑（分界 10%）</text>
    <text x="866" y="360" text-anchor="end" font-size="11" fill="#6b7280">相对市场占有率 →（分界 1.0）</text>

    <rect x="500" y="70" width="183" height="136" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="591" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">明星 ★</text>
    <text x="591" y="134" text-anchor="middle" font-size="11" fill="#1e40af">高增长 · 高份额</text>
    <text x="591" y="154" text-anchor="middle" font-size="11" fill="#1e40af">发展：加大投入</text>
    <text x="591" y="174" text-anchor="middle" font-size="11" fill="#1e40af">需技术+营销型人才</text>

    <rect x="683" y="70" width="183" height="136" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="774" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">问题 ?</text>
    <text x="774" y="134" text-anchor="middle" font-size="11" fill="#92400e">高增长 · 低份额</text>
    <text x="774" y="154" text-anchor="middle" font-size="11" fill="#92400e">有前途→发展；无前途→收割/放弃</text>
    <text x="774" y="174" text-anchor="middle" font-size="11" fill="#92400e">需敢冒险、有规划力人才</text>

    <rect x="500" y="206" width="183" height="136" rx="9" fill="#dcfce7" stroke="#86efac"/>
    <text x="591" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">现金牛 ¥</text>
    <text x="591" y="270" text-anchor="middle" font-size="11" fill="#166534">低增长 · 高份额</text>
    <text x="591" y="290" text-anchor="middle" font-size="11" fill="#166534">保持 / 处境不佳可收割</text>
    <text x="591" y="310" text-anchor="middle" font-size="11" fill="#166534">为其他业务输血</text>

    <rect x="683" y="206" width="183" height="136" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="774" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">瘦狗 ×</text>
    <text x="774" y="270" text-anchor="middle" font-size="11" fill="#475569">低增长 · 低份额</text>
    <text x="774" y="290" text-anchor="middle" font-size="11" fill="#475569">收割 / 放弃（撤退）</text>
    <text x="774" y="310" text-anchor="middle" font-size="11" fill="#475569">占用资金、利润微薄</text>
  </g>
  <text x="683" y="374" text-anchor="middle" font-size="11" fill="#64748b">四种战略：发展 / 保持 / 收割 / 放弃；局限：两指标难量化、忽略业务间关联</text>
</svg>
