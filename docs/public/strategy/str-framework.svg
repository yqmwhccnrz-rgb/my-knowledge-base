<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">CPA《公司战略与风险管理》全书主线与章节地图</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#64748b">战略管理过程：战略分析 → 战略选择 → 战略实施（+ 治理与风险两条保障线）</text>

  <rect x="24" y="64" width="852" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#1e3a8a">一条主线</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="130" y="76" width="170" height="34" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="215" y="98" text-anchor="middle" font-weight="700">第1章 战略与战略管理</text>
    <rect x="320" y="76" width="170" height="34" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="405" y="98" text-anchor="middle" font-weight="700">第2章 战略分析</text>
    <rect x="510" y="76" width="170" height="34" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="595" y="98" text-anchor="middle" font-weight="700">第3章 战略选择</text>
    <rect x="700" y="76" width="160" height="34" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="780" y="98" text-anchor="middle" font-weight="700">第4章 战略实施</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.6" fill="none">
    <path d="M302,93 L316,93 M492,93 L506,93 M682,93 L696,93"/>
  </g>

  <text x="24" y="152" font-size="14" font-weight="700" fill="#1e3a8a">八章内容与分值（思维导图口径，合计约 100 分）</text>
  <g font-size="12">
    <rect x="24" y="162" width="204" height="86" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="182" font-weight="700" fill="#1e3a8a">第1章 战略与战略管理 · 4分</text>
    <text x="36" y="201" fill="#374151">传统/现代/折中定义、使命与目标</text>
    <text x="36" y="219" fill="#374151">三层次、管理过程、创新管理</text>
    <text x="36" y="237" fill="#374151">利益相关者、权力与战略过程</text>

    <rect x="236" y="162" width="204" height="86" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="248" y="182" font-weight="700" fill="#1e3a8a">第2章 战略分析 · 20分</text>
    <text x="248" y="201" fill="#374151">PEST、生命周期、五力、KSF</text>
    <text x="248" y="219" fill="#374151">资源能力、钻石模型、价值链</text>
    <text x="248" y="237" fill="#374151">波士顿/通用矩阵、SWOT</text>

    <rect x="448" y="162" width="204" height="86" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="460" y="182" font-weight="700" fill="#1e3a8a">第3章 战略选择 · 36分 ★</text>
    <text x="460" y="201" fill="#374151">总体战略、业务单位战略</text>
    <text x="460" y="219" fill="#374151">职能战略（营销/研发/运营…）</text>
    <text x="460" y="237" fill="#374151">国际化经营与全球价值链</text>

    <rect x="660" y="162" width="216" height="86" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="672" y="182" font-weight="700" fill="#1e3a8a">第4章 战略实施 · 15分</text>
    <text x="672" y="201" fill="#374151">组织结构、企业文化、战略控制</text>
    <text x="672" y="219" fill="#374151">数智化转型（新增）</text>
    <text x="672" y="237" fill="#374151">可持续发展管理（新增）</text>

    <rect x="24" y="258" width="276" height="80" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="278" font-weight="700" fill="#1e3a8a">第5章 公司治理 · 5-10分</text>
    <text x="36" y="297" fill="#374151">三大问题：股东-经理层、大股东-</text>
    <text x="36" y="315" fill="#374151">中小股东、股东-其他利益相关者</text>
    <text x="36" y="331" fill="#374151">内外部治理机制、治理新发展</text>

    <rect x="308" y="258" width="276" height="80" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="320" y="278" font-weight="700" fill="#1e3a8a">第6章 风险与风险管理概述 · 2分</text>
    <text x="320" y="297" fill="#374151">风险要素：因素 / 事件 / 后果</text>
    <text x="320" y="315" fill="#374151">风险管理六大特征、四层目标</text>
    <text x="320" y="331" fill="#374151">四项职能、理论演进</text>

    <rect x="592" y="258" width="284" height="80" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="604" y="278" font-weight="700" fill="#1e3a8a">第7章 流程、体系与方法 · 5-10分</text>
    <text x="604" y="297" fill="#374151">五步流程、组织职能体系、策略七工具</text>
    <text x="604" y="315" fill="#374151">内控五要素、11 种技术与方法</text>
    <text x="604" y="331" fill="#374151">风险度量六种方法（难点）</text>

    <rect x="24" y="348" width="852" height="54" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="36" y="369" font-weight="700" fill="#92400e">第8章 企业面对的主要风险与应对 · 5-15分</text>
    <text x="36" y="390" fill="#78350f">战略风险 / 市场风险 / 财务风险 / 运营风险 / 法律风险与合规风险 —— 五类风险的「含义 + 影响因素 + 主要表现 + 应对措施」是主观题主战场</text>
  </g>

  <text x="24" y="430" font-size="13" font-weight="700" fill="#1e3a8a">复习抓手</text>
  <text x="24" y="450" font-size="12" fill="#374151">第2、3章合计 56 分，是客观题与主观题的核心；第4、8章是新增与案例题重点；第1、6章分值低但概念题必考，切勿放弃。</text>
</svg>
