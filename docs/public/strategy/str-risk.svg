<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">风险管理：五步流程、七种策略工具与风险偏好</text>

  <text x="24" y="58" font-size="14" font-weight="700" fill="#1e3a8a">一、风险管理基本流程（五步，顺序不可颠倒）</text>
  <g font-size="11" fill="#1e3a8a">
    <rect x="24" y="70" width="156" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="102" y="92" text-anchor="middle" font-weight="700">① 收集初始信息</text>
    <text x="102" y="110" text-anchor="middle">内外部、历史与未来</text>
    <rect x="196" y="70" width="156" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="274" y="92" text-anchor="middle" font-weight="700">② 风险评估</text>
    <text x="274" y="110" text-anchor="middle">辨识→分析→评价</text>
    <rect x="368" y="70" width="156" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="446" y="92" text-anchor="middle" font-weight="700">③ 制定策略</text>
    <text x="446" y="110" text-anchor="middle">偏好/承受度/工具</text>
    <rect x="540" y="70" width="156" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="618" y="92" text-anchor="middle" font-weight="700">④ 提出与实施</text>
    <text x="618" y="110" text-anchor="middle">解决方案</text>
    <rect x="712" y="70" width="164" height="52" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="794" y="92" text-anchor="middle" font-weight="700">⑤ 监督与改进</text>
    <text x="794" y="110" text-anchor="middle">持续闭环</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.6" fill="none"><path d="M182,96 L194,96 M354,96 L366,96 M526,96 L538,96 M698,96 L710,96"/></g>
  <text x="24" y="142" font-size="11" fill="#64748b">风险评估三分步：风险辨识（种类）→ 风险分析（发生可能性）→ 风险评价（影响程度）</text>

  <text x="24" y="174" font-size="14" font-weight="700" fill="#1e3a8a">二、七种风险管理策略工具（案例题必考：判断属于哪一种）</text>
  <g font-size="11">
    <rect x="24" y="186" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="206" font-weight="700" fill="#1e3a8a">风险承担</text>
    <text x="36" y="224" fill="#374151">接受后果。重大风险一般不应承担；</text>
    <text x="36" y="240" fill="#374151">未辨识出的风险只能承担</text>

    <rect x="240" y="186" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="252" y="206" font-weight="700" fill="#1e3a8a">风险规避</text>
    <text x="252" y="224" fill="#374151">回避不擅长/把握不大的业务，</text>
    <text x="252" y="240" fill="#374151">彻底不承担该风险</text>

    <rect x="456" y="186" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="468" y="206" font-weight="700" fill="#1e3a8a">风险转移</text>
    <text x="468" y="224" fill="#374151">保险、业务外包/承包、</text>
    <text x="468" y="240" fill="#374151">出售，把后果转给第三方</text>

    <rect x="672" y="186" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="684" y="206" font-weight="700" fill="#1e3a8a">风险转换</text>
    <text x="684" y="224" fill="#374151">通过转换风险性质/条件，</text>
    <text x="684" y="240" fill="#374151">使不可控变为可控</text>

    <rect x="24" y="258" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="278" font-weight="700" fill="#1e3a8a">风险对冲</text>
    <text x="36" y="296" fill="#374151">引入多个风险相互抵消：</text>
    <text x="36" y="312" fill="#374151">资产组合、多币种、套期保值</text>

    <rect x="240" y="258" width="204" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="252" y="278" font-weight="700" fill="#1e3a8a">风险补偿</text>
    <text x="252" y="296" fill="#374151">预留资本/应急资本协议、</text>
    <text x="252" y="312" fill="#374151">风险准备金（事后有补偿）</text>

    <rect x="456" y="258" width="204" height="62" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="468" y="278" font-weight="700" fill="#92400e">风险控制</text>
    <text x="468" y="296" fill="#78350f">控制动因/环境/条件，降低概率</text>
    <text x="468" y="312" fill="#78350f">或损失：质检、成熟技术、内控</text>

    <rect x="672" y="258" width="204" height="62" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="684" y="278" font-weight="700" fill="#92400e">易混辨析</text>
    <text x="684" y="296" fill="#78350f">保险=转移；应急资本=补偿；</text>
    <text x="684" y="312" fill="#78350f">质检/成熟技术=控制</text>
  </g>

  <rect x="24" y="334" width="852" height="60" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="36" y="354" font-size="12" font-weight="700" fill="#1e3a8a">风险偏好 vs 风险承受度（选择题陷阱）</text>
  <text x="36" y="374" font-size="11" fill="#374151">偏好＝愿意承担什么风险（可只定性，体现运营风格）；承受度＝可接受的风险水平/绩效变化界限（必须定量，可作预警指标）。</text>
  <text x="36" y="390" font-size="11" fill="#374151">重大风险的偏好与承受度由董事会决定；企业不必对所有风险都确定承受度；不同风险可用不同度量方法，不必全企业唯一。</text>
</svg>
