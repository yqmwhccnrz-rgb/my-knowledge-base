<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">机器学习流程与性能评估（第 5 章）</text>
  <defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker></defs>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 标准流程（课件第 5 讲）</text>
  <rect x="30" y="62" width="98" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="79" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#075985">数据清洗</text><text x="79" y="95" text-anchor="middle" font-size="9" fill="#075985">缺失/异常/归一化</text>
  <rect x="140" y="62" width="98" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="189" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">特征工程</text><text x="189" y="95" text-anchor="middle" font-size="9" fill="#1e3a8a">编码/选择/变换</text>
  <rect x="250" y="62" width="98" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="299" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e3a8a">划分数据集</text><text x="299" y="95" text-anchor="middle" font-size="9" fill="#1e3a8a">训练/验证/测试</text>
  <rect x="360" y="62" width="98" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="409" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">训练与调参</text><text x="409" y="95" text-anchor="middle" font-size="9" fill="#166534">交叉验证选超参</text>
  <rect x="470" y="62" width="98" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="519" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">性能评估</text><text x="519" y="95" text-anchor="middle" font-size="9" fill="#92400e">测试集只测一次</text>
  <rect x="580" y="62" width="70" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="615" y="80" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">部署</text><text x="615" y="95" text-anchor="middle" font-size="9" fill="#5b21b6">监控漂移</text>
  <line x1="128" y1="83" x2="139" y2="83" stroke="#2563eb" marker-end="url(#ar1)"/><line x1="238" y1="83" x2="249" y2="83" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="348" y1="83" x2="359" y2="83" stroke="#2563eb" marker-end="url(#ar1)"/><line x1="458" y1="83" x2="469" y2="83" stroke="#2563eb" marker-end="url(#ar1)"/><line x1="568" y1="83" x2="579" y2="83" stroke="#2563eb" marker-end="url(#ar1)"/>

  <text x="30" y="128" font-size="12" font-weight="700" fill="#334155">② 混淆矩阵与指标（二分类）</text>
  <rect x="30" y="138" width="210" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="135" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">真实 \ 预测</text>
  <rect x="76" y="162" width="70" height="32" fill="#dcfce7" stroke="#16a34a"/><text x="111" y="182" text-anchor="middle" font-size="10" fill="#166534">TP 80</text>
  <rect x="150" y="162" width="70" height="32" fill="#fee2e2" stroke="#dc2626"/><text x="185" y="182" text-anchor="middle" font-size="10" fill="#991b1b">FN 10</text>
  <rect x="76" y="198" width="70" height="32" fill="#fee2e2" stroke="#dc2626"/><text x="111" y="218" text-anchor="middle" font-size="10" fill="#991b1b">FP 20</text>
  <rect x="150" y="198" width="70" height="32" fill="#dcfce7" stroke="#16a34a"/><text x="185" y="218" text-anchor="middle" font-size="10" fill="#166534">TN 90</text>
  <text x="46" y="182" font-size="9" fill="#64748b">正类</text><text x="46" y="218" font-size="9" fill="#64748b">负类</text>
  <text x="111" y="240" text-anchor="middle" font-size="9" fill="#64748b">预测正</text><text x="185" y="240" text-anchor="middle" font-size="9" fill="#64748b">预测负</text>
  <rect x="250" y="138" width="400" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="262" y="158" font-size="10" font-weight="700" fill="#334155">公式</text>
  <text x="262" y="178" font-size="9.5" fill="#334155">准确率 Acc=(TP+TN)/N=170/200=0.85　（类别不平衡时会失真）</text>
  <text x="262" y="196" font-size="9.5" fill="#334155">精确率 P=TP/(TP+FP)=80/100=0.80；召回率 R=TP/(TP+FN)=80/90≈0.889</text>
  <text x="262" y="214" font-size="9.5" fill="#334155">F1 = 2PR/(P+R) = 2TP/(2TP+FP+FN) = 160/190 ≈ 0.842</text>
  <text x="262" y="232" font-size="9.5" fill="#334155">ROC：TPR 对 FPR 曲线；AUC 越接近 1 越好，0.5 为随机猜测</text>

  <text x="30" y="268" font-size="12" font-weight="700" fill="#334155">③ 交叉验证与数据集三分</text>
  <rect x="30" y="278" width="300" height="88" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="180" y="296" text-anchor="middle" font-size="10.5" font-weight="700" fill="#075985">K 折交叉验证</text>
  <text x="42" y="316" font-size="9.5" fill="#334155">把训练集均分 K 份，轮流用 1 份验证、其余训练</text>
  <text x="42" y="334" font-size="9.5" fill="#334155">取 K 次平均选超参；K 常用 5 或 10，留一法 K=n</text>
  <text x="42" y="352" font-size="9" fill="#64748b">分层 K 折可保持各类比例；时序须按时间前向切分</text>
  <rect x="342" y="278" width="308" height="88" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="496" y="296" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">训练 / 验证 / 测试</text>
  <text x="354" y="316" font-size="9.5" fill="#334155">训练集：拟合参数；验证集：调超参与早停</text>
  <text x="354" y="334" font-size="9.5" fill="#334155">测试集：最终一次性评估泛化性能</text>
  <text x="354" y="352" font-size="9" fill="#64748b">绝不能用测试集反复调参，否则等于泄露测试信息</text>

  <text x="30" y="388" font-size="10" fill="#64748b">易错：归一化/特征选择只能在训练折内拟合（Pipeline 防泄露）；类别不平衡优先看 P/R/F1 与 PR-AUC，而非 accuracy。</text>
</svg>
