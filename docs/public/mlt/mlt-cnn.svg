<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">卷积神经网络 CNN 与输出尺寸计算（第 9 章）</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① CNN 三大思想（相对全连接网络）</text>
  <rect x="30" y="62" width="200" height="72" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="130" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#075985">局部感受野</text>
  <text x="42" y="100" font-size="9.5" fill="#334155">每个神经元只看输入的一小块</text>
  <text x="42" y="118" font-size="9.5" fill="#334155">符合图像局部相关性</text>
  <text x="42" y="130" font-size="9" fill="#64748b">大幅减少连接数</text>
  <rect x="240" y="62" width="200" height="72" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">权值共享</text>
  <text x="252" y="100" font-size="9.5" fill="#334155">同一卷积核滑过整幅图</text>
  <text x="252" y="118" font-size="9.5" fill="#334155">参数量与图像尺寸无关</text>
  <text x="252" y="130" font-size="9" fill="#64748b">实现平移等变性</text>
  <rect x="450" y="62" width="200" height="72" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="550" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">层级特征 + 池化</text>
  <text x="462" y="100" font-size="9.5" fill="#334155">浅层边缘 → 中层纹理 → 深层语义</text>
  <text x="462" y="118" font-size="9.5" fill="#334155">池化降维并带来一定平移不变性</text>
  <text x="462" y="130" font-size="9" fill="#64748b">max / average pooling</text>

  <text x="30" y="158" font-size="12" font-weight="700" fill="#334155">② 卷积与池化的输出尺寸公式</text>
  <rect x="30" y="168" width="620" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="188" font-size="10.5" font-weight="700" fill="#334155">H_out = ⌊(H_in − K + 2P)/S⌋ + 1　　W_out = ⌊(W_in − K + 2P)/S⌋ + 1</text>
  <text x="42" y="208" font-size="10" fill="#334155">K 卷积核尺寸、P 填充、S 步长；输出通道数 = 卷积核个数。参数量 = K×K×C_in×C_out + C_out（偏置）。</text>
  <text x="42" y="220" font-size="9" fill="#64748b">常用组合：K=3,P=1,S=1 保持尺寸；K=3,P=1,S=2 尺寸减半；1×1 卷积用于通道变换与降维。</text>

  <text x="30" y="248" font-size="12" font-weight="700" fill="#334155">③ 工作例题 · LeNet 风格前向尺寸（课件 max pool 2×2）</text>
  <rect x="30" y="258" width="620" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="278" font-size="10" fill="#334155">输入 32×32×1 → 6 个 5×5 卷积核，S=1、P=0：⌊(32−5)/1⌋+1 = 28 → 28×28×6，参数 5×5×1×6+6 = 156。</text>
  <text x="42" y="296" font-size="10" fill="#334155">→ 2×2 max pooling、S=2：⌊(28−2)/2⌋+1 = 14 → 14×14×6（池化无可训练参数）。</text>
  <text x="42" y="314" font-size="9" fill="#64748b">后续再卷积+池化得 5×5×16，展平为 400 维接全连接层，最后 softmax 输出 10 类。</text>

  <text x="30" y="344" font-size="12" font-weight="700" fill="#334155">④ 经典结构演进（补充）</text>
  <text x="30" y="364" font-size="10" fill="#334155">LeNet-5 → AlexNet（ReLU+Dropout）→ VGG（小核堆叠）→ Inception（多尺度）→ ResNet（残差）</text>
  <text x="30" y="382" font-size="10" fill="#334155">→ DenseNet / MobileNet（深度可分离卷积）/ ConvNeXt；检测与分割派生出 R-CNN、YOLO、U-Net、FCN。</text>
  <text x="30" y="398" font-size="10" fill="#64748b">易错：池化不改变通道数；「same」填充可保持尺寸；卷积层参数量与输入图像大小无关，但计算量与之成正比。</text>
</svg>
