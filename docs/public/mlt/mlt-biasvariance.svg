<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">偏差-方差分解、欠拟合与过拟合</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 泛化误差的三项分解</text>
  <rect x="30" y="62" width="620" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="82" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Err(x) = Bias²(f̂) + Var(f̂) + σ²（不可约噪声）</text>
  <text x="340" y="100" text-anchor="middle" font-size="9.5" fill="#1e3a8a">Bias：平均预测与真实函数的偏离（模型能力不足）；Var：对训练集扰动的敏感度（模型过于复杂）</text>

  <text x="30" y="134" font-size="12" font-weight="700" fill="#334155">② 模型复杂度与误差的 U 形关系</text>
  <rect x="30" y="144" width="330" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="56" y1="286" x2="336" y2="286" stroke="#94a3b8"/><line x1="56" y1="286" x2="56" y2="158" stroke="#94a3b8"/>
  <text x="196" y="302" text-anchor="middle" font-size="9" fill="#64748b">模型复杂度 →</text>
  <text x="44" y="164" font-size="9" fill="#64748b">误差</text>
  <path d="M64 178 C110 210, 160 246, 240 262 C290 270, 320 274, 336 276" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M64 268 C120 274, 180 276, 240 278 C290 280, 320 281, 336 282" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M64 262 C90 210, 130 186, 175 184 C215 186, 260 220, 336 270" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="80" y="176" font-size="9" fill="#dc2626">偏差²</text>
  <text x="300" y="270" font-size="9" fill="#2563eb">训练误差</text>
  <text x="196" y="180" font-size="9" fill="#16a34a">泛化误差（U 形，最低点在中间）</text>
  <text x="70" y="252" font-size="9" fill="#64748b">欠拟合</text><text x="290" y="252" font-size="9" fill="#64748b">过拟合</text>
  <rect x="372" y="144" width="278" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="511" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#334155">三种状态对照</text>
  <text x="384" y="182" font-size="9.5" fill="#334155">欠拟合：训练误差高、验证误差高</text>
  <text x="384" y="200" font-size="9.5" fill="#334155">　→ 偏差主导，加特征/减正则/训更久</text>
  <text x="384" y="220" font-size="9.5" fill="#334155">恰到好处：验证误差最小</text>
  <text x="384" y="238" font-size="9.5" fill="#334155">　→ 用验证集或交叉验证选复杂度</text>
  <text x="384" y="258" font-size="9.5" fill="#334155">过拟合：训练误差低、验证误差高（差距大）</text>
  <text x="384" y="276" font-size="9.5" fill="#334155">　→ 方差主导，加数据/正则/早停/Dropout</text>
  <text x="384" y="296" font-size="9" fill="#64748b">Bagging 主降方差；Boosting 主降偏差</text>

  <text x="30" y="328" font-size="12" font-weight="700" fill="#334155">③ 控制过拟合的手段（按作用机理）</text>
  <rect x="30" y="338" width="150" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7"/><text x="105" y="356" text-anchor="middle" font-size="9.5" font-weight="700" fill="#075985">数据侧</text><text x="105" y="372" text-anchor="middle" font-size="9" fill="#075985">增样本 / 数据增强</text>
  <rect x="188" y="338" width="150" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="263" y="356" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">模型侧</text><text x="263" y="372" text-anchor="middle" font-size="9" fill="#166534">L1/L2 正则 / 剪枝 / Dropout</text>
  <rect x="346" y="338" width="150" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="421" y="356" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">训练侧</text><text x="421" y="372" text-anchor="middle" font-size="9" fill="#92400e">早停 / 权重衰减 / 批归一</text>
  <rect x="504" y="338" width="146" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed"/><text x="577" y="356" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">选择侧</text><text x="577" y="372" text-anchor="middle" font-size="9" fill="#5b21b6">验证集 / 交叉验证调参</text>
</svg>
