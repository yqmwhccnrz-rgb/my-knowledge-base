<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">机器学习的统计与优化基础（第 2 章）</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 概率与推断</text>
  <rect x="30" y="62" width="300" height="118" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="180" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#075985">概率基本关系</text>
  <text x="42" y="102" font-size="9.5" fill="#334155">和规则（边际）：p(x)=Σ_y p(x,y)</text>
  <text x="42" y="120" font-size="9.5" fill="#334155">积规则：p(x,y)=p(y|x)p(x)</text>
  <text x="42" y="138" font-size="9.5" fill="#334155">贝叶斯：p(θ|D)=p(D|θ)p(θ)/p(D)</text>
  <text x="42" y="156" font-size="9.5" fill="#334155">先验 p(θ) → 似然 → 后验 p(θ|D)</text>
  <text x="42" y="172" font-size="9" fill="#64748b">最大似然 MLE：argmax_θ Σ log p(xᵢ|θ)</text>
  <rect x="342" y="62" width="308" height="118" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="496" y="82" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">信息论与决策</text>
  <text x="354" y="102" font-size="9.5" fill="#334155">熵 H(X)=−Σ p(x)log p(x)（不确定性）</text>
  <text x="354" y="120" font-size="9.5" fill="#334155">交叉熵 H(p,q)=−Σ p log q（分类损失）</text>
  <text x="354" y="138" font-size="9.5" fill="#334155">KL 散度 D_KL(p‖q)=Σ p log(p/q) ≥ 0</text>
  <text x="354" y="156" font-size="9.5" fill="#334155">互信息 I(X;Y)=H(X)−H(X|Y)</text>
  <text x="354" y="172" font-size="9" fill="#64748b">最小风险决策：选期望损失最小的类别</text>

  <text x="30" y="204" font-size="12" font-weight="700" fill="#334155">② 优化：梯度下降（全书最核心的更新式）</text>
  <rect x="30" y="214" width="620" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="234" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">w ← w − η · ∇_w L(w)　　（η 为学习率，∇ 为损失函数对参数的梯度）</text>
  <text x="340" y="254" text-anchor="middle" font-size="9.5" fill="#166534">批量 GD（全量、稳但慢） → 小批量 SGD（折中、主流） → 随机 SGD（单样本、噪声大）</text>
  <text x="340" y="268" font-size="9" fill="#64748b">凸函数：局部最优即全局最优（线性回归、逻辑回归、SVM）；深度网络非凸，只能求到局部极小/鞍点附近。</text>

  <text x="30" y="296" font-size="12" font-weight="700" fill="#334155">③ 常用优化器对照（课件 Part-2）</text>
  <rect x="30" y="306" width="152" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="106" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">动量 Momentum</text>
  <text x="40" y="340" font-size="9" fill="#334155">v ← αv − ηg；w ← w + v</text>
  <text x="40" y="354" font-size="9" fill="#64748b">抑制振荡、加速峡谷方向</text>
  <rect x="190" y="306" width="152" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="266" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">AdaGrad / RMSProp</text>
  <text x="200" y="340" font-size="9" fill="#334155">按历史梯度平方自适应调 η</text>
  <text x="200" y="354" font-size="9" fill="#64748b">RMSProp 用指数衰减避免 η 单调变小</text>
  <rect x="350" y="306" width="152" height="56" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="426" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Adam（默认首选）</text>
  <text x="360" y="340" font-size="9" fill="#92400e">一阶动量 + 二阶动量 + 偏差修正</text>
  <text x="360" y="354" font-size="9" fill="#64748b">η=0.001, β₁=0.9, β₂=0.999, ε=1e−8</text>
  <rect x="510" y="306" width="140" height="56" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="580" y="324" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">约束优化</text>
  <text x="520" y="340" font-size="9" fill="#5b21b6">拉格朗日乘子 / KKT 条件</text>
  <text x="520" y="354" font-size="9" fill="#64748b">SVM 对偶推导的基础</text>

  <text x="30" y="384" font-size="10" fill="#64748b">易错：学习率过大发散、过小收敛慢；损失下降不等于泛化变好。MLE 给点估计，贝叶斯给分布；正则化等价于给参数加先验（L2↔高斯、L1↔拉普拉斯）。</text>
</svg>
