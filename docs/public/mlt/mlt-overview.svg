<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">机器学习范式总览与全书知识地图</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 三大学习范式（按反馈信号划分）</text>
  <rect x="30" y="62" width="200" height="86" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="130" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">监督学习</text>
  <text x="42" y="102" font-size="9.5" fill="#334155">带标签 (x, y) → 学映射 f(x)</text>
  <text x="42" y="120" font-size="9.5" fill="#334155">分类（离散 y）/ 回归（连续 y）</text>
  <text x="42" y="138" font-size="9" fill="#64748b">第 3–9 讲：回归、分类、SVM、树、NN</text>
  <rect x="240" y="62" width="200" height="86" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">无监督学习</text>
  <text x="252" y="102" font-size="9.5" fill="#334155">只有 x，无标签 → 发现结构</text>
  <text x="252" y="120" font-size="9.5" fill="#334155">聚类 / 降维 / 密度估计 / 生成</text>
  <text x="252" y="138" font-size="9" fill="#64748b">第 12–13、16–18 讲：GMM/PCA/VAE/GAN</text>
  <rect x="450" y="62" width="200" height="86" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">强化学习</text>
  <text x="462" y="102" font-size="9.5" fill="#334155">与环境交互 → 最大化累计回报</text>
  <text x="462" y="120" font-size="9.5" fill="#334155">状态 / 动作 / 奖励 / 策略 / 值函数</text>
  <text x="462" y="138" font-size="9" fill="#64748b">第 14–15 讲：MDP、Q-learning、策略梯度</text>

  <text x="30" y="172" font-size="12" font-weight="700" fill="#334155">② 本课程 12 章内容在流程中的位置</text>
  <rect x="30" y="182" width="620" height="132" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="44" y="194" width="192" height="52" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#075985">第 1–2 章 基础</text>
  <text x="140" y="228" text-anchor="middle" font-size="9" fill="#075985">导论、概率与最大似然、贝叶斯</text>
  <text x="140" y="242" text-anchor="middle" font-size="9" fill="#075985">信息论、凸优化与梯度下降</text>
  <rect x="244" y="194" width="192" height="52" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">第 3–5 章 基本方法</text>
  <text x="340" y="228" text-anchor="middle" font-size="9" fill="#1e3a8a">回归、分类、流程与性能评估</text>
  <text x="340" y="242" text-anchor="middle" font-size="9" fill="#1e3a8a">偏差方差、交叉验证、指标</text>
  <rect x="444" y="194" width="192" height="52" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="540" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">第 6–7 章 经典模型</text>
  <text x="540" y="228" text-anchor="middle" font-size="9" fill="#166534">核方法与 SVM、决策树</text>
  <text x="540" y="242" text-anchor="middle" font-size="9" fill="#166534">Bagging / Boosting 集成</text>
  <rect x="44" y="254" width="192" height="50" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="140" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">第 8–9 章 深度学习</text>
  <text x="140" y="288" text-anchor="middle" font-size="9" fill="#5b21b6">MLP / 反向传播 / CNN / RNN</text>
  <text x="140" y="300" text-anchor="middle" font-size="9" fill="#5b21b6">注意力与 Transformer</text>
  <rect x="244" y="254" width="192" height="50" rx="5" fill="#fce7f3" stroke="#db2777"/>
  <text x="340" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#9d174d">第 10–11 章 无监督与决策</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#9d174d">K-means / EM / PCA / ICA</text>
  <text x="340" y="300" text-anchor="middle" font-size="9" fill="#9d174d">MDP / 贝尔曼 / 策略梯度</text>
  <rect x="444" y="254" width="192" height="50" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="540" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">第 12 章 深度生成模型</text>
  <text x="540" y="288" text-anchor="middle" font-size="9" fill="#92400e">VAE / GAN / 扩散 / 归一化流</text>
  <text x="540" y="300" text-anchor="middle" font-size="9" fill="#92400e">隐变量与概率密度建模</text>

  <text x="30" y="336" font-size="12" font-weight="700" fill="#334155">③ 贯穿全书的三个核心问题</text>
  <text x="30" y="356" font-size="10.5" fill="#334155">表示（用什么假设空间 / 特征） → 优化（如何最小化损失） → 泛化（为何在未见过的数据上仍有效）。</text>
  <text x="30" y="374" font-size="10.5" fill="#334155">经验风险最小化 + 正则化、偏差-方差权衡、没有免费午餐定理是理解所有算法的统一框架。</text>
  <text x="30" y="392" font-size="10" fill="#64748b">易错：深度学习只是机器学习的一个分支；「训练误差低」不等于「模型好」，泛化能力才是目标。</text>
</svg>
