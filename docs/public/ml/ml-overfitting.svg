<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">模型复杂度、泛化 与 欠拟合 / 过拟合</text>

  <rect x="24" y="48" width="500" height="248" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="72" font-size="13" font-weight="700" fill="#1e3a8a">泛化性能随模型复杂度的变化</text>
  <line x1="70" y1="266" x2="500" y2="266" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="266" x2="70" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="62" y="96" text-anchor="end" font-size="11" fill="#6b7280">分数</text>
  <text x="490" y="284" text-anchor="end" font-size="11" fill="#6b7280">模型复杂度</text>
  <path d="M84,232 C160,190 230,150 300,138 C370,126 430,150 490,196" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <path d="M84,244 C170,206 250,124 320,116 C400,108 450,124 490,142" fill="none" stroke="#0891b2" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="300" y1="100" x2="300" y2="266" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="300" y="96" text-anchor="middle" font-size="11" fill="#c0392b">最佳复杂度</text>
  <g font-size="11">
    <rect x="340" y="110" width="12" height="4" fill="#1e3a8a"/><text x="358" y="115" fill="#1e3a8a">测试集 / 泛化性能</text>
    <rect x="340" y="128" width="12" height="4" fill="#0891b2"/><text x="358" y="133" fill="#0891b2">训练集性能</text>
  </g>
  <text x="92" y="252" font-size="11" fill="#92400e">欠拟合</text>
  <text x="424" y="252" font-size="11" fill="#c0392b">过拟合</text>

  <text x="546" y="72" font-size="13" font-weight="700" fill="#1e3a8a">三种状态的判别</text>
  <g font-size="12" fill="#1f2937">
    <rect x="546" y="82" width="330" height="66" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="561" y="104" font-weight="700" fill="#92400e">欠拟合（underfitting）</text>
    <text x="561" y="124" font-size="11" fill="#78350f">训练集与测试集分数都低、且彼此接近</text>
    <text x="561" y="141" font-size="11" fill="#78350f">模型太简单，抓不住数据中的变化</text>
    <rect x="546" y="156" width="330" height="66" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="561" y="178" font-weight="700" fill="#1e3a8a">合适的模型</text>
    <text x="561" y="198" font-size="11" fill="#374151">训练与测试分数都高且接近</text>
    <text x="561" y="215" font-size="11" fill="#374151">对新数据有良好的泛化能力</text>
    <rect x="546" y="230" width="330" height="66" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="561" y="252" font-weight="700" fill="#b91c1c">过拟合（overfitting）</text>
    <text x="561" y="272" font-size="11" fill="#7f1d1d">训练集分数很高、测试集明显更低</text>
    <text x="561" y="289" font-size="11" fill="#7f1d1d">把噪声也拟合了进去</text>
  </g>

  <text x="24" y="330" font-size="14" font-weight="700" fill="#1e3a8a">控制复杂度的常见旋钮</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="342" width="204" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="126" y="362" text-anchor="middle" font-weight="600" fill="#1e3a8a">k-NN：n_neighbors</text>
    <text x="126" y="380" text-anchor="middle" font-size="11" fill="#374151">越小越复杂</text>
    <rect x="238" y="342" width="204" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="340" y="362" text-anchor="middle" font-weight="600" fill="#1e3a8a">Ridge / Lasso：alpha</text>
    <text x="340" y="380" text-anchor="middle" font-size="11" fill="#374151">越大越简单（正则更强）</text>
    <rect x="452" y="342" width="204" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="554" y="362" text-anchor="middle" font-weight="600" fill="#1e3a8a">SVM / Logistic：C</text>
    <text x="554" y="380" text-anchor="middle" font-size="11" fill="#374151">越大越复杂（约束越弱）</text>
    <rect x="666" y="342" width="210" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="771" y="362" text-anchor="middle" font-weight="600" fill="#1e3a8a">树：max_depth / 剪枝</text>
    <text x="771" y="380" text-anchor="middle" font-size="11" fill="#374151">越深受限越少</text>
  </g>
</svg>
