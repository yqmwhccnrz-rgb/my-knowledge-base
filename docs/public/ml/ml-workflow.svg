<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="wf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">机器学习工作流 与 scikit-learn 估计器接口</text>

  <text x="24" y="60" font-size="14" font-weight="700" fill="#1e3a8a">① 从问题到模型的完整链路</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="72" width="150" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="99" y="96" text-anchor="middle" font-weight="600" fill="#1e3a8a">理解问题与数据</text>
    <text x="99" y="116" text-anchor="middle" font-size="11" fill="#374151">样本 = 行 / 特征 = 列</text>
    <rect x="204" y="72" width="150" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="279" y="96" text-anchor="middle" font-weight="600" fill="#1e3a8a">划分数据集</text>
    <text x="279" y="116" text-anchor="middle" font-size="11" fill="#374151">train_test_split 先打乱</text>
    <rect x="384" y="72" width="150" height="58" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="459" y="96" text-anchor="middle" font-weight="600" fill="#1e3a8a">特征工程与缩放</text>
    <text x="459" y="116" text-anchor="middle" font-size="11" fill="#374151">只在训练集 fit</text>
    <rect x="564" y="72" width="150" height="58" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="639" y="96" text-anchor="middle" font-weight="600" fill="#1e3a8a">拟合模型 fit</text>
    <text x="639" y="116" text-anchor="middle" font-size="11" fill="#374151">估计器 + 参数</text>
    <rect x="744" y="72" width="132" height="58" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="810" y="96" text-anchor="middle" font-weight="700" fill="#92400e">评估与调参</text>
    <text x="810" y="116" text-anchor="middle" font-size="11" fill="#78350f">测试集只用一次</text>
    <line x1="176" y1="101" x2="200" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#wf)"/>
    <line x1="356" y1="101" x2="380" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#wf)"/>
    <line x1="536" y1="101" x2="560" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#wf)"/>
    <line x1="716" y1="101" x2="740" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#wf)"/>
  </g>

  <text x="24" y="166" font-size="14" font-weight="700" fill="#1e3a8a">② 所有算法都是「估计器」，共享统一接口</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="178" width="204" height="72" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="202" text-anchor="middle" font-weight="700" fill="#1e3a8a">fit(X, y)</text>
    <text x="126" y="224" text-anchor="middle" font-size="11" fill="#374151">从数据学习模型参数</text>
    <text x="126" y="241" text-anchor="middle" font-size="11" fill="#6b7280">调用 fit 会重置已学内容</text>
    <rect x="238" y="178" width="204" height="72" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="340" y="202" text-anchor="middle" font-weight="700" fill="#1e3a8a">predict(X)</text>
    <text x="340" y="224" text-anchor="middle" font-size="11" fill="#374151">输出标签 / 回归值 / 簇号</text>
    <text x="340" y="241" text-anchor="middle" font-size="11" fill="#6b7280">decision_function / predict_proba</text>
    <rect x="452" y="178" width="204" height="72" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="554" y="202" text-anchor="middle" font-weight="700" fill="#1e3a8a">transform(X)</text>
    <text x="554" y="224" text-anchor="middle" font-size="11" fill="#374151">生成数据的新表示</text>
    <text x="554" y="241" text-anchor="middle" font-size="11" fill="#6b7280">缩放 / 降维 / 特征提取</text>
    <rect x="666" y="178" width="210" height="72" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="771" y="202" text-anchor="middle" font-weight="700" fill="#1e3a8a">score(X, y)</text>
    <text x="771" y="224" text-anchor="middle" font-size="11" fill="#374151">分类默认精度</text>
    <text x="771" y="241" text-anchor="middle" font-size="11" fill="#6b7280">回归默认 R²</text>
  </g>

  <text x="24" y="286" font-size="14" font-weight="700" fill="#1e3a8a">③ 两类学习任务</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="298" width="414" height="60" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="231" y="322" text-anchor="middle" font-weight="600" fill="#1e3a8a">监督学习：有输入 / 输出对（标签）</text>
    <text x="231" y="343" text-anchor="middle" font-size="11" fill="#374151">分类（离散类别）· 回归（连续值）</text>
    <rect x="452" y="298" width="424" height="60" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="664" y="322" text-anchor="middle" font-weight="600" fill="#1e3a8a">无监督学习：只有输入，没有输出</text>
    <text x="664" y="343" text-anchor="middle" font-size="11" fill="#374151">降维 / 聚类 / 无监督变换</text>
  </g>

  <rect x="24" y="372" width="852" height="34" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="393" text-anchor="middle" font-size="12" fill="#78350f">X 为二维数组（行 = 样本、列 = 特征），y 为一维目标；预测单个样本也要构造成二维输入。</text>
</svg>
