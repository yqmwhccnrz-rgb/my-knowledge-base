<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">三种聚类算法的对比（k 均值 / 凝聚 / DBSCAN）</text>

  <g font-size="12" fill="#1f2937">
    <rect x="24" y="48" width="272" height="176" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">k 均值 KMeans</text>
    <text x="44" y="98">· 随机选 k 个中心 → 分配 → 更新均值</text>
    <text x="44" y="120">· 需指定簇数 n_clusters</text>
    <text x="44" y="142">· 有 cluster_centers_ 可表示簇</text>
    <text x="44" y="164">· 假设簇大小相近、各向同性、凸形</text>
    <text x="44" y="186" fill="#c0392b">· 无噪声概念，所有点都被分配</text>
    <text x="44" y="208" fill="#c0392b">· 对拉长 / 复杂形状簇失效</text>

    <rect x="310" y="48" width="272" height="176" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="446" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">凝聚聚类 Agglomerative</text>
    <text x="330" y="98">· 自底向上反复合并最相似的两组</text>
    <text x="330" y="120">· 需指定簇数；linkage 默认 ward</text>
    <text x="330" y="142">· 提供完整层次结构，可画树状图</text>
    <text x="330" y="164">· 簇大小通常比较均匀</text>
    <text x="330" y="186" fill="#c0392b">· 无噪声概念、无簇中心</text>
    <text x="330" y="208" fill="#6b7280">· SciPy dendrogram 辅助定簇数</text>

    <rect x="596" y="48" width="280" height="176" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="736" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">DBSCAN（基于密度）</text>
    <text x="616" y="98">· 从核心样本出发按密度扩展簇</text>
    <text x="616" y="120">· 不需预先指定簇数</text>
    <text x="616" y="142" fill="#1e3a8a">· 能识别噪声点（标签 -1）</text>
    <text x="616" y="164" fill="#1e3a8a">· 能处理复杂形状的簇</text>
    <text x="616" y="186">· eps 太小全是噪声、太大并成一簇</text>
    <text x="616" y="208" fill="#92400e">· 簇大小可能差异很大</text>
  </g>

  <text x="24" y="258" font-size="13" font-weight="700" fill="#1e3a8a">能力对照</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="270" width="852" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="120" y="292" text-anchor="middle" font-weight="600" fill="#1e3a8a">维度</text>
    <text x="330" y="292" text-anchor="middle" font-weight="600" fill="#1e3a8a">k 均值</text>
    <text x="540" y="292" text-anchor="middle" font-weight="600" fill="#1e3a8a">凝聚聚类</text>
    <text x="750" y="292" text-anchor="middle" font-weight="600" fill="#1e3a8a">DBSCAN</text>
    <rect x="24" y="306" width="852" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="120" y="326" text-anchor="middle">需指定簇数</text><text x="330" y="326" text-anchor="middle">是</text><text x="540" y="326" text-anchor="middle">是</text><text x="750" y="326" text-anchor="middle" fill="#1e3a8a">否</text>
    <rect x="24" y="338" width="852" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="120" y="358" text-anchor="middle">噪声点</text><text x="330" y="358" text-anchor="middle">无</text><text x="540" y="358" text-anchor="middle">无</text><text x="750" y="358" text-anchor="middle" fill="#1e3a8a">有</text>
  </g>

  <rect x="24" y="376" width="852" height="28" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="395" text-anchor="middle" font-size="12" fill="#78350f">评估不用 accuracy：有标签用 ARI / NMI，无标签用轮廓系数，并结合人工检查簇内样本。</text>
</svg>
