<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="tx" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">文本数据处理：词袋 → tf-idf → 模型</text>

  <text x="24" y="58" font-size="13" font-weight="700" fill="#1e3a8a">① 处理链（以电影评论情感分析为例）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="70" width="158" height="62" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="103" y="94" text-anchor="middle" font-weight="600" fill="#1e3a8a">原始文本</text>
    <text x="103" y="114" text-anchor="middle" font-size="11" fill="#374151">影评字符串列表</text>
    <rect x="212" y="70" width="158" height="62" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="291" y="94" text-anchor="middle" font-weight="600" fill="#1e3a8a">分词 / 词袋</text>
    <text x="291" y="114" text-anchor="middle" font-size="11" fill="#374151">转小写 · min_df 去稀有词</text>
    <rect x="400" y="70" width="158" height="62" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="479" y="94" text-anchor="middle" font-weight="600" fill="#1e3a8a">tf-idf 加权</text>
    <text x="479" y="114" text-anchor="middle" font-size="11" fill="#374151">抑制高频常见词</text>
    <rect x="588" y="70" width="158" height="62" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="667" y="94" text-anchor="middle" font-weight="600" fill="#1e3a8a">线性分类器</text>
    <text x="667" y="114" text-anchor="middle" font-size="11" fill="#374151">LogisticRegression</text>
    <rect x="776" y="70" width="100" height="62" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="826" y="94" text-anchor="middle" font-weight="700" fill="#92400e">情感</text>
    <text x="826" y="114" text-anchor="middle" font-size="11" fill="#78350f">正面 / 负面</text>
    <line x1="184" y1="101" x2="208" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#tx)"/>
    <line x1="372" y1="101" x2="396" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#tx)"/>
    <line x1="560" y1="101" x2="584" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#tx)"/>
    <line x1="748" y1="101" x2="772" y2="101" stroke="#94a3b8" stroke-width="2" marker-end="url(#tx)"/>
  </g>
  <text x="24" y="152" font-size="11" fill="#6b7280">词袋输出 SciPy 稀疏矩阵；tf-idf 利用了训练语料统计量，必须放进 Pipeline。</text>

  <text x="24" y="184" font-size="13" font-weight="700" fill="#1e3a8a">② 关键旋钮</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="196" width="204" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="218" text-anchor="middle" font-weight="600" fill="#1e3a8a">min_df / max_df</text>
    <text x="126" y="238" text-anchor="middle" font-size="11" fill="#374151">按文档频次筛词</text>
    <text x="126" y="258" text-anchor="middle" font-size="11" fill="#374151">减少特征、加速训练</text>
    <rect x="238" y="196" width="204" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="340" y="218" text-anchor="middle" font-weight="600" fill="#1e3a8a">stop_words</text>
    <text x="340" y="238" text-anchor="middle" font-size="11" fill="#374151">固定停用词表</text>
    <text x="340" y="258" text-anchor="middle" font-size="11" fill="#92400e">主要对小数据集有用</text>
    <rect x="452" y="196" width="204" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="554" y="218" text-anchor="middle" font-weight="600" fill="#1e3a8a">ngram_range</text>
    <text x="554" y="238" text-anchor="middle" font-size="11" fill="#374151">(1,2) 加二元分词</text>
    <text x="554" y="258" text-anchor="middle" font-size="11" fill="#374151">捕捉 not worth 这类上下文</text>
    <rect x="666" y="196" width="210" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="771" y="218" text-anchor="middle" font-weight="600" fill="#1e3a8a">词形还原 / 词干</text>
    <text x="771" y="238" text-anchor="middle" font-size="11" fill="#374151">was → be（词形还原更准）</text>
    <text x="771" y="258" text-anchor="middle" font-size="11" fill="#374151">自定义 tokenizer 接入</text>
  </g>

  <text x="24" y="306" font-size="13" font-weight="700" fill="#1e3a8a">③ 延伸：主题建模 LDA</text>
  <rect x="24" y="318" width="852" height="46" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="44" y="338" font-size="12" fill="#1f2937">每个主题 = 词上的分布，每篇文档 = 主题上的混合；主题无顺序、依赖 random_state，需用主题内文档人工验证。</text>
  <text x="44" y="356" font-size="11" fill="#6b7280">LDA 主题也可作为监督学习的紧凑特征，训练样本很少时尤其有用。</text>

  <rect x="24" y="370" width="852" height="24" rx="7" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="386" text-anchor="middle" font-size="11" fill="#78350f">中文没有天然词边界，使用英文空格分词流程前需先做中文分词。</text>
</svg>
