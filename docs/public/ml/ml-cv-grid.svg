<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">交叉验证、数据三分 与 网格搜索</text>

  <text x="24" y="58" font-size="13" font-weight="700" fill="#1e3a8a">① 数据必须三分为训练 / 验证 / 测试</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="70" width="380" height="56" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="214" y="94" text-anchor="middle" font-weight="600" fill="#1e3a8a">训练集 training</text>
    <text x="214" y="113" text-anchor="middle" font-size="11" fill="#374151">构建模型</text>
    <rect x="414" y="70" width="220" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="524" y="94" text-anchor="middle" font-weight="600" fill="#92400e">验证集 validation</text>
    <text x="524" y="113" text-anchor="middle" font-size="11" fill="#78350f">选模型、选参数</text>
    <rect x="644" y="70" width="232" height="56" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="760" y="94" text-anchor="middle" font-weight="600" fill="#b91c1c">测试集 test</text>
    <text x="760" y="113" text-anchor="middle" font-size="11" fill="#7f1d1d">只在最后评估一次</text>
  </g>
  <text x="24" y="148" font-size="11" fill="#c0392b">若用测试集或交叉验证去选参数，测试数据就被「用完了」，再用它评估会得到过于乐观的估计。</text>

  <text x="24" y="180" font-size="13" font-weight="700" fill="#1e3a8a">② 5 折交叉验证：轮流用 1 折做验证，取平均</text>
  <g font-size="11" fill="#1f2937">
    <rect x="24" y="192" width="852" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="210">折 1</text>
    <rect x="90" y="195" width="140" height="20" rx="4" fill="#fca5a5"/><text x="160" y="210" text-anchor="middle" fill="#7f1d1d">验证</text>
    <rect x="234" y="195" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="378" y="195" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="522" y="195" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="666" y="195" width="140" height="20" rx="4" fill="#93c5fd"/>
    <rect x="24" y="222" width="852" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="240">折 2</text>
    <rect x="90" y="225" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="234" y="225" width="140" height="20" rx="4" fill="#fca5a5"/><text x="304" y="240" text-anchor="middle" fill="#7f1d1d">验证</text>
    <rect x="378" y="225" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="522" y="225" width="140" height="20" rx="4" fill="#93c5fd"/><rect x="666" y="225" width="140" height="20" rx="4" fill="#93c5fd"/>
    <rect x="24" y="252" width="852" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="270">…</text><text x="450" y="270" text-anchor="middle" fill="#6b7280">每折都训练一次、验证一次，共 5 个分数，取均值与标准差</text>
  </g>

  <text x="24" y="312" font-size="13" font-weight="700" fill="#1e3a8a">③ 网格搜索 GridSearchCV</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="324" width="272" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="346" text-anchor="middle" font-weight="600" fill="#1e3a8a">param_grid 参数组合</text>
    <text x="160" y="367" text-anchor="middle" font-size="11" fill="#374151">每加一个参数，模型数指数增长</text>
    <rect x="310" y="324" width="272" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="446" y="346" text-anchor="middle" font-weight="600" fill="#1e3a8a">每组合跑一次交叉验证</text>
    <text x="446" y="367" text-anchor="middle" font-size="11" fill="#374151">cv_results_ 记录均值与标准差</text>
    <rect x="596" y="324" width="280" height="60" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="736" y="346" text-anchor="middle" font-weight="700" fill="#92400e">best_params_ / best_score_</text>
    <text x="736" y="367" text-anchor="middle" font-size="11" fill="#78350f">best_score_ 是验证均分，不是测试分</text>
  </g>

  <rect x="24" y="392" width="852" height="24" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="450" y="408" text-anchor="middle" font-size="11" fill="#1e3a8a">分类默认用分层 k 折；同一主体的多条记录用 GroupKFold，groups 是分组标识而非标签。</text>
</svg>
