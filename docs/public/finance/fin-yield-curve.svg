<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">利率期限结构：收益率曲线的三种形态与三种理论</text>

  <text x="24" y="60" font-size="14" font-weight="700" fill="#1e3a8a">① 收益率曲线（纵轴：利率；横轴：到期期限）</text>
  <rect x="24" y="72" width="400" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="66" y1="290" x2="400" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="66" y1="290" x2="66" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="58" y="294" text-anchor="end" font-size="11" fill="#6b7280">0</text>
  <text x="56" y="96" text-anchor="end" font-size="11" fill="#6b7280">利率</text>
  <text x="398" y="308" text-anchor="end" font-size="11" fill="#6b7280">期限</text>
  <polyline points="80,262 150,240 220,214 290,182 360,146" fill="none" stroke="#1e3a8a" stroke-width="3"/>
  <polyline points="80,196 150,196 220,196 290,196 360,196" fill="none" stroke="#0891b2" stroke-width="3" stroke-dasharray="7 5"/>
  <polyline points="80,132 150,158 220,186 290,218 360,254" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="3 4"/>
  <g font-size="11">
    <rect x="80" y="102" width="12" height="4" fill="#1e3a8a"/><text x="98" y="107" fill="#1e3a8a">向上倾斜（正常）</text>
    <rect x="216" y="102" width="12" height="4" fill="#0891b2"/><text x="234" y="107" fill="#0891b2">水平</text>
    <rect x="292" y="102" width="12" height="4" fill="#c0392b"/><text x="310" y="107" fill="#c0392b">倒挂</text>
  </g>

  <text x="446" y="60" font-size="14" font-weight="700" fill="#1e3a8a">② 三个典型事实</text>
  <g font-size="12" fill="#374151">
    <rect x="446" y="72" width="430" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="460" y="90" font-weight="600" fill="#1e3a8a">1 同向波动</text>
    <text x="460" y="108">不同期限债券的利率随时间一起波动</text>
    <rect x="446" y="122" width="430" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="460" y="140" font-weight="600" fill="#1e3a8a">2 形状随短期利率变化</text>
    <text x="460" y="158">短期利率低时右上倾斜；高时右下倾斜</text>
    <rect x="446" y="172" width="430" height="44" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="460" y="190" font-weight="600" fill="#1e3a8a">3 几乎总是右上倾斜</text>
    <text x="460" y="208">长期利率通常高于短期利率</text>
  </g>

  <text x="24" y="352" font-size="14" font-weight="700" fill="#1e3a8a">③ 三种期限结构理论</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="362" width="272" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">预期假说</text>
    <text x="160" y="401" text-anchor="middle" font-size="11" fill="#374151">长期利率 = 预期短期利率平均</text>
    <rect x="310" y="362" width="272" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="446" y="382" text-anchor="middle" font-weight="600" fill="#1e3a8a">分割市场理论</text>
    <text x="446" y="401" text-anchor="middle" font-size="11" fill="#374151">各期限市场独立、不可替代</text>
    <rect x="596" y="362" width="280" height="52" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="736" y="382" text-anchor="middle" font-weight="600" fill="#92400e">期限选择 / 流动性升水</text>
    <text x="736" y="401" text-anchor="middle" font-size="11" fill="#78350f">含正期限升水，解释力最强</text>
  </g>
</svg>
