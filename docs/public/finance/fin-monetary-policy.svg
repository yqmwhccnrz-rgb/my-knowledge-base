<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">货币政策：三大工具 · 传导链条 · 最终目标</text>

  <text x="24" y="60" font-size="14" font-weight="700" fill="#1e3a8a">① 一般性工具（三大法宝）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="72" width="272" height="80" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">法定存款准备金政策</text>
    <text x="160" y="117" text-anchor="middle" font-size="11" fill="#374151">调整 rd 影响信用创造能力</text>
    <text x="160" y="137" text-anchor="middle" font-size="11" fill="#c0392b">最猛烈 · 缺乏弹性 · 不宜日常微调</text>
    <rect x="310" y="72" width="272" height="80" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="446" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">再贴现政策</text>
    <text x="446" y="117" text-anchor="middle" font-size="11" fill="#374151">调整再贴现率影响信贷与市场利率</text>
    <text x="446" y="137" text-anchor="middle" font-size="11" fill="#92400e">短期 / 官定 / 标准利率 · 被动性强</text>
    <rect x="596" y="72" width="280" height="80" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="736" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">公开市场操作</text>
    <text x="736" y="117" text-anchor="middle" font-size="11" fill="#374151">买卖政府债券投放 / 回笼基础货币</text>
    <text x="736" y="137" text-anchor="middle" font-size="11" fill="#1e3a8a">主动性 · 灵活性 · 时效性 · 市场化</text>
  </g>

  <text x="24" y="190" font-size="14" font-weight="700" fill="#1e3a8a">② 传导链条</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="204" width="180" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="114" y="228" text-anchor="middle" font-weight="600" fill="#1e3a8a">政策工具</text>
    <text x="114" y="248" text-anchor="middle" font-size="11" fill="#374151">准备金 / 再贴现 / 公开市场</text>
    <rect x="240" y="204" width="180" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="330" y="228" text-anchor="middle" font-weight="600" fill="#1e3a8a">操作目标</text>
    <text x="330" y="248" text-anchor="middle" font-size="11" fill="#374151">基础货币 · 短期利率</text>
    <rect x="456" y="204" width="180" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="546" y="228" text-anchor="middle" font-weight="600" fill="#1e3a8a">中介目标</text>
    <text x="546" y="248" text-anchor="middle" font-size="11" fill="#374151">货币供应量 · 长期利率</text>
    <rect x="672" y="204" width="204" height="58" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="774" y="228" text-anchor="middle" font-weight="700" fill="#92400e">最终目标</text>
    <text x="774" y="248" text-anchor="middle" font-size="11" fill="#78350f">见下方四大目标</text>
    <line x1="206" y1="233" x2="236" y2="233" stroke="#94a3b8" stroke-width="2" marker-end="url(#p)"/>
    <line x1="422" y1="233" x2="452" y2="233" stroke="#94a3b8" stroke-width="2" marker-end="url(#p)"/>
    <line x1="638" y1="233" x2="668" y2="233" stroke="#94a3b8" stroke-width="2" marker-end="url(#p)"/>
  </g>
  <text x="450" y="284" text-anchor="middle" font-size="11" fill="#6b7280">传导渠道：利率 · 信贷 · 资产价格 · 汇率 · 预期</text>

  <text x="24" y="316" font-size="14" font-weight="700" fill="#1e3a8a">③ 四大最终目标</text>
  <g font-size="13" fill="#1f2937">
    <rect x="24" y="328" width="204" height="48" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="126" y="358" text-anchor="middle" font-weight="600" fill="#1e3a8a">物价稳定（首要）</text>
    <rect x="238" y="328" width="204" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="340" y="358" text-anchor="middle" font-weight="600">充分就业</text>
    <rect x="452" y="328" width="204" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="554" y="358" text-anchor="middle" font-weight="600">经济增长</text>
    <rect x="666" y="328" width="210" height="48" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="771" y="358" text-anchor="middle" font-weight="600">国际收支平衡</text>
  </g>

  <rect x="24" y="388" width="852" height="32" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="409" text-anchor="middle" font-size="12" fill="#78350f">物价稳定 ≠ 价格固定不变；充分就业 ≠ 失业率为零。我国利率走廊：SLF 为上限、超额准备金利率为下限，MLF 引导中期利率。</text>
</svg>
