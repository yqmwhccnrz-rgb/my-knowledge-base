<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">存款货币的派生 与 货币乘数（rd = 20% 示例）</text>

  <text x="24" y="60" font-size="14" font-weight="700" fill="#1e3a8a">① 派生链条：每一轮留下 20% 准备金，其余贷出并回流</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="74" width="150" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="99" y="96" text-anchor="middle" font-weight="600">原始存款 100</text>
    <text x="99" y="115" text-anchor="middle" font-size="11" fill="#374151">准备金 20 / 贷出 80</text>
    <rect x="206" y="74" width="150" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="281" y="96" text-anchor="middle" font-weight="600">第 2 轮 80</text>
    <text x="281" y="115" text-anchor="middle" font-size="11" fill="#374151">准备金 16 / 贷出 64</text>
    <rect x="388" y="74" width="150" height="52" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="463" y="96" text-anchor="middle" font-weight="600">第 3 轮 64</text>
    <text x="463" y="115" text-anchor="middle" font-size="11" fill="#374151">准备金 12.8 / 贷出 51.2</text>
    <rect x="570" y="74" width="120" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="630" y="106" text-anchor="middle" fill="#6b7280">… 逐轮递减</text>
    <rect x="722" y="74" width="154" height="52" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="799" y="96" text-anchor="middle" font-weight="700" fill="#92400e">合计 500</text>
    <text x="799" y="115" text-anchor="middle" font-size="11" fill="#78350f">派生存款 400</text>
    <line x1="176" y1="100" x2="202" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#flow)"/>
    <line x1="358" y1="100" x2="384" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#flow)"/>
    <line x1="540" y1="100" x2="566" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#flow)"/>
    <line x1="692" y1="100" x2="718" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#flow)"/>
  </g>

  <text x="24" y="164" font-size="14" font-weight="700" fill="#1e3a8a">② 存款乘数的四种情形（分母每多一项，乘数变小）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="24" y="176" width="204" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="199" text-anchor="middle" font-weight="600" fill="#1e3a8a">简单情形</text>
    <text x="126" y="222" text-anchor="middle" font-size="13">d = 1 / rd</text>
    <rect x="238" y="176" width="204" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="340" y="199" text-anchor="middle" font-weight="600" fill="#1e3a8a">加超额准备金 e</text>
    <text x="340" y="222" text-anchor="middle" font-size="13">d = 1 / (rd + e)</text>
    <rect x="452" y="176" width="204" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="554" y="199" text-anchor="middle" font-weight="600" fill="#1e3a8a">加现金漏损 c</text>
    <text x="554" y="222" text-anchor="middle" font-size="13">d = 1 / (c + rd + e)</text>
    <rect x="666" y="176" width="210" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="771" y="199" text-anchor="middle" font-weight="600" fill="#1e3a8a">加定期存款</text>
    <text x="771" y="222" text-anchor="middle" font-size="12">d = 1 / (c + rd + e + rt·t)</text>
  </g>

  <text x="24" y="278" font-size="14" font-weight="700" fill="#1e3a8a">③ 货币供给量与可控性</text>
  <rect x="24" y="290" width="852" height="56" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="450" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Ms = 基础货币 B × 货币乘数 m</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#374151">B = 流通中通货 C + 存款准备金 R（央行负债）</text>
  <g font-size="12">
    <rect x="24" y="358" width="414" height="42" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="231" y="384" text-anchor="middle" fill="#1e3a8a">央行可控：B、法定准备金率 rd</text>
    <rect x="452" y="358" width="424" height="42" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="664" y="384" text-anchor="middle" fill="#78350f">央行不可控：通货比率 c（公众）、超额准备金率 e（银行）、t（存款人）</text>
  </g>
</svg>
