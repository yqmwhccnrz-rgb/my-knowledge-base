<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="money" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e3a8a"/></marker>
    <marker id="sec" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">金融市场的资金融通流程：直接金融 与 间接金融</text>

  <rect x="24" y="48" width="852" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="72" font-size="14" font-weight="700" fill="#1e3a8a">① 直接金融（资金供求双方直接建立债权债务或所有权关系）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="70" y="96" width="180" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="120" text-anchor="middle" font-weight="600" fill="#1e3a8a">资金供给者</text>
    <text x="160" y="140" text-anchor="middle" font-size="11" fill="#374151">居民 / 机构投资人</text>
    <rect x="610" y="96" width="180" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="700" y="120" text-anchor="middle" font-weight="600" fill="#1e3a8a">资金需求者</text>
    <text x="700" y="140" text-anchor="middle" font-size="11" fill="#374151">企业 / 政府</text>
    <rect x="336" y="98" width="188" height="56" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="430" y="120" text-anchor="middle" font-weight="600" fill="#92400e">证券市场</text>
    <text x="430" y="139" text-anchor="middle" font-size="11" fill="#78350f">股票 · 债券 · 一级市场</text>
  </g>
  <line x1="252" y1="118" x2="332" y2="118" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#money)"/>
  <line x1="526" y1="118" x2="606" y2="118" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#money)"/>
  <text x="292" y="110" text-anchor="middle" font-size="11" fill="#1e3a8a">资金</text>
  <text x="566" y="110" text-anchor="middle" font-size="11" fill="#1e3a8a">资金</text>
  <line x1="606" y1="146" x2="526" y2="146" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sec)"/>
  <line x1="332" y1="146" x2="252" y2="146" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sec)"/>
  <text x="566" y="164" text-anchor="middle" font-size="11" fill="#0891b2">证券 / 债权凭证</text>
  <text x="292" y="164" text-anchor="middle" font-size="11" fill="#0891b2">证券 / 债权凭证</text>

  <rect x="24" y="202" width="852" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="226" font-size="14" font-weight="700" fill="#1e3a8a">② 间接金融（通过金融中介完成期限、规模与风险转换）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="70" y="250" width="180" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="160" y="274" text-anchor="middle" font-weight="600" fill="#1e3a8a">资金供给者</text>
    <text x="160" y="294" text-anchor="middle" font-size="11" fill="#374151">存款人</text>
    <rect x="336" y="250" width="188" height="60" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="430" y="274" text-anchor="middle" font-weight="600" fill="#1e3a8a">金融中介</text>
    <text x="430" y="294" text-anchor="middle" font-size="11" fill="#374151">商业银行 / 保险公司</text>
    <rect x="610" y="250" width="180" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="700" y="274" text-anchor="middle" font-weight="600" fill="#1e3a8a">资金需求者</text>
    <text x="700" y="294" text-anchor="middle" font-size="11" fill="#374151">借款企业 / 个人</text>
  </g>
  <line x1="252" y1="280" x2="332" y2="280" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#money)"/>
  <line x1="526" y1="280" x2="606" y2="280" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#money)"/>
  <text x="292" y="272" text-anchor="middle" font-size="11" fill="#1e3a8a">存款</text>
  <text x="566" y="272" text-anchor="middle" font-size="11" fill="#1e3a8a">贷款</text>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#6b7280">两层信用关系 · 中介承担信用风险 · 节约交易成本与信息不对称</text>

  <rect x="24" y="356" width="852" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="376" text-anchor="middle" font-size="12" fill="#78350f">一级市场完成储蓄向投资转化，二级市场提供流动性与价格发现；两者共同构成金融市场。</text>
</svg>
