<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">物权变动规则与担保物权体系</text>
  <text x="450" y="48" text-anchor="middle" font-size="12" fill="#64748b">不动产看登记、动产看交付；「登记生效」与「登记对抗」是高频考点</text>

  <rect x="20" y="64" width="420" height="164" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="230" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">不动产物权：登记生效</text>
  <text x="38" y="112" font-size="11.5" fill="#1e40af">原则：经依法登记发生效力；未登记不发生物权效力</text>
  <text x="38" y="134" font-size="11.5" fill="#1e40af">例外（登记对抗）：土地承包经营权、地役权、</text>
  <text x="50" y="152" font-size="11.5" fill="#1e40af">正在建造的船舶航空器、机动车等特殊动产</text>
  <text x="38" y="176" font-size="11.5" fill="#1e40af">例外（无需登记）：依法属于国家所有的自然资源</text>
  <text x="38" y="200" font-size="11" fill="#1e3a8a">合同效力与物权变动分离：未办登记不影响合同效力</text>

  <rect x="460" y="64" width="420" height="164" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="670" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">动产物权：交付生效</text>
  <text x="478" y="112" font-size="11.5" fill="#166534">现实交付 · 简易交付（受让人已占有）</text>
  <text x="478" y="134" font-size="11.5" fill="#166534">指示交付（返还请求权让与）· 占有改定</text>
  <text x="478" y="158" font-size="11.5" fill="#166534">特殊动产（船舶 / 航空器 / 机动车）：</text>
  <text x="490" y="176" font-size="11.5" fill="#166534">交付即变动，未经登记不得对抗善意第三人</text>
  <text x="478" y="200" font-size="11" fill="#14532d">善意取得：善意 + 合理价格 + 已登记 / 已交付</text>

  <text x="450" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">担保物权三分法</text>
  <line x1="450" y1="260" x2="450" y2="274" stroke="#94a3b8"/>
  <line x1="155" y1="274" x2="745" y2="274" stroke="#94a3b8"/>
  <g stroke="#94a3b8"><line x1="155" y1="274" x2="155" y2="288"/><line x1="450" y1="274" x2="450" y2="288"/><line x1="745" y1="274" x2="745" y2="288"/></g>

  <rect x="30" y="288" width="250" height="122" rx="9" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="155" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">抵押权（不转移占有）</text>
  <text x="44" y="334" font-size="11.5" fill="#312e81">不动产抵押：登记生效</text>
  <text x="44" y="354" font-size="11.5" fill="#312e81">动产抵押：合同生效时设立，</text>
  <text x="56" y="372" font-size="11.5" fill="#312e81">未经登记不得对抗善意第三人</text>
  <text x="44" y="396" font-size="11" fill="#4338ca">禁止抵押：土地所有权、宅基地、</text>

  <rect x="325" y="288" width="250" height="122" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="450" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">质权（转移占有 / 交付）</text>
  <text x="339" y="334" font-size="11.5" fill="#78350f">动产质权：交付时设立</text>
  <text x="339" y="354" font-size="11.5" fill="#78350f">权利质权：有凭证交付、</text>
  <text x="351" y="372" font-size="11.5" fill="#78350f">无凭证（股权 / 应收账款）登记</text>
  <text x="339" y="396" font-size="11" fill="#92400e">流质条款无效（只能就价款优先受偿）</text>

  <rect x="620" y="288" width="250" height="122" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="745" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">留置权（法定担保物权）</text>
  <text x="634" y="334" font-size="11.5" fill="#7f1d1d">要件：合法占有债务人动产、</text>
  <text x="646" y="352" font-size="11.5" fill="#7f1d1d">同一法律关系（企业间除外）、</text>
  <text x="646" y="370" font-size="11.5" fill="#7f1d1d">债权已届清偿期</text>
  <text x="634" y="396" font-size="11" fill="#991b1b">宽限期 ≥ 60 日（鲜活易腐除外）</text>
</svg>
