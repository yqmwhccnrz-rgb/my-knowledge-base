<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <!-- 标题 -->
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">回溯法 · 解空间树（剪枝搜索）</text>

  <!-- 分隔 -->
  <line x1="340" y1="48" x2="340" y2="370" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 左：子集树 -->
  <text x="170" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#3451b2">子集树（0-1 背包 / 子集和）</text>
  <text x="170" y="80" text-anchor="middle" font-size="12" fill="#6b7280">每层 2 叉 · 共 2ⁿ 片叶子</text>
  <g stroke="#9ca3af" stroke-width="1.4">
    <line x1="170" y1="100" x2="115" y2="150"/>
    <line x1="170" y1="100" x2="225" y2="150"/>
    <line x1="115" y1="150" x2="80" y2="200"/>
    <line x1="115" y1="150" x2="150" y2="200"/>
    <line x1="225" y1="150" x2="190" y2="200"/>
    <line x1="225" y1="150" x2="260" y2="200"/>
  </g>
  <g fill="#3451b2" stroke="#ffffff" stroke-width="2">
    <circle cx="170" cy="100" r="13"/>
    <circle cx="115" cy="150" r="13"/>
    <circle cx="225" cy="150" r="13"/>
    <circle cx="80" cy="200" r="11"/>
    <circle cx="150" cy="200" r="11"/>
    <circle cx="190" cy="200" r="11"/>
    <circle cx="260" cy="200" r="11"/>
  </g>
  <g fill="#ffffff" font-size="10" text-anchor="middle">
    <text x="170" y="104">∅</text>
    <text x="115" y="154">选₁</text>
    <text x="225" y="154">舍₁</text>
    <text x="80" y="204">选₂</text>
    <text x="150" y="204">舍₂</text>
    <text x="190" y="204">选₂</text>
    <text x="260" y="204">舍₂</text>
  </g>

  <!-- 右：排列树 -->
  <text x="510" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">排列树（N 皇后 / TSP / 全排列）</text>
  <text x="510" y="80" text-anchor="middle" font-size="12" fill="#6b7280">分支递减 · 共 n! 片叶子</text>
  <g stroke="#9ca3af" stroke-width="1.4">
    <line x1="510" y1="100" x2="430" y2="150"/>
    <line x1="510" y1="100" x2="510" y2="150"/>
    <line x1="510" y1="100" x2="590" y2="150"/>
    <line x1="430" y1="150" x2="395" y2="200"/>
    <line x1="430" y1="150" x2="465" y2="200"/>
    <line x1="510" y1="150" x2="475" y2="200"/>
    <line x1="510" y1="150" x2="545" y2="200"/>
    <line x1="590" y1="150" x2="555" y2="200"/>
    <line x1="590" y1="150" x2="625" y2="200"/>
  </g>
  <g fill="#0f766e" stroke="#ffffff" stroke-width="2">
    <circle cx="510" cy="100" r="13"/>
    <circle cx="430" cy="150" r="13"/>
    <circle cx="510" cy="150" r="13"/>
    <circle cx="590" cy="150" r="13"/>
    <circle cx="395" cy="200" r="11"/>
    <circle cx="465" cy="200" r="11"/>
    <circle cx="475" cy="200" r="11"/>
    <circle cx="545" cy="200" r="11"/>
    <circle cx="555" cy="200" r="11"/>
    <circle cx="625" cy="200" r="11"/>
  </g>
  <g fill="#ffffff" font-size="10" text-anchor="middle">
    <text x="510" y="104">∅</text>
    <text x="430" y="154">1</text>
    <text x="510" y="154">2</text>
    <text x="590" y="154">3</text>
    <text x="395" y="204">12</text>
    <text x="465" y="204">13</text>
    <text x="475" y="204">21</text>
    <text x="545" y="204">23</text>
    <text x="555" y="204">31</text>
    <text x="625" y="204">32</text>
  </g>

  <!-- 底部说明 -->
  <rect x="40" y="330" width="600" height="46" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="60" y="352" font-size="12.5" fill="#374151">回溯 = 深度优先遍历解空间树 ＋ <tspan fill="#b91c1c" font-weight="700">约束函数</tspan>（去非法）＋ <tspan fill="#b91c1c" font-weight="700">限界函数</tspan>（去劣枝）</text>
  <text x="60" y="370" font-size="12.5" fill="#6b7280">子集树：每个元素"选/舍"二元决策；排列树：逐位从剩余元素中选取，二者均靠剪枝避免穷举爆炸。</text>
</svg>
