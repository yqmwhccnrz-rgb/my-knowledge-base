<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="470" fill="#fafaf9"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">二叉树与三种遍历</text>
  <text x="340" y="56" text-anchor="middle" font-size="13" fill="#6b7280">示例树（节点编号；6 为 3 的右孩子）</text>

  <!-- edges -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="340" y1="100" x2="200" y2="210"/>
    <line x1="340" y1="100" x2="480" y2="210"/>
    <line x1="200" y1="210" x2="140" y2="320"/>
    <line x1="200" y1="210" x2="260" y2="320"/>
    <line x1="480" y1="210" x2="540" y2="320"/>
  </g>

  <!-- nodes -->
  <g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="340" cy="100" r="24" fill="#3b82f6"/><text x="340" y="107">1</text>
    <circle cx="200" cy="210" r="24" fill="#3b82f6"/><text x="200" y="217">2</text>
    <circle cx="480" cy="210" r="24" fill="#3b82f6"/><text x="480" y="217">3</text>
    <circle cx="140" cy="320" r="24" fill="#10b981"/><text x="140" y="327">4</text>
    <circle cx="260" cy="320" r="24" fill="#10b981"/><text x="260" y="327">5</text>
    <circle cx="540" cy="320" r="24" fill="#10b981"/><text x="540" y="327">6</text>
  </g>

  <!-- traversal results -->
  <g font-size="14" fill="#374151">
    <rect x="40" y="370" width="600" height="78" rx="8" fill="#f3f4f6"/>
    <text x="56" y="396" font-weight="700" fill="#1f2937">先序（根左右）：</text>
    <text x="200" y="396" fill="#2563eb">1 → 2 → 4 → 5 → 3 → 6</text>
    <text x="56" y="420" font-weight="700" fill="#1f2937">中序（左根右）：</text>
    <text x="200" y="420" fill="#2563eb">4 → 2 → 5 → 1 → 3 → 6</text>
    <text x="56" y="444" font-weight="700" fill="#1f2937">后序（左右根）：</text>
    <text x="200" y="444" fill="#2563eb">4 → 5 → 2 → 6 → 3 → 1</text>
  </g>
  <text x="340" y="465" text-anchor="middle" font-size="12" fill="#6b7280">注：仅"中序＋先序"或"中序＋后序"可唯一确定二叉树；"先序＋后序"不能</text>
</svg>
