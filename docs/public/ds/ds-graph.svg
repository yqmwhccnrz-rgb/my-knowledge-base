<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="440" fill="#fafaf9"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">图的两种存储：邻接矩阵 vs 邻接表</text>

  <!-- graph -->
  <text x="120" y="58" text-anchor="middle" font-size="13" fill="#6b7280">无向图 G（5 顶点 6 边）</text>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="70" y1="90" x2="40" y2="200"/>
    <line x1="70" y1="90" x2="170" y2="200"/>
    <line x1="40" y1="200" x2="80" y2="330"/>
    <line x1="170" y1="200" x2="80" y2="330"/>
    <line x1="170" y1="200" x2="200" y2="330"/>
    <line x1="80" y1="330" x2="200" y2="330"/>
  </g>
  <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="70" cy="90" r="20" fill="#3b82f6"/><text x="70" y="96">1</text>
    <circle cx="40" cy="200" r="20" fill="#3b82f6"/><text x="40" y="206">2</text>
    <circle cx="170" cy="200" r="20" fill="#3b82f6"/><text x="170" y="206">3</text>
    <circle cx="80" cy="330" r="20" fill="#3b82f6"/><text x="80" y="336">4</text>
    <circle cx="200" cy="330" r="20" fill="#3b82f6"/><text x="200" y="336">5</text>
  </g>

  <!-- adjacency matrix -->
  <text x="350" y="58" text-anchor="middle" font-size="13" fill="#6b7280">邻接矩阵（对称，O(V²)）</text>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <!-- header -->
    <text x="312" y="92"> </text>
    <text x="346" y="92">1</text><text x="378" y="92">2</text><text x="410" y="92">3</text><text x="442" y="92">4</text><text x="474" y="92">5</text>
    <!-- rows -->
    <text x="312" y="124" text-anchor="middle" font-weight="700">1</text>
    <text x="312" y="158" text-anchor="middle" font-weight="700">2</text>
    <text x="312" y="192" text-anchor="middle" font-weight="700">3</text>
    <text x="312" y="226" text-anchor="middle" font-weight="700">4</text>
    <text x="312" y="260" text-anchor="middle" font-weight="700">5</text>
    <!-- cells row1 -->
    <rect x="330" y="104" width="32" height="28" fill="#f3f4f6"/><text x="346" y="124">0</text>
    <rect x="362" y="104" width="32" height="28" fill="#dbeafe"/><text x="378" y="124" font-weight="700" fill="#2563eb">1</text>
    <rect x="394" y="104" width="32" height="28" fill="#dbeafe"/><text x="410" y="124" font-weight="700" fill="#2563eb">1</text>
    <rect x="426" y="104" width="32" height="28" fill="#f3f4f6"/><text x="442" y="124">0</text>
    <rect x="458" y="104" width="32" height="28" fill="#f3f4f6"/><text x="474" y="124">0</text>
    <!-- row2 -->
    <rect x="330" y="138" width="32" height="28" fill="#dbeafe"/><text x="346" y="158" font-weight="700" fill="#2563eb">1</text>
    <rect x="362" y="138" width="32" height="28" fill="#f3f4f6"/><text x="378" y="158">0</text>
    <rect x="394" y="138" width="32" height="28" fill="#f3f4f6"/><text x="410" y="158">0</text>
    <rect x="426" y="138" width="32" height="28" fill="#dbeafe"/><text x="442" y="158" font-weight="700" fill="#2563eb">1</text>
    <rect x="458" y="138" width="32" height="28" fill="#f3f4f6"/><text x="474" y="158">0</text>
    <!-- row3 -->
    <rect x="330" y="172" width="32" height="28" fill="#dbeafe"/><text x="346" y="192" font-weight="700" fill="#2563eb">1</text>
    <rect x="362" y="172" width="32" height="28" fill="#f3f4f6"/><text x="378" y="192">0</text>
    <rect x="394" y="172" width="32" height="28" fill="#f3f4f6"/><text x="410" y="192">0</text>
    <rect x="426" y="172" width="32" height="28" fill="#dbeafe"/><text x="442" y="192" font-weight="700" fill="#2563eb">1</text>
    <rect x="458" y="172" width="32" height="28" fill="#dbeafe"/><text x="474" y="192" font-weight="700" fill="#2563eb">1</text>
    <!-- row4 -->
    <rect x="330" y="206" width="32" height="28" fill="#f3f4f6"/><text x="346" y="226">0</text>
    <rect x="362" y="206" width="32" height="28" fill="#dbeafe"/><text x="378" y="226" font-weight="700" fill="#2563eb">1</text>
    <rect x="394" y="206" width="32" height="28" fill="#dbeafe"/><text x="410" y="226" font-weight="700" fill="#2563eb">1</text>
    <rect x="426" y="206" width="32" height="28" fill="#f3f4f6"/><text x="442" y="226">0</text>
    <rect x="458" y="206" width="32" height="28" fill="#dbeafe"/><text x="474" y="226" font-weight="700" fill="#2563eb">1</text>
    <!-- row5 -->
    <rect x="330" y="240" width="32" height="28" fill="#f3f4f6"/><text x="346" y="260">0</text>
    <rect x="362" y="240" width="32" height="28" fill="#f3f4f6"/><text x="378" y="260">0</text>
    <rect x="394" y="240" width="32" height="28" fill="#dbeafe"/><text x="410" y="260" font-weight="700" fill="#2563eb">1</text>
    <rect x="426" y="240" width="32" height="28" fill="#dbeafe"/><text x="442" y="260" font-weight="700" fill="#2563eb">1</text>
    <rect x="458" y="240" width="32" height="28" fill="#f3f4f6"/><text x="474" y="260">0</text>
  </g>

  <!-- adjacency list -->
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">邻接表（O(V+E)）</text>
  <g font-size="13" fill="#374151">
    <text x="540" y="92" font-weight="700">1:</text><text x="565" y="92" fill="#2563eb">2 → 3</text>
    <text x="540" y="120" font-weight="700">2:</text><text x="565" y="120" fill="#2563eb">1 → 4</text>
    <text x="540" y="148" font-weight="700">3:</text><text x="565" y="148" fill="#2563eb">1 → 4 → 5</text>
    <text x="540" y="176" font-weight="700">4:</text><text x="565" y="176" fill="#2563eb">2 → 3 → 5</text>
    <text x="540" y="204" font-weight="700">5:</text><text x="565" y="204" fill="#2563eb">3 → 4</text>
  </g>

  <text x="340" y="420" text-anchor="middle" font-size="12" fill="#6b7280">稠密图用邻接矩阵（查边 O(1)）；稀疏图用邻接表（省空间）</text>
</svg>
