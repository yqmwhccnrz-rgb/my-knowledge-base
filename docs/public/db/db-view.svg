<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">视图：虚表、逻辑独立性与可更新限制</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 视图只存定义，不存数据</text>
  <rect x="30" y="62" width="180" height="60" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="120" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">用户 / 应用</text>
  <text x="120" y="104" text-anchor="middle" font-size="9" fill="#1e40af">SELECT * FROM v_CS</text>
  <rect x="250" y="62" width="180" height="60" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="340" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">视图 v_CS（外模式）</text>
  <text x="340" y="104" text-anchor="middle" font-size="9" fill="#78350f">数据字典中仅存 SELECT 定义</text>
  <rect x="470" y="62" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="84" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">基本表 Student</text>
  <text x="560" y="104" text-anchor="middle" font-size="9" fill="#15803d">真正存放数据</text>
  <text x="222" y="97" font-size="14" fill="#475569">→</text>
  <text x="442" y="97" font-size="14" fill="#475569">→</text>

  <rect x="30" y="134" width="620" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="153" font-size="9.5" fill="#475569">CREATE VIEW v_CS AS SELECT Sno,Sname,Sage FROM Student WHERE Sdept='CS' WITH CHECK OPTION;</text>
  <text x="42" y="173" font-size="9.5" fill="#475569">查询视图时由 DBMS 「消解」为底层 SELECT；基本表结构变化时改视图定义即可，应用程序不必改 → 逻辑独立性。</text>

  <text x="30" y="210" font-size="12" font-weight="700" fill="#334155">② 四大用途</text>
  <rect x="30" y="220" width="150" height="56" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="105" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#075985">简化查询</text>
  <text x="105" y="260" text-anchor="middle" font-size="9" fill="#0c4a6e">封装多表连接/子查询</text>
  <rect x="186" y="220" width="150" height="56" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="261" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">逻辑独立性</text>
  <text x="261" y="260" text-anchor="middle" font-size="9" fill="#1e40af">屏蔽模式变化</text>
  <rect x="342" y="220" width="150" height="56" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="417" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">安全</text>
  <text x="417" y="260" text-anchor="middle" font-size="9" fill="#15803d">只暴露允许的行/列</text>
  <rect x="498" y="220" width="152" height="56" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="574" y="241" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">定制视角</text>
  <text x="574" y="260" text-anchor="middle" font-size="9" fill="#4c1d95">不同用户不同数据子集</text>

  <text x="30" y="300" font-size="12" font-weight="700" fill="#334155">③ 可更新视图的限制</text>
  <rect x="30" y="310" width="620" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="42" y="329" font-size="9.5" fill="#7f1d1d">含 DISTINCT / GROUP BY / HAVING / UNION / 聚合函数 / 子查询 / 多表连接（多数情形）/ 常量列的视图通常不可更新</text>
  <text x="42" y="347" font-size="9.5" fill="#7f1d1d">WITH CHECK OPTION 会拒绝「更新后行不再满足视图条件」的修改（如把 CS 改成 MA）。</text>

  <rect x="30" y="364" width="620" height="28" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="383" font-size="9.5" fill="#78350f">视图是虚表、索引是实结构；MySQL 不原生支持物化视图，也不能对普通视图建索引。</text>
</svg>
