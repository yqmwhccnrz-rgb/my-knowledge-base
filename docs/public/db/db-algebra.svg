<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">关系代数：八种运算与 SQL 对照</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 四类集合运算（要求两关系相容：属性数相同、对应域相同）</text>
  <rect x="30" y="62" width="150" height="76" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="105" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">并 R ∪ S</text>
  <text x="105" y="103" text-anchor="middle" font-size="9" fill="#1e40af">属于 R 或 S（去重）</text>
  <text x="105" y="123" text-anchor="middle" font-size="9" fill="#64748b">SQL: UNION</text>
  <rect x="186" y="62" width="150" height="76" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="261" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">差 R − S</text>
  <text x="261" y="103" text-anchor="middle" font-size="9" fill="#15803d">属于 R 不属于 S</text>
  <text x="261" y="123" text-anchor="middle" font-size="9" fill="#64748b">SQL: EXCEPT / NOT EXISTS</text>
  <rect x="342" y="62" width="150" height="76" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="417" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">交 R ∩ S</text>
  <text x="417" y="103" text-anchor="middle" font-size="9" fill="#78350f">R − (R − S)</text>
  <text x="417" y="123" text-anchor="middle" font-size="9" fill="#64748b">SQL: INTERSECT / JOIN</text>
  <rect x="498" y="62" width="152" height="76" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="574" y="83" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">笛卡尔积 R × S</text>
  <text x="574" y="103" text-anchor="middle" font-size="9" fill="#4c1d95">行数 |R|×|S|，列数相加</text>
  <text x="574" y="123" text-anchor="middle" font-size="9" fill="#64748b">SQL: CROSS JOIN</text>

  <text x="30" y="162" font-size="12" font-weight="700" fill="#334155">② 四类专门的关系运算</text>
  <rect x="30" y="172" width="150" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="105" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">选择 σ_F(R)</text>
  <text x="105" y="213" text-anchor="middle" font-size="9" fill="#0c4a6e">按条件选「行」（水平）</text>
  <text x="105" y="233" text-anchor="middle" font-size="9" fill="#64748b">WHERE F</text>
  <rect x="186" y="172" width="150" height="80" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="261" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">投影 π_A(R)</text>
  <text x="261" y="213" text-anchor="middle" font-size="9" fill="#0c4a6e">选「列」并去重（垂直）</text>
  <text x="261" y="233" text-anchor="middle" font-size="9" fill="#64748b">SELECT DISTINCT A</text>
  <rect x="342" y="172" width="150" height="80" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="417" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">连接 R ⋈ S</text>
  <text x="417" y="213" text-anchor="middle" font-size="9" fill="#9a3412">σ_条件(R×S)；自然连接去重列</text>
  <text x="417" y="233" text-anchor="middle" font-size="9" fill="#64748b">JOIN … ON / NATURAL JOIN</text>
  <rect x="498" y="172" width="152" height="80" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="574" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">除 R ÷ S</text>
  <text x="574" y="213" text-anchor="middle" font-size="9" fill="#7f1d1d">表达「全部 / 所有」</text>
  <text x="574" y="233" text-anchor="middle" font-size="9" fill="#64748b">NOT EXISTS ×2 / HAVING COUNT</text>

  <text x="30" y="276" font-size="12" font-weight="700" fill="#334155">③ 三条典型表达式（教学库）</text>
  <rect x="30" y="286" width="620" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="306" font-size="9.5" fill="#475569">CS 系学生姓名：π_Sname(σ_Sdept='CS'(Student))</text>
  <text x="42" y="325" font-size="9.5" fill="#475569">选修全部课程的学生：π_Sno,Cno(SC) ÷ π_Cno(Course)　｜　未选课学生：π_Sname(Student) − π_Sname(Student ⋈ SC)</text>

  <rect x="30" y="354" width="620" height="38" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="378" font-size="9.5" fill="#78350f">自然连接自动按同名属性等值并去掉重复列；若无同名属性则退化为笛卡尔积。外连接保留悬浮元组（补 NULL）。</text>
</svg>
