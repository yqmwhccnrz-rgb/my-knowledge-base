<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">关系模型：码、六条性质与三类完整性</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 关系示例 Student（关系模式 vs 关系实例）</text>
  <rect x="30" y="62" width="330" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="82" font-size="9.5" fill="#475569">关系模式：Student(Sno, Sname, Ssex, Sage, Sdept)</text>
  <rect x="42" y="92" width="306" height="22" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="107" font-size="9" fill="#1e3a8a">Sno（主码）</text><text x="150" y="107" font-size="9" fill="#1e3a8a">Sname</text>
  <text x="230" y="107" font-size="9" fill="#1e3a8a">Sage</text><text x="290" y="107" font-size="9" fill="#1e3a8a">Sdept</text>
  <text x="56" y="130" font-size="9" fill="#334155">2021001</text><text x="150" y="130" font-size="9" fill="#334155">李勇</text>
  <text x="230" y="130" font-size="9" fill="#334155">20</text><text x="290" y="130" font-size="9" fill="#334155">CS</text>
  <text x="56" y="149" font-size="9" fill="#334155">2021002</text><text x="150" y="149" font-size="9" fill="#334155">刘晨</text>
  <text x="230" y="149" font-size="9" fill="#334155">19</text><text x="290" y="149" font-size="9" fill="#334155">CS</text>
  <text x="56" y="168" font-size="9" fill="#334155">2021003</text><text x="150" y="168" font-size="9" fill="#334155">王敏</text>
  <text x="230" y="168" font-size="9" fill="#334155">18</text><text x="290" y="168" font-size="9" fill="#334155">MA</text>
  <text x="42" y="191" font-size="9" fill="#64748b">元组 = 一行；属性 = 一列；域 = 取值范围；分量须原子</text>

  <rect x="376" y="62" width="274" height="140" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="388" y="82" font-size="10.5" font-weight="700" fill="#5b21b6">关系的六条性质</text>
  <text x="388" y="102" font-size="9" fill="#4c1d95">① 列同质（同一域）　② 不同列须不同名</text>
  <text x="388" y="121" font-size="9" fill="#4c1d95">③ 列次序可换　④ 行次序可换</text>
  <text x="388" y="140" font-size="9" font-weight="700" fill="#4c1d95">⑤ 任意两元组不能完全相同</text>
  <text x="388" y="159" font-size="9" font-weight="700" fill="#4c1d95">⑥ 每个分量不可再分（即 1NF）</text>
  <text x="388" y="183" font-size="9" fill="#64748b">「允许重复行的表」严格说不是关系</text>

  <text x="30" y="226" font-size="12" font-weight="700" fill="#334155">② 码的层次</text>
  <rect x="30" y="236" width="146" height="52" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="103" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">超码 Superkey</text>
  <text x="103" y="274" text-anchor="middle" font-size="9" fill="#1e40af">能唯一标识，可能含多余属性</text>
  <rect x="186" y="236" width="146" height="52" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="259" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">候选码</text>
  <text x="259" y="274" text-anchor="middle" font-size="9" fill="#15803d">最小超码，可有多个</text>
  <rect x="342" y="236" width="146" height="52" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="415" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">主码 PK</text>
  <text x="415" y="274" text-anchor="middle" font-size="9" fill="#78350f">从候选码中选定一个</text>
  <rect x="498" y="236" width="152" height="52" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="574" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">外码 FK</text>
  <text x="574" y="274" text-anchor="middle" font-size="9" fill="#7f1d1d">引用另一关系的主码</text>

  <text x="30" y="312" font-size="12" font-weight="700" fill="#334155">③ 三类完整性约束</text>
  <rect x="30" y="322" width="620" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="342" font-size="9.5" fill="#475569">实体完整性：主码属性非空且唯一（PRIMARY KEY）　　参照完整性：外码取存在值或 NULL（FOREIGN KEY）</text>
  <text x="42" y="361" font-size="9.5" fill="#475569">用户定义完整性：NOT NULL / UNIQUE / CHECK / DEFAULT / 触发器（课件未单列，须补）</text>
  <text x="42" y="380" font-size="9" fill="#64748b">违约处理：RESTRICT 拒绝 / CASCADE 级联 / SET NULL 置空；外码若为组合主码的一部分则不能为 NULL</text>
</svg>
