<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">B+ 树索引、最左前缀与覆盖索引</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① B+ 树：非叶子只存键值，全部数据在叶子层且叶子有链表</text>
  <rect x="30" y="62" width="380" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="160" y="74" width="120" height="26" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="220" y="92" text-anchor="middle" font-size="9.5" fill="#92400e">根节点 | 20 | 50 |</text>
  <line x1="190" y1="100" x2="100" y2="120" stroke="#94a3b8"/><line x1="220" y1="100" x2="220" y2="120" stroke="#94a3b8"/><line x1="250" y1="100" x2="340" y2="120" stroke="#94a3b8"/>
  <rect x="46" y="122" width="100" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="96" y="139" text-anchor="middle" font-size="9" fill="#1e3a8a">| 10 | 20 |</text>
  <rect x="170" y="122" width="100" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="139" text-anchor="middle" font-size="9" fill="#1e3a8a">| 30 | 50 |</text>
  <rect x="294" y="122" width="100" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="344" y="139" text-anchor="middle" font-size="9" fill="#1e3a8a">| 60 | 80 |</text>
  <rect x="46" y="166" width="100" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="96" y="184" text-anchor="middle" font-size="8.5" fill="#166534">10 15 20 数据</text>
  <rect x="170" y="166" width="100" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="184" text-anchor="middle" font-size="8.5" fill="#166534">25 30 50 数据</text>
  <rect x="294" y="166" width="100" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="344" y="184" text-anchor="middle" font-size="8.5" fill="#166534">55 60 80 数据</text>
  <line x1="146" y1="179" x2="169" y2="179" stroke="#16a34a" stroke-width="2"/>
  <line x1="270" y1="179" x2="293" y2="179" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="205" text-anchor="middle" font-size="9" fill="#64748b">叶子双向链表 → 范围查询/ORDER BY 只需顺序扫描</text>

  <rect x="426" y="62" width="224" height="150" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="438" y="82" font-size="10.5" font-weight="700" fill="#5b21b6">聚簇索引 vs 二级索引</text>
  <text x="438" y="103" font-size="9" fill="#4c1d95">聚簇（主键）：叶子存整行数据</text>
  <text x="438" y="121" font-size="9" fill="#4c1d95">一张表只有一个（MySQL 主键即聚簇）</text>
  <text x="438" y="143" font-size="9" fill="#4c1d95">二级索引：叶子存「主键值」</text>
  <text x="438" y="161" font-size="9" fill="#4c1d95">查非索引列需回表（再查聚簇索引）</text>
  <text x="438" y="183" font-size="9" font-weight="700" fill="#5b21b6">覆盖索引：所需列全在索引中 → 免回表</text>
  <text x="438" y="201" font-size="9" fill="#64748b">EXPLAIN 显示 Using index</text>

  <text x="30" y="236" font-size="12" font-weight="700" fill="#334155">② 联合索引 (Sdept, Sage, Sno) 的最左前缀</text>
  <rect x="30" y="246" width="620" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="266" font-size="9.5" fill="#166534">✔ WHERE Sdept='CS'　　✔ Sdept='CS' AND Sage=19　　✔ Sdept='CS' AND Sage&gt;18（范围列之后不再定位）</text>
  <text x="42" y="285" font-size="9.5" fill="#991b1b">✘ WHERE Sage=19（跳过最左列）　✘ Sdept LIKE '%S'（前置通配）　✘ 对索引列用函数或隐式类型转换</text>
  <text x="42" y="305" font-size="9" fill="#64748b">其它失效：OR 连接非索引列、!= / NOT IN（多数）、优化器判断全表扫描更便宜</text>

  <rect x="30" y="326" width="620" height="62" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="345" font-size="10" font-weight="700" fill="#92400e">索引不是越多越好</text>
  <text x="42" y="364" font-size="9.5" fill="#78350f">每个索引都占磁盘、在 INSERT/UPDATE/DELETE 时维护 B+树、参与优化器代价估算；优先给「高选择性 + 高频 WHERE/JOIN/ORDER BY」列建。</text>
  <text x="42" y="381" font-size="9.5" fill="#78350f">EXPLAIN 关键列：type（ALL = 全表扫描）、key、rows、Extra（Using filesort / Using temporary / Using index）。</text>
</svg>
