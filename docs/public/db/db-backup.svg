<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">备份策略、日志体系与时间点恢复</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 备份的四个维度</text>
  <rect x="30" y="62" width="300" height="106" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="42" y="82" font-size="9.5" fill="#1e40af">内容：逻辑备份（mysqldump，导出 SQL）/ 物理备份（XtraBackup 拷文件）</text>
  <text x="42" y="102" font-size="9.5" fill="#1e40af">范围：完全 / 增量（自上次备份）/ 差异（自上次全量）</text>
  <text x="42" y="122" font-size="9.5" fill="#1e40af">状态：冷备（停机）/ 温备（只读）/ 热备（在线）</text>
  <text x="42" y="142" font-size="9.5" fill="#1e40af">一致性：--single-transaction 借 MVCC 取一致快照且不锁表</text>
  <text x="42" y="161" font-size="9" fill="#64748b">仅限 InnoDB；MyISAM 无法用此参数保证一致性</text>

  <rect x="346" y="62" width="304" height="106" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="358" y="82" font-size="9" fill="#475569">mysqldump -u root -p --single-transaction \</text>
  <text x="358" y="99" font-size="9" fill="#475569">  --routines --triggers --master-data=2 teaching &gt; db.sql</text>
  <text x="358" y="119" font-size="9" fill="#475569">mysql -u root -p teaching &lt; db.sql　　　　# 还原</text>
  <text x="358" y="139" font-size="9" fill="#475569">mysqlbinlog --stop-datetime="…" bin.00000N \</text>
  <text x="358" y="155" font-size="9" fill="#475569">  | mysql -u root -p　　　　　　　　# PITR 重放</text>

  <text x="30" y="192" font-size="12" font-weight="700" fill="#334155">② 三类核心日志的分工</text>
  <rect x="30" y="202" width="196" height="78" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="128" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">binlog</text>
  <text x="40" y="241" font-size="9" fill="#78350f">Server 层 · 逻辑日志</text>
  <text x="40" y="259" font-size="9" fill="#78350f">主从复制 / 时间点恢复</text>
  <text x="40" y="273" font-size="9" fill="#64748b">statement / row / mixed</text>
  <rect x="242" y="202" width="196" height="78" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">redo log</text>
  <text x="252" y="241" font-size="9" fill="#15803d">InnoDB 层 · 物理日志</text>
  <text x="252" y="259" font-size="9" fill="#15803d">崩溃恢复 / WAL 顺序写</text>
  <text x="252" y="273" font-size="9" fill="#64748b">保障持久性 D</text>
  <rect x="454" y="202" width="196" height="78" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="552" y="222" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">undo log</text>
  <text x="464" y="241" font-size="9" fill="#4c1d95">InnoDB 层 · 旧值记录</text>
  <text x="464" y="259" font-size="9" fill="#4c1d95">事务回滚 / MVCC 版本链</text>
  <text x="464" y="273" font-size="9" fill="#64748b">保障原子性 A</text>

  <text x="30" y="304" font-size="12" font-weight="700" fill="#334155">③ 时间点恢复 PITR 五步</text>
  <rect x="30" y="314" width="620" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="333" font-size="9.5" fill="#475569">① 停写防二次破坏 → ② 临时实例还原当日全量 → ③ 按位点/时间戳重放 binlog 并跳过误操作</text>
  <text x="42" y="351" font-size="9.5" fill="#475569">④ 校验一致性后回灌 → ⑤ 复盘（收权限、延迟从库、定期演练恢复）</text>

  <rect x="30" y="368" width="620" height="26" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="42" y="386" font-size="9.5" fill="#991b1b">TRUNCATE/DROP 是 DDL、隐式提交不可用 undo 撤销；主从复制不是备份（误删会同步到从库）。RPO 看 binlog，RTO 看回放速度。</text>
</svg>
