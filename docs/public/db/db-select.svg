<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">SELECT 书写顺序 vs 真正执行顺序</text>

  <defs><marker id="se" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker></defs>

  <rect x="30" y="46" width="620" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="42" y="64" font-size="9.5" font-weight="700" fill="#075985">书写顺序</text>
  <text x="42" y="80" font-size="9.5" fill="#0c4a6e">SELECT [DISTINCT] 列 → FROM/JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT</text>

  <text x="30" y="112" font-size="12" font-weight="700" fill="#334155">实际执行顺序（箭头自上而下）</text>
  <rect x="200" y="122" width="280" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="142" text-anchor="middle" font-size="10" fill="#1e3a8a">① FROM / JOIN　生成中间关系</text>
  <rect x="200" y="158" width="280" height="30" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="178" text-anchor="middle" font-size="10" fill="#1e3a8a">② WHERE　逐行过滤（不能用聚合/别名）</text>
  <rect x="200" y="194" width="280" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="340" y="214" text-anchor="middle" font-size="10" fill="#166534">③ GROUP BY　分组</text>
  <rect x="200" y="230" width="280" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="340" y="250" text-anchor="middle" font-size="10" fill="#166534">④ HAVING　对组过滤（可用聚合）</text>
  <rect x="200" y="266" width="280" height="30" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="340" y="286" text-anchor="middle" font-size="10" fill="#92400e">⑤ SELECT　计算目标列 / DISTINCT</text>
  <rect x="200" y="302" width="280" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="340" y="322" text-anchor="middle" font-size="10" fill="#5b21b6">⑥ ORDER BY（可用别名）　⑦ LIMIT</text>
  <line x1="340" y1="152" x2="340" y2="157" stroke="#2563eb" marker-end="url(#se)"/>
  <line x1="340" y1="188" x2="340" y2="193" stroke="#2563eb" marker-end="url(#se)"/>
  <line x1="340" y1="224" x2="340" y2="229" stroke="#2563eb" marker-end="url(#se)"/>
  <line x1="340" y1="260" x2="340" y2="265" stroke="#2563eb" marker-end="url(#se)"/>
  <line x1="340" y1="296" x2="340" y2="301" stroke="#2563eb" marker-end="url(#se)"/>

  <rect x="30" y="122" width="156" height="106" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="142" font-size="10" font-weight="700" fill="#92400e">例题（教学库）</text>
  <text x="42" y="161" font-size="8.5" fill="#78350f">SELECT Sdept, COUNT(*)</text>
  <text x="42" y="176" font-size="8.5" fill="#78350f">FROM Student</text>
  <text x="42" y="191" font-size="8.5" fill="#78350f">GROUP BY Sdept</text>
  <text x="42" y="206" font-size="8.5" fill="#78350f">HAVING COUNT(*)>=2;</text>
  <text x="42" y="222" font-size="9" font-weight="700" fill="#92400e">→ CS | 2 | 19.5</text>

  <rect x="496" y="122" width="154" height="106" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="508" y="142" font-size="10" font-weight="700" fill="#991b1b">NULL 三值逻辑</text>
  <text x="508" y="161" font-size="8.5" fill="#7f1d1d">NULL = NULL → UNKNOWN</text>
  <text x="508" y="177" font-size="8.5" fill="#7f1d1d">判空用 IS NULL</text>
  <text x="508" y="193" font-size="8.5" fill="#7f1d1d">NOT IN 含 NULL → 空集</text>
  <text x="508" y="210" font-size="8.5" fill="#7f1d1d">COUNT(*) 7 / COUNT(列) 6</text>
  <text x="508" y="224" font-size="8.5" fill="#7f1d1d">AVG/SUM 忽略 NULL</text>

  <rect x="30" y="342" width="620" height="48" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="361" font-size="9.5" fill="#475569">WHERE 不能用聚合函数与 SELECT 别名；GROUP BY 后 SELECT 只能出现分组列或聚合表达式（严格模式）。</text>
  <text x="42" y="380" font-size="9.5" fill="#475569">LIMIT 必须配合 ORDER BY 才有确定的「前 N 名」；MySQL 升序时 NULL 排最前。</text>
</svg>
