<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">数据库系统组成与三级模式两级映像</text>

  <defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker></defs>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① DBS 的组成（数据库系统 ≠ 数据库）</text>
  <rect x="30" y="62" width="620" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="42" y="76" width="106" height="38" rx="5" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="100" text-anchor="middle" font-size="10" fill="#075985">用户 / 应用</text>
  <rect x="160" y="76" width="106" height="38" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="213" y="100" text-anchor="middle" font-size="10" fill="#1e3a8a">DBMS</text>
  <rect x="278" y="76" width="106" height="38" rx="5" fill="#dcfce7" stroke="#16a34a"/><text x="331" y="100" text-anchor="middle" font-size="10" fill="#166534">数据库 DB</text>
  <rect x="396" y="76" width="106" height="38" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="449" y="100" text-anchor="middle" font-size="10" fill="#92400e">DBA</text>
  <rect x="514" y="76" width="124" height="38" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="576" y="100" text-anchor="middle" font-size="10" fill="#5b21b6">硬件 / OS</text>

  <text x="30" y="154" font-size="12" font-weight="700" fill="#334155">② 三级模式与两级映像</text>
  <rect x="60" y="166" width="150" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="135" y="191" text-anchor="middle" font-size="10.5" fill="#075985">外模式 A（视图）</text>
  <rect x="265" y="166" width="150" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="340" y="191" text-anchor="middle" font-size="10.5" fill="#075985">外模式 B</text>
  <rect x="470" y="166" width="150" height="40" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="545" y="191" text-anchor="middle" font-size="10.5" fill="#075985">外模式 C …（多个）</text>
  <rect x="175" y="236" width="330" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="340" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">模式 / 概念模式（唯一：全体数据逻辑结构）</text>
  <rect x="175" y="306" width="330" height="40" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="340" y="331" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">内模式 / 存储模式（唯一：物理存储结构）</text>
  <line x1="135" y1="206" x2="260" y2="235" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="340" y1="206" x2="340" y2="235" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="545" y1="206" x2="420" y2="235" stroke="#2563eb" marker-end="url(#ar1)"/>
  <line x1="340" y1="276" x2="340" y2="305" stroke="#2563eb" marker-end="url(#ar1)"/>

  <rect x="30" y="220" width="128" height="52" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="94" y="240" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">外模式/模式映像</text>
  <text x="94" y="258" text-anchor="middle" font-size="9" fill="#78350f">→ 逻辑独立性</text>
  <rect x="522" y="288" width="128" height="52" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="586" y="308" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">模式/内模式映像</text>
  <text x="586" y="326" text-anchor="middle" font-size="9" fill="#78350f">→ 物理独立性</text>

  <rect x="30" y="358" width="620" height="34" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="380" font-size="10" fill="#78350f">改模式只需改上层映像、应用程序不必改；改存储结构只需改下层映像、模式不必改。视图正是外模式在 SQL 中的实现。</text>
</svg>
