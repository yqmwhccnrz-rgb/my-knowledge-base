<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">泰勒公式：余项、五个麦克劳林展开与求极限</text>

  <rect x="30" y="42" width="620" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#1e3a8a">① 两种余项，用途不同</text>
  <text x="42" y="82" font-size="9.8" fill="#334155">f(x) = Σₖ₌₀ⁿ f⁽ᵏ⁾(x₀)(x−x₀)ᵏ/k! + Rₙ(x)</text>
  <text x="42" y="101" font-size="9.8" fill="#334155">佩亚诺余项 Rₙ = o((x−x₀)ⁿ)：局部、用于求极限与判极值（只需 n 阶可导）</text>
  <text x="42" y="120" font-size="9.8" fill="#334155">拉格朗日余项 Rₙ = f⁽ⁿ⁺¹⁾(ξ)(x−x₀)ⁿ⁺¹/(n+1)!：整体、用于误差估计与不等式证明</text>

  <rect x="30" y="138" width="306" height="176" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="158" font-size="11" font-weight="700" fill="#166534">② 必背五个展开（x→0）</text>
  <text x="42" y="179" font-size="9.7" fill="#334155">eˣ = 1 + x + x²/2! + … + xⁿ/n! + o(xⁿ)</text>
  <text x="42" y="198" font-size="9.7" fill="#334155">sin x = x − x³/3! + x⁵/5! − …</text>
  <text x="42" y="217" font-size="9.7" fill="#334155">cos x = 1 − x²/2! + x⁴/4! − …</text>
  <text x="42" y="236" font-size="9.7" fill="#334155">ln(1+x) = x − x²/2 + x³/3 − …</text>
  <text x="42" y="255" font-size="9.7" fill="#334155">(1+x)^α = 1 + αx + α(α−1)x²/2! + …</text>
  <text x="42" y="275" font-size="9.7" fill="#334155">arctan x = x − x³/3 + x⁵/5 − …</text>
  <text x="42" y="295" font-size="9.3" fill="#64748b">tan x = x + x³/3 + 2x⁵/15 + …</text>
  <text x="42" y="311" font-size="9.3" fill="#64748b">奇偶性决定只含奇次/偶次项</text>

  <rect x="348" y="138" width="302" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="360" y="158" font-size="11" font-weight="700" fill="#334155">③ 展开到几阶？看分母的阶</text>
  <text x="360" y="179" font-size="9.7" fill="#334155">分子分母比较时，展开到「首次不为零」的阶</text>
  <text x="360" y="199" font-size="9.7" font-weight="700" fill="#b91c1c">例：(eˣ − 1 − x)/x² → 1/2</text>
  <text x="360" y="217" font-size="9.4" fill="#334155">eˣ = 1+x+x²/2+o(x²) ⇒ 分子 = x²/2+o(x²)</text>
  <text x="360" y="238" font-size="9.7" font-weight="700" fill="#b91c1c">例：(tan x − sin x)/x³ → 1/2</text>
  <text x="360" y="256" font-size="9.4" fill="#334155">tan x = x+x³/3，sin x = x−x³/6</text>
  <text x="360" y="273" font-size="9.4" fill="#334155">⇒ 差 = x³/2 ⇒ 极限 1/2 ✓</text>
  <text x="360" y="295" font-size="9.4" fill="#64748b">若直接 sin x ~ x、tan x ~ x 相减得 0，即「主阶抵消」错误</text>

  <rect x="30" y="324" width="620" height="72" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="344" font-size="10.5" font-weight="700" fill="#92400e">④ 三大应用</text>
  <text x="42" y="363" font-size="9.7" fill="#334155">求极限（比洛必达更稳）｜证明不等式与中值命题｜近似计算与误差估计（拉格朗日余项）</text>
  <text x="42" y="382" font-size="9.7" fill="#334155">高阶导数：由展开式系数直接读出 f⁽ⁿ⁾(0) = n!·aₙ；判定极值用「首个非零偶数阶导数」</text>
  <text x="42" y="394" font-size="9.2" fill="#64748b">幂级数视角：泰勒级数收敛到 f 还需余项趋于 0，光有任意阶可导不够</text>
</svg>
