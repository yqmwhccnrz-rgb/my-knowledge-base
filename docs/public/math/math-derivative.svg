<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">导数与微分：定义、几何意义与求导法则</text>

  <rect x="30" y="42" width="306" height="158" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① 切线斜率与差商极限</text>
  <line x1="54" y1="80" x2="54" y2="182" stroke="#475569"/>
  <line x1="54" y1="182" x2="230" y2="182" stroke="#475569"/>
  <path d="M58,176 C100,150 140,96 214,84" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="78" font-size="9.5" fill="#1d4ed8">y=f(x)</text>
  <line x1="74" y1="168" x2="196" y2="98" stroke="#dc2626" stroke-width="1.7"/>
  <text x="186" y="92" font-size="9" fill="#b91c1c">切线</text>
  <circle cx="132" cy="132" r="3.6" fill="#dc2626"/>
  <text x="138" y="128" font-size="9" fill="#991b1b">P(x₀,f(x₀))</text>
  <line x1="58" y1="164" x2="196" y2="164" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="238" y="106" font-size="9.5" fill="#334155">f′(x₀) = lim Δy/Δx</text>
  <text x="238" y="124" font-size="9.5" fill="#334155">= lim [f(x₀+Δx)−f(x₀)]/Δx</text>
  <text x="238" y="145" font-size="9.5" fill="#334155">几何：切线斜率 tan α</text>
  <text x="238" y="164" font-size="9.5" fill="#334155">物理：瞬时速度</text>
  <text x="42" y="196" font-size="9" fill="#64748b">dy = f′(x)dx 是微分；Δy = dy + o(Δx)（以直代曲）</text>

  <rect x="348" y="42" width="302" height="158" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 可导、连续、可微的关系（一元）</text>
  <text x="360" y="84" font-size="10" font-weight="700" fill="#1d4ed8">可导 ⇔ 可微 ⇒ 连续 ⇒ 极限存在</text>
  <text x="360" y="104" font-size="9.7" fill="#334155">反向都不成立：y=|x| 在 0 连续但不可导；</text>
  <text x="360" y="122" font-size="9.7" fill="#334155">y=x^(1/3) 在 0 有竖直切线；</text>
  <text x="360" y="140" font-size="9.7" fill="#334155">狄利克雷函数处处不连续</text>
  <text x="360" y="160" font-size="9.7" font-weight="700" fill="#b91c1c">可导 ⇔ 左导数 = 右导数（且有限）</text>
  <text x="360" y="179" font-size="9.7" fill="#334155">f′(x₀) 存在 ⇒ f 在 x₀ 连续，但 f′ 未必连续</text>
  <text x="360" y="195" font-size="9.2" fill="#64748b">多元情形完全不同：偏导数存在甚至不能保证连续</text>

  <rect x="30" y="210" width="620" height="94" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="230" font-size="11" font-weight="700" fill="#166534">③ 求导法则与特殊函数</text>
  <text x="42" y="250" font-size="9.7" fill="#334155">四则：(u±v)′=u′±v′；(uv)′=u′v+uv′；(u/v)′=(u′v−uv′)/v²</text>
  <text x="42" y="269" font-size="9.7" fill="#334155">链式：y=f(u), u=g(x) ⇒ y′=f′(u)g′(x)　｜　反函数：dx/dy = 1/y′</text>
  <text x="42" y="288" font-size="9.7" fill="#334155">对数求导：y=xˣ ⇒ ln y = x ln x ⇒ y′=xˣ(ln x+1)　｜　隐函数：y′=−Fₓ/Fᵧ　｜　参数：y′=ẏ/ẋ</text>
  <text x="42" y="300" font-size="9.2" fill="#64748b">高阶：莱布尼茨 (uv)⁽ⁿ⁾=Σ C(n,k) u⁽ᵏ⁾v⁽ⁿ⁻ᵏ⁾；(sin x)⁽ⁿ⁾=sin(x+nπ/2)</text>

  <rect x="30" y="314" width="620" height="72" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="334" font-size="10.5" font-weight="700" fill="#92400e">④ 分段函数分界点的求导模板</text>
  <text x="42" y="353" font-size="9.7" fill="#334155">第一步用定义算左右导数 f′₋(x₀)、f′₊(x₀)；第二步比较是否相等；第三步（若求 f′ 连续性）再取极限</text>
  <text x="42" y="372" font-size="9.7" fill="#334155">易错：直接对两侧表达式求导再代入 x₀，只在导函数连续时才等价，一般情形必须用定义</text>
  <text x="42" y="384" font-size="9.2" fill="#64748b">含 |x−a| 因子时，若另一因子在 a 处为 0，则乘积可导（经典结论）</text>
</svg>
