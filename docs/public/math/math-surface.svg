<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">曲面与空间曲线：二次曲面标准方程与截痕法</text>

  <rect x="30" y="42" width="306" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① 常见二次曲面（a,b,c &gt; 0）</text>
  <text x="42" y="83" font-size="9.6" fill="#334155">椭球面　x²/a²+y²/b²+z²/c²=1</text>
  <text x="42" y="102" font-size="9.6" fill="#334155">单叶双曲面　x²/a²+y²/b²−z²/c²=1（一负号）</text>
  <text x="42" y="121" font-size="9.6" fill="#334155">双叶双曲面　x²/a²+y²/b²−z²/c²=−1（两负号）</text>
  <text x="42" y="140" font-size="9.6" fill="#334155">椭圆锥面　x²/a²+y²/b²−z²/c²=0</text>
  <text x="42" y="159" font-size="9.6" fill="#334155">椭圆抛物面　z=x²/a²+y²/b²</text>
  <text x="42" y="178" font-size="9.6" fill="#334155">双曲抛物面（马鞍面）　z=x²/a²−y²/b²</text>
  <text x="42" y="197" font-size="9.6" fill="#334155">柱面　x²/a²+y²/b²=1（缺 z）、抛物柱面 z=x²</text>
  <text x="42" y="216" font-size="9.6" fill="#334155">球面　(x−x₀)²+(y−y₀)²+(z−z₀)²=R²</text>
  <text x="42" y="233" font-size="9.2" fill="#64748b">记忆：负号个数与等号右侧决定「叶数」；缺变量即柱面</text>

  <rect x="348" y="42" width="302" height="196" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 截痕法与旋转曲面</text>
  <text x="360" y="84" font-size="9.7" fill="#334155">用平行于坐标面的平面 z=k、x=k、y=k 去截曲面，</text>
  <text x="360" y="102" font-size="9.7" fill="#334155">看截痕（椭圆/双曲线/抛物线）随 k 的变化，即可拼出形状</text>
  <text x="360" y="123" font-size="9.7" font-weight="700" fill="#1d4ed8">旋转曲面生成规则</text>
  <text x="360" y="141" font-size="9.6" fill="#334155">yOz 面上曲线 f(y,z)=0 绕 z 轴旋转：</text>
  <text x="360" y="159" font-size="9.6" fill="#334155">把 y 换成 ±√(x²+y²)，得 f(±√(x²+y²), z)=0</text>
  <text x="360" y="178" font-size="9.6" fill="#334155">绕 y 轴则把 z 换成 ±√(x²+z²)</text>
  <text x="360" y="198" font-size="9.7" font-weight="700" fill="#1d4ed8">空间曲线</text>
  <text x="360" y="216" font-size="9.6" fill="#334155">一般式 = 两曲面 F=0, G=0 的交线；参数式 x=x(t),y=y(t),z=z(t)</text>
  <text x="360" y="233" font-size="9.2" fill="#64748b">例：圆柱螺线 x=a cos t, y=a sin t, z=bt</text>

  <rect x="30" y="248" width="620" height="70" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="268" font-size="11" font-weight="700" fill="#166534">③ 投影与切向量</text>
  <text x="42" y="288" font-size="9.7" fill="#334155">空间曲线在 xOy 面上的投影：从 F=0、G=0 中消去 z 得 H(x,y)=0，投影曲线为 H(x,y)=0 且 z=0</text>
  <text x="42" y="307" font-size="9.7" fill="#334155">参数曲线 r(t)=(x(t),y(t),z(t)) 的切向量 r′(t)=(x′,y′,z′)；切线 (x−x₀)/x′=(y−y₀)/y′=(z−z₀)/z′</text>

  <rect x="30" y="328" width="620" height="58" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="348" font-size="10.5" font-weight="700" fill="#92400e">④ 与第 9 章的衔接</text>
  <text x="42" y="367" font-size="9.7" fill="#334155">曲面 F(x,y,z)=0 的法向量 = ∇F=(Fₓ,Fᵧ,F_z)；切平面与法线、空间曲线切线与法平面都在第 9 章用偏导数统一处理</text>
  <text x="42" y="383" font-size="9.2" fill="#64748b">曲面的面积分、投影法（第 11 章）也需要这里的投影与法向量知识</text>
</svg>
