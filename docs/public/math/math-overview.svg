<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">高等数学知识体系：一元微积分 → 空间与多元 → 级数</text>
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker></defs>

  <text x="30" y="50" font-size="12" font-weight="700" fill="#334155">① 12 章的逻辑顺序（不分上下册，按知识依赖排列）</text>
  <rect x="30" y="60" width="620" height="120" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="42" y="72" width="140" height="44" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="112" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">1–3 一元微分学</text>
  <text x="112" y="107" text-anchor="middle" font-size="8.8" fill="#334155">函数极限连续 / 导数 / 中值定理</text>
  <rect x="194" y="72" width="140" height="44" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="264" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">4–6 一元积分学</text>
  <text x="264" y="107" text-anchor="middle" font-size="8.8" fill="#334155">不定 / 定积分 / 反常积分 / 应用</text>
  <rect x="346" y="72" width="140" height="44" rx="5" fill="#fef3c7" stroke="#d97706"/>
  <text x="416" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">7–8 方程与空间</text>
  <text x="416" y="107" text-anchor="middle" font-size="8.8" fill="#334155">微分方程 / 向量与空间解析几何</text>
  <rect x="498" y="72" width="140" height="44" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="568" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">9–11 多元微积分</text>
  <text x="568" y="107" text-anchor="middle" font-size="8.8" fill="#334155">多元微分 / 重积分 / 曲线曲面积分</text>
  <line x1="182" y1="94" x2="192" y2="94" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="334" y1="94" x2="344" y2="94" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="486" y1="94" x2="496" y2="94" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="42" y="126" width="596" height="44" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="340" y="144" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">12 无穷级数：常数项级数 → 幂级数 → 傅里叶级数（以微积分为工具，故置于最后）</text>
  <text x="340" y="162" text-anchor="middle" font-size="9" fill="#334155">微积分基本定理是全书主轴：微分与积分互逆；多元与级数是「一元结论在高维/无限维的推广」</text>

  <text x="30" y="200" font-size="12" font-weight="700" fill="#334155">② 两条贯穿全书的主线</text>
  <rect x="30" y="210" width="300" height="94" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="230" font-size="10.5" font-weight="700" fill="#166534">极限思想：从「近似」到「精确」</text>
  <text x="42" y="249" font-size="9.6" fill="#334155">导数 = 差商极限；定积分 = 黎曼和极限；</text>
  <text x="42" y="266" font-size="9.6" fill="#334155">重积分 / 线面积分 = 微元法极限；</text>
  <text x="42" y="283" font-size="9.6" fill="#334155">级数 = 部分和序列的极限</text>
  <text x="42" y="299" font-size="9" fill="#64748b">所有「无限」都靠极限严格化</text>
  <rect x="342" y="210" width="308" height="94" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="354" y="230" font-size="10.5" font-weight="700" fill="#92400e">互逆与推广：牛顿–莱布尼茨 → 三大公式</text>
  <text x="354" y="249" font-size="9.6" fill="#334155">∫ₐᵇ f dx = F(b) − F(a)（一维）</text>
  <text x="354" y="266" font-size="9.6" fill="#334155">格林 / 高斯 / 斯托克斯 = 高维的</text>
  <text x="354" y="283" font-size="9.6" fill="#334155">「边界上的积分 = 内部导数积分」</text>
  <text x="354" y="299" font-size="9" fill="#64748b">统一形式：广义斯托克斯定理</text>

  <rect x="30" y="314" width="620" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="334" font-size="11" font-weight="700" fill="#334155">③ 解题的三层能力</text>
  <text x="42" y="353" font-size="9.7" fill="#334155">① 概念层：定义、定理的条件与结论（可导必连续、连续未必可导；收敛必要条件是通项趋于 0）</text>
  <text x="42" y="371" font-size="9.7" fill="#334155">② 计算层：极限 / 导数 / 积分 / 级数 / 方程的标准化流程，能写出每一步并验算</text>
  <text x="42" y="389" font-size="9.7" fill="#334155">③ 方法层：换元与分部、微元法、对称性、换序、变量代换、构造辅助函数（证明题）</text>
</svg>
