<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">OLS 最小二乘原理与平方和分解</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 散点、拟合线与残差（例题 X=[1..5], Y=[2,4,5,7,9]）</text>
  <rect x="30" y="62" width="340" height="230" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="66" y1="268" x2="346" y2="268" stroke="#94a3b8"/>
  <line x1="66" y1="268" x2="66" y2="78" stroke="#94a3b8"/>
  <text x="352" y="272" font-size="9" fill="#64748b">X</text>
  <text x="52" y="76" font-size="9" fill="#64748b">Y</text>
  <line x1="66" y1="268" x2="346" y2="98" stroke="#2563eb" stroke-width="2"/>
  <text x="262" y="112" font-size="9.5" fill="#1e3a8a">Ŷ = 0.3 + 1.7X</text>
  <circle cx="122" cy="230" r="4" fill="#dc2626"/><line x1="122" y1="230" x2="122" y2="230" stroke="#dc2626"/>
  <circle cx="178" cy="192" r="4" fill="#dc2626"/><line x1="178" y1="205" x2="178" y2="192" stroke="#dc2626" stroke-dasharray="3 2"/>
  <circle cx="234" cy="154" r="4" fill="#dc2626"/><line x1="234" y1="141" x2="234" y2="154" stroke="#dc2626" stroke-dasharray="3 2"/>
  <circle cx="290" cy="116" r="4" fill="#dc2626"/><line x1="290" y1="109" x2="290" y2="116" stroke="#dc2626" stroke-dasharray="3 2"/>
  <circle cx="346" cy="78" r="4" fill="#dc2626"/><line x1="346" y1="82" x2="346" y2="78" stroke="#dc2626" stroke-dasharray="3 2"/>
  <text x="196" y="240" font-size="9" fill="#991b1b">竖虚线 = 残差 e（纵向距离最小）</text>
  <text x="84" y="286" font-size="9" fill="#64748b">1</text><text x="140" y="286" font-size="9" fill="#64748b">2</text>
  <text x="196" y="286" font-size="9" fill="#64748b">3</text><text x="252" y="286" font-size="9" fill="#64748b">4</text>
  <text x="308" y="286" font-size="9" fill="#64748b">5</text>

  <rect x="386" y="62" width="264" height="230" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="398" y="82" font-size="11" font-weight="700" fill="#1e3a8a">推导与结果</text>
  <text x="398" y="104" font-size="9.5" fill="#1e40af">最小化 Σe² = Σ(Y − β̂₀ − β̂₁X)²</text>
  <text x="398" y="123" font-size="9.5" fill="#1e40af">正规方程 → 求偏导令为 0</text>
  <text x="398" y="145" font-size="10" font-weight="700" fill="#1e3a8a">β̂₁ = Sxy/Sxx = 17/10 = 1.7</text>
  <text x="398" y="164" font-size="10" font-weight="700" fill="#1e3a8a">β̂₀ = Ȳ − β̂₁X̄ = 5.4 − 5.1 = 0.3</text>
  <text x="398" y="188" font-size="9.5" fill="#1e40af">数值性质（与假定无关）：</text>
  <text x="398" y="206" font-size="9" fill="#1e40af">回归线过 (X̄, Ȳ)；Σe = 0；ΣeX = 0</text>
  <text x="398" y="223" font-size="9" fill="#1e40af">Ŷ̄ = Ȳ；SST = SSR + SSE（须含截距）</text>
  <text x="398" y="248" font-size="9.5" fill="#64748b">SSE=0.30　SST=29.20　SSR=28.90</text>
  <text x="398" y="267" font-size="9.5" fill="#64748b">R² = 28.90/29.20 = 0.9897</text>
  <text x="398" y="284" font-size="9" fill="#64748b">拟合值 [2.0, 3.7, 5.4, 7.1, 8.8]</text>

  <rect x="30" y="302" width="620" height="84" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="322" font-size="10.5" font-weight="700" fill="#92400e">从估计到推断（同一组数据）</text>
  <text x="42" y="341" font-size="9.5" fill="#78350f">σ̂² = SSE/(n−2) = 0.30/3 = 0.10　　se(β̂₁) = √(0.10/10) = 0.10　　t = 1.7/0.10 = 17.0 &gt; 3.182</text>
  <text x="42" y="360" font-size="9.5" fill="#78350f">95% CI = 1.7 ± 3.182×0.10 = [1.382, 2.018]　　F = t² = 289　　X=6 时 Ŷ = 10.5</text>
  <text x="42" y="378" font-size="9" fill="#64748b">注意：个别值预测区间比均值预测区间多一个「1」（扰动项自身的不确定性）。</text>
</svg>
