<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">抽样分布、置信区间与假设检验</text>

  <text x="30" y="52" font-size="12" font-weight="700" fill="#334155">① 抽样分布与双侧拒绝域（α = 0.05）</text>
  <rect x="30" y="62" width="320" height="160" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M50 200 C90 200 105 105 190 105 C275 105 290 200 330 200 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="190" y1="105" x2="190" y2="200" stroke="#1e3a8a" stroke-dasharray="4 3"/>
  <text x="190" y="216" text-anchor="middle" font-size="9.5" fill="#1e3a8a">θ（H₀ 下的真值）</text>
  <path d="M50 200 C65 200 72 178 80 160 L80 200 Z" fill="#fecaca" stroke="#dc2626"/>
  <path d="M330 200 C315 200 308 178 300 160 L300 200 Z" fill="#fecaca" stroke="#dc2626"/>
  <text x="64" y="182" font-size="9" fill="#991b1b">α/2</text>
  <text x="302" y="182" font-size="9" fill="#991b1b">α/2</text>
  <text x="50" y="96" font-size="9.5" fill="#475569">拒绝域</text>
  <text x="278" y="96" font-size="9.5" fill="#475569">拒绝域</text>

  <rect x="368" y="62" width="282" height="160" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="380" y="82" font-size="11" font-weight="700" fill="#92400e">p 值与两类错误</text>
  <text x="380" y="103" font-size="9.5" fill="#78350f">p 值 = H₀ 成立时，观测到当前这么极端</text>
  <text x="380" y="120" font-size="9.5" fill="#78350f">或更极端结果的概率；p &lt; α 才拒绝 H₀</text>
  <text x="380" y="143" font-size="9.5" fill="#78350f">第一类错误：H₀ 真却拒绝，概率 = α</text>
  <text x="380" y="160" font-size="9.5" fill="#78350f">第二类错误：H₀ 假却未拒绝，概率 = β</text>
  <text x="380" y="177" font-size="9.5" fill="#78350f">功效 power = 1 − β（样本量越大越高）</text>
  <text x="380" y="203" font-size="9" fill="#64748b">「不拒绝」≠「接受 H₀」，只表示证据不足</text>

  <text x="30" y="248" font-size="12" font-weight="700" fill="#334155">② 估计量的四类性质</text>
  <rect x="30" y="258" width="150" height="46" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="105" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">无偏性（小样本）</text>
  <text x="105" y="294" text-anchor="middle" font-size="9" fill="#15803d">E(θ̂) = θ</text>
  <rect x="186" y="258" width="150" height="46" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="261" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">有效性</text>
  <text x="261" y="294" text-anchor="middle" font-size="9" fill="#15803d">同类估计量中方差最小</text>
  <rect x="342" y="258" width="150" height="46" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="417" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">一致性（大样本）</text>
  <text x="417" y="294" text-anchor="middle" font-size="9" fill="#1e40af">plim θ̂ = θ</text>
  <rect x="498" y="258" width="152" height="46" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="574" y="277" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">渐近正态</text>
  <text x="574" y="294" text-anchor="middle" font-size="9" fill="#1e40af">√n(θ̂−θ) → N(0,V)</text>

  <rect x="30" y="316" width="620" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="42" y="336" font-size="10.5" font-weight="700" fill="#5b21b6">三大抽样分布的构造与常用临界值</text>
  <text x="42" y="355" font-size="9.5" fill="#4c1d95">Z ∼ N(0,1)；V ∼ χ²(m) → t = Z/√(V/m)；U ∼ χ²(m), V ∼ χ²(r) → F = (U/m)/(V/r)；t²(m) = F(1,m)</text>
  <text x="42" y="374" font-size="9.5" fill="#4c1d95">z₀.₀₂₅=1.96　χ²₀.₀₅(1)=3.84　χ²₀.₀₅(2)=5.99　t₀.₀₂₅(3)=3.182　F₀.₀₅(2,26)≈3.37</text>
</svg>
