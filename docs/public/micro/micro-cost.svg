<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">短期成本曲线族：七条曲线与三个交点</text>

  <rect x="30" y="42" width="330" height="196" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① 平均量与边际量的 U 形关系</text>
  <line x1="52" y1="76" x2="52" y2="222" stroke="#475569"/>
  <line x1="52" y1="222" x2="336" y2="222" stroke="#475569"/>
  <text x="30" y="80" font-size="9.5" fill="#334155">C</text>
  <text x="338" y="226" font-size="9.5" fill="#334155">Q</text>
  <path d="M56,206 C130,170 210,180 330,214" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="210" font-size="9" fill="#64748b">AFC</text>
  <path d="M56,186 C120,140 200,132 330,180" fill="none" stroke="#16a34a" stroke-width="1.9"/>
  <text x="324" y="176" font-size="9" fill="#15803d">AVC</text>
  <path d="M56,140 C120,96 210,106 330,160" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="324" y="156" font-size="9" fill="#1d4ed8">AC</text>
  <path d="M56,172 C110,118 180,86 330,92" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="326" y="86" font-size="9" fill="#b91c1c">MC</text>
  <circle cx="150" cy="120" r="3.6" fill="#dc2626"/>
  <circle cx="196" cy="128" r="3.6" fill="#dc2626"/>
  <text x="120" y="112" font-size="8.5" fill="#991b1b">AVCmin</text>
  <text x="196" y="122" font-size="8.5" fill="#991b1b">ACmin</text>

  <rect x="372" y="42" width="278" height="196" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="384" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 七条曲线定义</text>
  <text x="384" y="82" font-size="9.6" fill="#334155">TFC 固定不变；TVC 随 Q 递增；STC=TFC+TVC</text>
  <text x="384" y="101" font-size="9.6" fill="#334155">AFC = TFC/Q（双曲线，单调递减趋近 0）</text>
  <text x="384" y="120" font-size="9.6" fill="#334155">AVC = TVC/Q；AC = STC/Q = AFC + AVC</text>
  <text x="384" y="139" font-size="9.6" fill="#334155">SMC = dSTC/dQ = dTVC/dQ（与 TFC 无关）</text>
  <text x="384" y="161" font-size="9.6" font-weight="700" fill="#b91c1c">三个必考点：</text>
  <text x="384" y="180" font-size="9.6" fill="#334155">MC 穿过 AVC 与 AC 各自的最低点</text>
  <text x="384" y="198" font-size="9.6" fill="#334155">AC 最低点在 AVC 最低点右上方</text>
  <text x="384" y="216" font-size="9.6" fill="#334155">AC 与 AVC 的垂直距离 = AFC，随 Q 缩小</text>
  <text x="384" y="234" font-size="9.2" fill="#64748b">根因：MP 先升后降 ⇒ MC 先降后升（对偶）</text>

  <rect x="30" y="248" width="620" height="88" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="268" font-size="11" font-weight="700" fill="#166534">③ 工作例题：STC = Q³ − 6Q² + 15Q + 100（TFC = 100）</text>
  <text x="42" y="288" font-size="9.8" fill="#334155">TVC = Q³−6Q²+15Q；AVC = Q²−6Q+15；AC = AVC + 100/Q；SMC = 3Q²−12Q+15</text>
  <text x="42" y="307" font-size="9.8" fill="#334155">Q=3：TVC=18，AVC=6，AC=39.33，SMC=6 ⇒ AVCmin = 6 = SMC（MC 穿 AVC 最低点 ✓）</text>
  <text x="42" y="326" font-size="9.8" fill="#334155">Q=5：AVC=10，AC=30，SMC=30 ⇒ ACmin = 30 = SMC（MC 穿 AC 最低点 ✓）</text>

  <rect x="30" y="346" width="620" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="365" font-size="10.3" font-weight="700" fill="#92400e">④ 成本概念辨析</text>
  <text x="42" y="384" font-size="9.7" fill="#334155">经济成本 = 显成本 + 隐成本（含自有要素的机会成本）；会计成本只算显成本；经济利润 = TR − 经济成本，正常利润计入隐成本 ⇒ 经济利润为零时企业仍在经营</text>
</svg>
