<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">长期成本曲线：包络线、规模经济与范围经济</text>

  <rect x="30" y="42" width="326" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① LAC 是所有 SAC 的包络线</text>
  <line x1="52" y1="76" x2="52" y2="206" stroke="#475569"/>
  <line x1="52" y1="206" x2="330" y2="206" stroke="#475569"/>
  <text x="30" y="80" font-size="9.5" fill="#334155">C</text>
  <text x="332" y="210" font-size="9.5" fill="#334155">Q</text>
  <path d="M58,96 C130,156 220,170 326,148" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <text x="322" y="142" font-size="9.5" fill="#1d4ed8">LAC</text>
  <path d="M62,150 C90,106 128,104 156,152" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M126,164 C160,120 208,118 242,160" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M212,166 C252,126 300,126 328,158" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="72" y="118" font-size="8.5" fill="#94a3b8">SAC₁</text>
  <text x="170" y="136" font-size="8.5" fill="#94a3b8">SAC₂</text>
  <text x="264" y="142" font-size="8.5" fill="#94a3b8">SAC₃</text>
  <path d="M58,178 C130,144 220,132 326,112" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="320" y="106" font-size="9" fill="#b91c1c">LMC</text>
  <text x="42" y="220" font-size="8.8" fill="#64748b">LAC 最低点左侧：与 SAC 最低点左方相切；右侧：与 SAC 最低点右方相切</text>

  <rect x="368" y="42" width="282" height="180" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 三条长期曲线</text>
  <text x="380" y="83" font-size="9.7" fill="#334155">LTC：长期中每个产量的最低总成本</text>
  <text x="380" y="102" font-size="9.7" fill="#334155">LAC = LTC/Q（可由 LTC 原点射线斜率读出）</text>
  <text x="380" y="121" font-size="9.7" fill="#334155">LMC = dLTC/dQ，过 LAC 最低点</text>
  <text x="380" y="142" font-size="9.7" font-weight="700" fill="#b91c1c">LAC 下降段：规模经济（内在 + 外在）</text>
  <text x="380" y="161" font-size="9.7" fill="#334155">LAC 上升段：规模不经济（管理协调成本）</text>
  <text x="380" y="180" font-size="9.7" fill="#334155">LAC 水平段：规模报酬不变（常数规模经济）</text>
  <text x="380" y="200" font-size="9.5" fill="#64748b">最优规模 = LAC 最低点对应工厂；最低效率规模 MES</text>

  <rect x="30" y="232" width="620" height="76" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="252" font-size="11" font-weight="700" fill="#166534">③ 三个常被混淆的「经济」</text>
  <text x="42" y="271" font-size="9.7" fill="#334155">规模经济：单一产品产量扩大 → LAC 下降（技术/专业化/不可分性）</text>
  <text x="42" y="290" font-size="9.7" fill="#334155">范围经济：联合生产多种产品比分别生产成本低，C(Q₁,Q₂) &lt; C(Q₁,0)+C(0,Q₂)（共享投入/渠道）</text>
  <text x="42" y="305" font-size="9.7" fill="#334155">学习效应：随累计产量（非当期产量）增加，平均成本沿学习曲线下降，是「动态」而非「规模」效应</text>

  <rect x="30" y="318" width="620" height="68" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="338" font-size="10.5" font-weight="700" fill="#92400e">④ 短期与长期的关系</text>
  <text x="42" y="357" font-size="9.7" fill="#334155">长期中「所有要素都可变」，无固定成本；短期至少一种要素固定 ⇒ SAC ≥ LAC，且二者只在切点相等</text>
  <text x="42" y="376" font-size="9.7" fill="#334155">厂商先按预期产量选最优规模（选一条 SAC），再在短期内沿 SMC 调整产量；这就是「长期规划、短期经营」</text>
</svg>
