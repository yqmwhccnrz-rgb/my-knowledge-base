<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">无差异曲线、预算线与消费者均衡</text>

  <!-- 坐标 -->
  <line x1="60" y1="52" x2="60" y2="290" stroke="#475569" stroke-width="1.6"/>
  <line x1="60" y1="290" x2="310" y2="290" stroke="#475569" stroke-width="1.6"/>
  <text x="30" y="66" font-size="10" fill="#334155">Y</text>
  <text x="312" y="294" font-size="10" fill="#334155">X</text>
  <text x="42" y="304" font-size="9" fill="#64748b">0</text>
  <!-- 预算线 I/Py=20, I/Px=50 -->
  <line x1="60" y1="70" x2="290" y2="290" stroke="#dc2626" stroke-width="2"/>
  <text x="66" y="64" font-size="9.5" fill="#dc2626">I/Py</text>
  <text x="288" y="304" font-size="9.5" fill="#dc2626">I/Px</text>
  <text x="196" y="200" font-size="9.5" fill="#dc2626" transform="rotate(43 196 200)">预算线斜率 −Px/Py</text>
  <!-- 三条无差异曲线 -->
  <path d="M76,250 Q150,150 288,128" fill="none" stroke="#93c5fd" stroke-width="1.7"/>
  <path d="M70,224 Q160,108 296,84" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M92,182 Q180,78 300,56" fill="none" stroke="#93c5fd" stroke-width="1.7" stroke-dasharray="5 3"/>
  <text x="292" y="126" font-size="10" fill="#2563eb">U₁</text>
  <text x="298" y="82" font-size="10" fill="#1d4ed8">U₂</text>
  <text x="302" y="56" font-size="10" fill="#64748b">U₃（不可达）</text>
  <circle cx="170" cy="180" r="5" fill="#dc2626"/>
  <text x="178" y="174" font-size="10" font-weight="700" fill="#991b1b">E*</text>
  <text x="76" y="336" font-size="9.5" fill="#334155">凸向原点：MRSxy 递减</text>

  <rect x="336" y="48" width="314" height="118" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="348" y="68" font-size="11.5" font-weight="700" fill="#1e3a8a">① 两条路线，同一个均衡条件</text>
  <text x="348" y="89" font-size="10" fill="#334155">基数效用：MUx/Px = MUy/Py = λ（货币边际效用）</text>
  <text x="348" y="108" font-size="10" fill="#334155">序数效用：MRSxy = MUx/MUy = Px/Py</text>
  <text x="348" y="127" font-size="10" fill="#334155">几何含义：无差异曲线与预算线相切（内点解）</text>
  <text x="348" y="147" font-size="9.5" fill="#64748b">角点解：完全替代（直线 IC）或完全互补（L 形 IC）时不必相切</text>

  <rect x="336" y="176" width="314" height="106" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="348" y="196" font-size="11" font-weight="700" fill="#166534">② 工作例题：U = XY，I = 100，Px = 2，Py = 5</text>
  <text x="348" y="216" font-size="10" fill="#334155">MRS = Y/X = Px/Py = 0.4 ⇒ Y = 0.4X</text>
  <text x="348" y="235" font-size="10" fill="#334155">代入 2X + 5Y = 100 ⇒ 4X = 100 ⇒ X* = 25，Y* = 10</text>
  <text x="348" y="254" font-size="10" fill="#334155">U* = 250；C-D 通式 X* = αI/Px，Y* = (1−α)I/Py</text>
  <text x="348" y="272" font-size="9.5" fill="#64748b">C-D 效用下每种商品支出份额恒等于其指数 α</text>

  <rect x="30" y="316" width="620" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="336" font-size="11" font-weight="700" fill="#92400e">③ 无差异曲线四性质与两个陷阱</text>
  <text x="42" y="355" font-size="9.8" fill="#334155">性质：完备性、传递性、通常凸向原点（MRS 递减）、离原点越远效用越高、任意两条不相交</text>
  <text x="42" y="374" font-size="9.8" fill="#334155">陷阱：MRS 是「愿意」交换的比率、Px/Py 是「能够」交换的比率；均衡是二者相等，而非效用最大 = 花光钱以外的任何条件</text>
</svg>
