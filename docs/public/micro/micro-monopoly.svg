<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">垄断、无谓损失与三级价格歧视</text>

  <rect x="30" y="42" width="326" height="176" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① 垄断均衡 MR = MC 与福利损失</text>
  <line x1="52" y1="76" x2="52" y2="204" stroke="#475569"/>
  <line x1="52" y1="204" x2="330" y2="204" stroke="#475569"/>
  <text x="30" y="80" font-size="9.5" fill="#334155">P,C</text>
  <text x="332" y="208" font-size="9.5" fill="#334155">Q</text>
  <line x1="58" y1="84" x2="270" y2="204" stroke="#2563eb" stroke-width="1.9"/>
  <text x="266" y="82" font-size="9" fill="#1d4ed8">D = AR</text>
  <line x1="58" y1="84" x2="164" y2="204" stroke="#dc2626" stroke-width="1.9"/>
  <text x="158" y="196" font-size="9" fill="#b91c1c">MR</text>
  <line x1="52" y1="168" x2="326" y2="168" stroke="#16a34a" stroke-width="1.8"/>
  <text x="320" y="162" font-size="9" fill="#15803d">MC</text>
  <circle cx="164" cy="168" r="3.8" fill="#dc2626"/>
  <line x1="164" y1="168" x2="164" y2="204" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text x="158" y="216" font-size="9" fill="#334155">Qm</text>
  <circle cx="164" cy="130" r="3.5" fill="#2563eb"/>
  <text x="168" y="126" font-size="9" fill="#1d4ed8">Pm</text>
  <circle cx="270" cy="168" r="3.5" fill="#16a34a"/>
  <text x="266" y="216" font-size="9" fill="#15803d">Qc</text>
  <path d="M164,130 L164,168 L270,168 Z" fill="#fca5a5" opacity="0.5"/>
  <text x="196" y="158" font-size="8.8" fill="#991b1b">DWL</text>

  <rect x="368" y="42" width="282" height="176" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="380" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 关键公式</text>
  <text x="380" y="83" font-size="9.8" fill="#334155">线性需求 P = a − bQ ⇒ MR = a − 2bQ</text>
  <text x="380" y="102" font-size="9.8" fill="#334155">（MR 与 D 纵截距相同、横截距为其一半）</text>
  <text x="380" y="123" font-size="9.8" fill="#334155">MR = P(1 − 1/|Ed|) ⇒ 勒纳指数</text>
  <text x="380" y="142" font-size="10.3" fill="#1d4ed8">L = (P − MC)/P = 1/|Ed|</text>
  <text x="380" y="162" font-size="9.7" fill="#334155">⇒ 垄断者绝不在 |Ed| &lt; 1 处生产</text>
  <text x="380" y="182" font-size="9.7" fill="#334155">三级价格歧视：MR₁ = MR₂ = MC</text>
  <text x="380" y="201" font-size="9.7" fill="#334155">⇒ P₁(1−1/|E₁|) = P₂(1−1/|E₂|) = MC</text>
  <text x="380" y="216" font-size="9.2" fill="#64748b">弹性小的市场价格更高</text>

  <rect x="30" y="228" width="620" height="92" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="248" font-size="11" font-weight="700" fill="#166534">③ 工作例题：P = 100 − 2Q，MC = 20</text>
  <text x="42" y="268" font-size="9.8" fill="#334155">MR = 100 − 4Q = 20 ⇒ Qm = 20，Pm = 60，π = (60−20)×20 = 800，CS = ½×40×20 = 400</text>
  <text x="42" y="287" font-size="9.8" fill="#334155">|Ed| = (1/2)(P/Q) = 1.5 ⇒ L = (60−20)/60 = 2/3 = 1/1.5 ✓；竞争 Qc = 40，P = 20，DWL = ½×40×20 = 400</text>
  <text x="42" y="306" font-size="9.8" fill="#334155">三级歧视：P₁=100−2Q₁、P₂=80−Q₂、MC=20 ⇒ Q₁=20/P₁=60（|E₁|=1.5）；Q₂=30/P₂=50（|E₂|=1.67）；π=1700 &gt; 统一定价 1666.67</text>

  <rect x="30" y="330" width="620" height="76" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="348" font-size="10.5" font-weight="700" fill="#92400e">④ 价格歧视三条件与三级类型</text>
  <text x="42" y="366" font-size="9.7" fill="#334155">条件：有一定市场势力 + 能识别不同支付意愿 + 能阻止套利转售；一级（按单位索取保留价，无 DWL 但全占 CS）</text>
  <text x="42" y="383" font-size="9.7" fill="#334155">二级（按消费量分段定价／两部定价，自我选择）、三级（按可观察特征分割市场，弹性小者价高）</text>
  <text x="42" y="400" font-size="9.2" fill="#64748b">自然垄断：平均成本在相关产量范围内递减，管制可选边际成本定价（需补贴）或平均成本定价</text>
</svg>
