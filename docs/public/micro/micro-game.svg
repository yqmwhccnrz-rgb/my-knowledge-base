<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">博弈论：支付矩阵、纳什均衡与混合策略</text>

  <rect x="30" y="42" width="306" height="182" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="62" font-size="11" font-weight="700" fill="#334155">① 囚徒困境（单元格为「甲, 乙」）</text>
  <rect x="104" y="72" width="86" height="28" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="147" y="90" text-anchor="middle" font-size="9" fill="#334155">乙：坦白</text>
  <rect x="190" y="72" width="86" height="28" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="233" y="90" text-anchor="middle" font-size="9" fill="#334155">乙：抵赖</text>
  <rect x="42" y="100" width="62" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="73" y="119" text-anchor="middle" font-size="9" fill="#334155">甲坦白</text>
  <rect x="42" y="130" width="62" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="73" y="149" text-anchor="middle" font-size="9" fill="#334155">甲抵赖</text>
  <rect x="104" y="100" width="86" height="30" fill="#fee2e2" stroke="#dc2626"/>
  <text x="147" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">−8, −8</text>
  <rect x="190" y="100" width="86" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="233" y="119" text-anchor="middle" font-size="10" fill="#334155">1, −20</text>
  <rect x="104" y="130" width="86" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="147" y="149" text-anchor="middle" font-size="10" fill="#334155">−20, 1</text>
  <rect x="190" y="130" width="86" height="30" fill="#dcfce7" stroke="#16a34a"/>
  <text x="233" y="149" text-anchor="middle" font-size="10" fill="#166534">−1, −1</text>
  <text x="42" y="180" font-size="9.3" fill="#334155">双方均有占优策略「坦白」⇒ 唯一纳什均衡 (−8,−8)</text>
  <text x="42" y="197" font-size="9.3" fill="#334155">但 (−1,−1) 帕累托优于它 ⇒ 个体理性导致集体非理性</text>
  <text x="42" y="214" font-size="9.1" fill="#64748b">这就是寡头卡特尔不稳定的根本原因</text>

  <rect x="348" y="42" width="302" height="182" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="62" font-size="11" font-weight="700" fill="#1e3a8a">② 核心概念与划线法</text>
  <text x="360" y="83" font-size="9.6" fill="#334155">纳什均衡：给定对方策略，无人能单独改变而获益</text>
  <text x="360" y="102" font-size="9.6" fill="#334155">占优策略：无论对方选什么都是最优（占优均衡必是纳什均衡）</text>
  <text x="360" y="121" font-size="9.6" fill="#334155">条件策略下划线法：把支付矩阵拆成甲、乙两张表</text>
  <text x="370" y="139" font-size="9.2" fill="#64748b">甲表中对乙每一列找甲的最大支付画线；乙表中对甲每一行找乙的最大支付画线；两表合并后双方都画线的格子即纳什均衡</text>
  <text x="360" y="160" font-size="9.6" fill="#334155">纯策略均衡可能不存在、可能不唯一、可能非帕累托最优</text>
  <text x="360" y="180" font-size="9.6" fill="#334155">性别战示例 (2,1)/(0,0)/(0,0)/(1,2)：两个纯策略均衡 + 一个混合策略均衡</text>
  <text x="360" y="200" font-size="9.4" fill="#1d4ed8">混合策略：甲 p(芭蕾)=2/3、乙 q(芭蕾)=1/3，令对方无差异</text>
  <text x="360" y="218" font-size="9.1" fill="#64748b">重复博弈中「以牙还牙」与贴现率足够高时可维持合作</text>

  <rect x="30" y="234" width="620" height="82" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="42" y="254" font-size="11" font-weight="700" fill="#166534">③ 混合策略求解工作例题（性别战）</text>
  <text x="42" y="274" font-size="9.7" fill="#334155">设甲以概率 p 选「芭蕾」。要乙无差异：乙选芭蕾期望 = 1·p + 0·(1−p) = p；选拳击期望 = 0·p + 2(1−p)</text>
  <text x="42" y="293" font-size="9.7" fill="#334155">令 p = 2 − 2p ⇒ p = 2/3；同理乙以 q = 1/3 选芭蕾使甲无差异 ⇒ 混合策略纳什均衡</text>
  <text x="42" y="310" font-size="9.5" fill="#64748b">要点：混合策略均衡中，参与人让自己无差异的动机是「使对方无差异」，不是让自己期望支付最大</text>

  <rect x="30" y="326" width="620" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="42" y="346" font-size="10.5" font-weight="700" fill="#92400e">④ 博弈分类与易错点</text>
  <text x="42" y="365" font-size="9.7" fill="#334155">完全信息静态（ simult. ）/ 完全信息动态（子博弈精炼纳什均衡，用逆向归纳剔除不可置信威胁）/ 不完全信息（贝叶斯纳什均衡）</text>
  <text x="42" y="384" font-size="9.7" fill="#334155">零和博弈支付之和恒为常数；常和/变和博弈不同。纳什均衡 ≠ 占优均衡 ≠ 帕累托最优；合作博弈关注分配（夏普利值）而非策略</text>
</svg>
