<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" role="img">
<title>从文件到网页的三层结构</title>
<desc>GitHub 文件经过排版构建，生成可阅读的网页</desc>
<rect x="20" y="20" width="640" height="160" rx="16" fill="#F4F7F6" stroke="#D5E2DE" stroke-width="1"/>
<rect x="45" y="65" width="170" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="130" y="95" text-anchor="middle" font-size="15" font-weight="500" fill="#0C447C" font-family="sans-serif">文件</text>
<text x="130" y="117" text-anchor="middle" font-size="12" fill="#185FA5" font-family="sans-serif">Markdown · PDF · 图片</text>
<path d="M225 100 L265 100" fill="none" stroke="#5F6E6B" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="275" y="65" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="360" y="95" text-anchor="middle" font-size="15" font-weight="500" fill="#085041" font-family="sans-serif">排版构建</text>
<text x="360" y="117" text-anchor="middle" font-size="12" fill="#0F6E56" font-family="sans-serif">目录 · 导航 · 搜索</text>
<path d="M455 100 L495 100" fill="none" stroke="#5F6E6B" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="505" y="65" width="130" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="570" y="95" text-anchor="middle" font-size="15" font-weight="500" fill="#0C447C" font-family="sans-serif">网页</text>
<text x="570" y="117" text-anchor="middle" font-size="12" fill="#185FA5" font-family="sans-serif">分享链接阅读</text>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1 L8 5 L2 9" fill="none" stroke="#5F6E6B" stroke-width="1.5"/>
</marker>
</defs>
</svg>
