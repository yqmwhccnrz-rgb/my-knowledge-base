<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="380" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">投资项目资本预算：决策方法与评价</text>

  <rect x="30" y="55" width="200" height="45" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="130" y="80" text-anchor="middle" font-size="13" fill="#1e3a8a">净现值 NPV</text>
  <rect x="240" y="55" width="200" height="45" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" fill="#14532d">内含报酬率 IRR</text>
  <rect x="450" y="55" width="200" height="45" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="550" y="80" text-anchor="middle" font-size="13" fill="#7f1d1d">回收期 / 会计报酬率</text>

  <text x="130" y="130" text-anchor="middle" font-size="12" fill="#334155">Σ 净现金流量/(1+r)^t − 原始投资</text>
  <text x="340" y="130" text-anchor="middle" font-size="12" fill="#334155">NPV=0 时的折现率</text>
  <text x="550" y="130" text-anchor="middle" font-size="12" fill="#334155">辅助指标，存在缺陷</text>

  <line x1="130" y1="100" x2="130" y2="155" stroke="#94a3b8"/>
  <line x1="340" y1="100" x2="340" y2="155" stroke="#94a3b8"/>
  <line x1="550" y1="100" x2="550" y2="155" stroke="#94a3b8"/>

  <rect x="30" y="155" width="620" height="40" rx="8" fill="#fffbeb" stroke="#b45309"/>
  <text x="340" y="180" text-anchor="middle" font-size="13" fill="#78350f">互斥项目：投资额不同 / 期限不同时，IRR 可能误导，应以 NPV 为准；IRR 与 NPV 结论冲突时选 NPV。</text>

  <text x="340" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">现金流估计要点</text>
  <rect x="40" y="240" width="290" height="110" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="55" y="265" font-size="12" fill="#334155">相关现金流（增量现金流）：</text>
  <text x="55" y="287" font-size="12" fill="#334155">· 区分相关成本与沉没成本</text>
  <text x="55" y="309" font-size="12" fill="#334155">· 考虑机会成本、营运资本垫支与回收</text>
  <text x="55" y="331" font-size="12" fill="#334155">· 不考虑利息支出（已含在折现率中）</text>

  <rect x="350" y="240" width="290" height="110" rx="8" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="365" y="265" font-size="12" fill="#334155">风险处置：</text>
  <text x="365" y="287" font-size="12" fill="#334155">· 风险调整折现率法（调高 r）</text>
  <text x="365" y="309" font-size="12" fill="#334155">· 确定等值系数法（调低现金流）</text>
  <text x="365" y="331" font-size="12" fill="#334155">· 敏感性分析与情景分析</text>
</svg>
