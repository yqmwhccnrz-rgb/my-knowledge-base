<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="380" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">价值评估两大路径</text>

  <rect x="40" y="55" width="270" height="50" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="175" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">① 现金流量折现模型（绝对估值）</text>
  <rect x="370" y="55" width="270" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="505" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">② 相对价值模型（可比法）</text>

  <line x1="175" y1="105" x2="175" y2="140" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="505" y1="105" x2="505" y2="140" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="40" y="140" width="270" height="95" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="175" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">实体价值 / 股权价值</text>
  <text x="175" y="184" text-anchor="middle" font-size="12" fill="#334155">实体现金流量 / 股权现金流量</text>
  <text x="175" y="204" text-anchor="middle" font-size="12" fill="#334155">÷（加权平均 / 股权）资本成本</text>
  <text x="175" y="224" text-anchor="middle" font-size="12" fill="#334155">永续增长与两阶段模型</text>

  <rect x="370" y="140" width="270" height="95" rx="8" fill="#ecfdf5" stroke="#15803d"/>
  <text x="505" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">市盈率 / 市净率 / 市销率</text>
  <text x="505" y="184" text-anchor="middle" font-size="12" fill="#334155">目标企业价值 = 可比企业乘数</text>
  <text x="505" y="204" text-anchor="middle" font-size="12" fill="#334155">× 目标企业相关指标</text>
  <text x="505" y="224" text-anchor="middle" font-size="12" fill="#334155">修正的市价 / 净利比、市价 / 净资产比</text>

  <text x="340" y="275" text-anchor="middle" font-size="13" fill="#475569">企业价值评估（第 7 章）= 第 3 章货币时间价值 + 第 4 章资本成本的综合运用</text>

  <text x="40" y="320" font-size="12" fill="#64748b">关键公式：</text>
  <text x="40" y="340" font-size="11.5" fill="#475569">实体价值 = Σ 实体现金流量_t /(1+WACC)^t ； 股权价值 = 实体价值 − 净债务</text>
  <text x="40" y="358" font-size="11.5" fill="#475569">市盈率目标价 = 可比市盈率 × 目标企业每股收益；市净率 = 市价 / 每股净资产</text>
</svg>
