<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="680" height="380" fill="#f8fafc"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">资本结构理论演进</text>

  <rect x="30" y="55" width="300" height="50" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="180" y="78" text-anchor="middle" font-size="14" fill="#1e3a8a">MM 理论（无税）：</text>
  <text x="180" y="98" text-anchor="middle" font-size="12" fill="#1e3a8a">资本结构不影响企业价值</text>

  <rect x="350" y="55" width="300" height="50" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="500" y="78" text-anchor="middle" font-size="14" fill="#14532d">MM 理论（有税）：</text>
  <text x="500" y="98" text-anchor="middle" font-size="12" fill="#14532d">负债因抵税而增加价值（V_L = V_U + T·D）</text>

  <line x1="180" y1="105" x2="180" y2="145" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="500" y1="105" x2="500" y2="145" stroke="#94a3b8" stroke-width="1.2"/>

  <rect x="30" y="145" width="620" height="70" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="40" y="170" font-size="12.5" fill="#334155">权衡理论（权衡理论）：负债的抵税收益 V 与财务困境成本相权衡 → 存在最优资本结构，使</text>
  <text x="40" y="192" font-size="12.5" fill="#334155">V_L = V_U + T·D − 预期财务困境成本现值；代理理论与优序融资理论进一步补充：</text>
  <text x="40" y="212" font-size="12.5" fill="#334155">优序融资理论（Pecking Order）认为融资偏好为 内部留存 &gt; 债务 &gt; 股权。</text>

  <text x="340" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">资本结构决策方法</text>
  <rect x="40" y="270" width="190" height="80" rx="8" fill="#fef2f2" stroke="#cbd5e1"/>
  <text x="55" y="295" font-size="12" fill="#334155">每股收益无差别点：</text>
  <text x="55" y="317" font-size="12" fill="#334155">令不同筹资方案下</text>
  <text x="55" y="339" font-size="12" fill="#334155">EPS 相等，比较 EBIT</text>
  <rect x="245" y="270" width="190" height="80" rx="8" fill="#fffbeb" stroke="#cbd5e1"/>
  <text x="260" y="295" font-size="12" fill="#334155">资本成本比较法：</text>
  <text x="260" y="317" font-size="12" fill="#334155">比较各方案 WACC，</text>
  <text x="260" y="339" font-size="12" fill="#334155">取最低者</text>
  <rect x="450" y="270" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="465" y="295" font-size="12" fill="#334155">企业价值比较法：</text>
  <text x="465" y="317" font-size="12" fill="#334155">以公司总价值最大、</text>
  <text x="465" y="339" font-size="12" fill="#334155">WACC 最低为目标</text>
</svg>
