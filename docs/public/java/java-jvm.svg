<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">JVM 运行时数据区（内存结构）</text>

  <!-- 线程私有 -->
  <rect x="30" y="60" width="300" height="300" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="5 3"/>
  <text x="180" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">线程私有（每线程一份）</text>

  <rect x="55" y="100" width="250" height="40" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="180" y="125" text-anchor="middle" font-size="12.5" fill="#312e81">程序计数器 PC（行号指示器）</text>
  <rect x="55" y="155" width="250" height="40" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="180" y="180" text-anchor="middle" font-size="12.5" fill="#312e81">虚拟机栈（栈帧/局部变量/操作数栈）</text>
  <rect x="55" y="210" width="250" height="40" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="180" y="235" text-anchor="middle" font-size="12.5" fill="#312e81">本地方法栈（Native 方法）</text>
  <text x="180" y="285" text-anchor="middle" font-size="11" fill="#6366f1">栈帧随方法调用入栈、返回出栈；</text>
  <text x="180" y="303" text-anchor="middle" font-size="11" fill="#6366f1">深度过大会 StackOverflowError。</text>

  <!-- 线程共享 -->
  <rect x="350" y="60" width="300" height="300" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-dasharray="5 3"/>
  <text x="500" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">线程共享（所有线程共用）</text>

  <rect x="375" y="100" width="250" height="55" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="500" y="124" text-anchor="middle" font-size="12.5" fill="#155e75" font-weight="700">堆 Heap</text>
  <text x="500" y="143" text-anchor="middle" font-size="11" fill="#155e75">对象实例、数组；GC 主战场</text>
  <rect x="375" y="170" width="250" height="55" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="500" y="194" text-anchor="middle" font-size="12.5" fill="#155e75" font-weight="700">方法区 Method Area（元空间 Metaspace）</text>
  <text x="500" y="213" text-anchor="middle" font-size="11" fill="#155e75">类信息、常量、静态变量、JIT 代码缓存</text>
  <rect x="375" y="240" width="250" height="40" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="500" y="265" text-anchor="middle" font-size="12.5" fill="#155e75">运行时常量池（在方法区内）</text>
  <text x="500" y="312" text-anchor="middle" font-size="11" fill="#0891b2">堆不足 → OutOfMemoryError；</text>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#0891b2">元空间可动态扩展（受本机内存限制）。</text>

  <!-- bottom: class loading + execution engine -->
  <rect x="30" y="372" width="0" height="0" fill="none"/>
  <text x="340" y="392" text-anchor="middle" font-size="11.5" fill="#334155">.java ──编译──▶ .class 字节码 ──类加载器──▶ JVM（执行引擎：解释器 + JIT 编译器）──▶ 运行时数据区</text>
</svg>
