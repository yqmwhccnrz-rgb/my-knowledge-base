<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="500" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">JVM 运行时数据区与垃圾回收</text>

  <!-- 线程私有 -->
  <rect x="24" y="52" width="306" height="196" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-dasharray="5 3"/>
  <text x="177" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">线程私有（每线程一份，随线程生灭）</text>
  <rect x="40" y="86" width="274" height="36" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="177" y="108" text-anchor="middle" font-size="11.5" fill="#312e81">程序计数器 PC：当前字节码行号</text>
  <rect x="40" y="130" width="274" height="36" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="177" y="152" text-anchor="middle" font-size="11.5" fill="#312e81">虚拟机栈：栈帧 = 局部变量表 + 操作数栈</text>
  <rect x="40" y="174" width="274" height="36" rx="6" fill="#ffffff" stroke="#4338ca"/>
  <text x="177" y="196" text-anchor="middle" font-size="11.5" fill="#312e81">本地方法栈：为 Native 方法服务</text>
  <text x="177" y="230" text-anchor="middle" font-size="10.5" fill="#6366f1">栈帧随方法调用入栈 / 返回出栈；无限递归 → StackOverflowError</text>

  <!-- 线程共享 -->
  <rect x="350" y="52" width="306" height="196" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-dasharray="5 3"/>
  <text x="503" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">线程共享（整个 JVM 一份）</text>
  <rect x="366" y="86" width="274" height="48" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="503" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#155e75">堆 Heap（GC 主战场）</text>
  <text x="503" y="125" text-anchor="middle" font-size="10.5" fill="#155e75">所有对象实例与数组；分新生代 / 老年代</text>
  <rect x="366" y="142" width="274" height="48" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="503" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#155e75">方法区 / 元空间 Metaspace</text>
  <text x="503" y="181" text-anchor="middle" font-size="10.5" fill="#155e75">类元数据、静态变量、运行时常量池</text>
  <text x="503" y="208" text-anchor="middle" font-size="10.5" fill="#0891b2">JDK 8+ 用本地内存实现；堆不足 → OutOfMemoryError</text>
  <text x="503" y="230" text-anchor="middle" font-size="10.5" fill="#0891b2">JIT Code Cache 是堆外独立区域，不属于方法区</text>

  <!-- 分代与 GC -->
  <rect x="24" y="262" width="632" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="284" font-size="12.5" font-weight="700" fill="#334155">堆的分代与 GC 判定</text>

  <rect x="40" y="296" width="290" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="52" y="315" font-size="11" font-weight="700" fill="#15803d">新生代 Young（复制算法 · Minor GC）</text>
  <text x="52" y="334" font-size="10.5" fill="#334155">Eden（新对象） + Survivor S0 / S1（存活对象来回拷贝）</text>
  <text x="52" y="352" font-size="10.5" fill="#334155">熬过若干次 Minor GC 仍存活 → 晋升老年代</text>

  <rect x="342" y="296" width="298" height="70" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="354" y="315" font-size="11" font-weight="700" fill="#c2410c">老年代 Old（标记-清除 / 标记-整理 · Full GC）</text>
  <text x="354" y="334" font-size="10.5" fill="#334155">存活久、占比大的对象；回收频率低但耗时长（STW）</text>
  <text x="354" y="352" font-size="10.5" fill="#334155">判定存活：可达性分析（非引用计数，能解决循环引用）</text>

  <text x="24" y="400" font-size="11.5" fill="#334155">• GC Roots：虚拟机栈中引用的对象、静态字段 / 常量引用的对象、本地方法栈 JNI 引用、被同步锁持有的对象等。</text>
  <text x="24" y="420" font-size="11.5" fill="#334155">• 从 GC Roots 沿引用链不可达的对象判为可回收；标记-清除会产生内存碎片，复制算法无碎片但浪费一半空间，标记-整理适合老年代。</text>

  <!-- 执行链 -->
  <rect x="24" y="436" width="632" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="456" font-size="11" fill="#334155">加载与执行：.java ──javac──▶ .class 字节码 ──类加载器（加载/链接/初始化）──▶ 运行时数据区 ──执行引擎（解释器 + JIT 热点编译）──▶ 机器码</text>
  <text x="36" y="474" font-size="10.5" fill="#64748b">引用类型：强引用 &gt; 软引用（内存不足才回收）&gt; 弱引用（下次 GC 即回收）&gt; 虚引用（仅用于回收通知）。</text>
</svg>
