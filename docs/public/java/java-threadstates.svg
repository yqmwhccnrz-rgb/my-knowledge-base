<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="440" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Java 线程状态（Thread.State）及转换</text>

  <defs>
    <marker id="go" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="back" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- NEW -->
  <rect x="24" y="176" width="96" height="44" rx="20" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.3"/>
  <text x="72" y="197" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">NEW</text>
  <text x="72" y="213" text-anchor="middle" font-size="10" fill="#64748b">新建未 start</text>

  <!-- RUNNABLE -->
  <rect x="172" y="170" width="140" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="242" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">RUNNABLE</text>
  <text x="242" y="211" text-anchor="middle" font-size="10" fill="#64748b">就绪 + 运行（JVM 不细分）</text>

  <!-- 等待态三兄弟 -->
  <rect x="410" y="66" width="150" height="42" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text x="485" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">BLOCKED</text>
  <text x="485" y="101" text-anchor="middle" font-size="10" fill="#64748b">等待 synchronized 监视器锁</text>

  <rect x="410" y="166" width="150" height="42" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text x="485" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">WAITING</text>
  <text x="485" y="201" text-anchor="middle" font-size="10" fill="#64748b">无限期等待被唤醒</text>

  <rect x="410" y="266" width="150" height="42" rx="10" fill="#fef9c3" stroke="#a16207"/>
  <text x="485" y="286" text-anchor="middle" font-size="11.5" font-weight="700" fill="#854d0e">TIMED_WAITING</text>
  <text x="485" y="301" text-anchor="middle" font-size="10" fill="#64748b">带时限的等待</text>

  <!-- TERMINATED -->
  <rect x="576" y="176" width="88" height="44" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
  <text x="620" y="197" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">TERMINATED</text>
  <text x="620" y="213" text-anchor="middle" font-size="10" fill="#64748b">终止</text>

  <!-- NEW -> RUNNABLE -->
  <line x1="120" y1="198" x2="168" y2="198" stroke="#2563eb" stroke-width="1.5" marker-end="url(#go)"/>
  <text x="144" y="190" text-anchor="middle" font-size="10" fill="#2563eb">start()</text>

  <!-- RUNNABLE -> TERMINATED（绕下方，避免穿过等待态） -->
  <path d="M242 226 L242 352 L620 352 L620 224" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#go)"/>
  <text x="430" y="346" text-anchor="middle" font-size="10.5" fill="#2563eb">run() 正常结束 / 未捕获异常 → TERMINATED（终态，不可再 start）</text>

  <!-- 去程：RUNNABLE -> 三种等待态（蓝色） -->
  <path d="M312 184 L400 88" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#go)"/>
  <line x1="312" y1="196" x2="406" y2="187" stroke="#2563eb" stroke-width="1.4" marker-end="url(#go)"/>
  <path d="M312 210 L400 286" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#go)"/>
  <text x="352" y="128" text-anchor="middle" font-size="9.5" fill="#2563eb">争抢 synchronized 锁失败</text>
  <text x="358" y="182" text-anchor="middle" font-size="9.5" fill="#2563eb">wait() / join() / park()</text>
  <text x="350" y="258" text-anchor="middle" font-size="9.5" fill="#2563eb">sleep(t)/wait(t)/join(t)</text>

  <!-- 回程：等待态 -> RUNNABLE（绿色，修正：不是进 TERMINATED！） -->
  <path d="M410 78 L300 170" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#back)"/>
  <line x1="410" y1="198" x2="316" y2="205" stroke="#15803d" stroke-width="1.6" marker-end="url(#back)"/>
  <path d="M410 296 L302 218" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#back)"/>
  <text x="352" y="72" text-anchor="middle" font-size="9.5" fill="#15803d">获得监视器锁</text>
  <text x="360" y="230" text-anchor="middle" font-size="9.5" fill="#15803d">notify()/notifyAll()/unpark()</text>
  <text x="356" y="310" text-anchor="middle" font-size="9.5" fill="#15803d">超时 / 被唤醒</text>

  <!-- 图例 -->
  <rect x="20" y="372" width="640" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="32" y1="390" x2="62" y2="390" stroke="#2563eb" stroke-width="1.6" marker-end="url(#go)"/>
  <text x="70" y="394" font-size="10.5" fill="#334155">蓝：进入等待 / 走向终止</text>
  <line x1="250" y1="390" x2="280" y2="390" stroke="#15803d" stroke-width="1.6" marker-end="url(#back)"/>
  <text x="288" y="394" font-size="10.5" fill="#334155">绿：被唤醒后回到 RUNNABLE（不是 TERMINATED）</text>
  <text x="32" y="412" font-size="10.5" fill="#334155">• wait() 必须在 synchronized 块内调用且会释放锁；被 notify 后需重新竞争锁，故可能先短暂进入 BLOCKED。sleep() 不释放锁。</text>
  <text x="32" y="428" font-size="10.5" fill="#64748b">• BLOCKED 仅指等 synchronized 监视器锁；等 ReentrantLock/LockSupport 的线程处于 WAITING / TIMED_WAITING。</text>
</svg>
