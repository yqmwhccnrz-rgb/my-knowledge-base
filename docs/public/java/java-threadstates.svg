<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="360" fill="#fbfdff"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Java 线程状态（Thread.State）及转换</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- NEW -->
  <rect x="40" y="150" width="110" height="40" rx="20" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.3"/>
  <text x="95" y="170" text-anchor="middle" font-size="13" fill="#1e3a8a">NEW</text>
  <text x="95" y="186" text-anchor="middle" font-size="10" fill="#64748b">新建</text>

  <!-- RUNNABLE -->
  <rect x="200" y="150" width="130" height="40" rx="20" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="265" y="170" text-anchor="middle" font-size="13" fill="#15803d">RUNNABLE</text>
  <text x="265" y="186" text-anchor="middle" font-size="10" fill="#64748b">可运行(就绪/运行)</text>

  <!-- BLOCKED -->
  <rect x="380" y="80" width="120" height="40" rx="20" fill="#fef9c3" stroke="#a16207"/>
  <text x="440" y="100" text-anchor="middle" font-size="12.5" fill="#854d0e">BLOCKED</text>
  <text x="440" y="116" text-anchor="middle" font-size="10" fill="#64748b">阻塞(等锁)</text>

  <!-- WAITING -->
  <rect x="380" y="150" width="120" height="40" rx="20" fill="#fef9c3" stroke="#a16207"/>
  <text x="440" y="170" text-anchor="middle" font-size="12.5" fill="#854d0e">WAITING</text>
  <text x="440" y="186" text-anchor="middle" font-size="10" fill="#64748b">无限等待</text>

  <!-- TIMED_WAITING -->
  <rect x="380" y="220" width="130" height="40" rx="20" fill="#fef9c3" stroke="#a16207"/>
  <text x="445" y="240" text-anchor="middle" font-size="11.5" fill="#854d0e">TIMED_WAITING</text>
  <text x="445" y="256" text-anchor="middle" font-size="10" fill="#64748b">计时等待</text>

  <!-- TERMINATED -->
  <rect x="560" y="150" width="120" height="40" rx="20" fill="#e2e8f0" stroke="#475569"/>
  <text x="620" y="170" text-anchor="middle" font-size="13" fill="#475569">TERMINATED</text>
  <text x="620" y="186" text-anchor="middle" font-size="10" fill="#64748b">终止</text>

  <!-- arrows -->
  <line x1="150" y1="170" x2="195" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="172" y="162" text-anchor="middle" font-size="10" fill="#2563eb">start()</text>

  <line x1="330" y1="165" x2="375" y2="100" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="330" y1="170" x2="375" y2="170" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="330" y1="178" x2="375" y2="235" stroke="#2563eb" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="352" y="120" text-anchor="middle" font-size="9" fill="#2563eb">synchronized等待锁</text>
  <text x="352" y="158" text-anchor="middle" font-size="9" fill="#2563eb">wait()/join()</text>
  <text x="352" y="218" text-anchor="middle" font-size="9" fill="#2563eb">sleep(t)/wait(t)</text>

  <line x1="500" y1="100" x2="555" y2="160" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="500" y1="170" x2="555" y2="170" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="500" y1="240" x2="555" y2="178" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="528" y="135" text-anchor="middle" font-size="9" fill="#2563eb">获锁/notify</text>
  <text x="528" y="200" text-anchor="middle" font-size="9" fill="#2563eb">超时/唤醒</text>

  <line x1="265" y1="190" x2="265" y2="270" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="278" y="240" text-anchor="middle" font-size="9.5" fill="#2563eb">run() 执行完毕</text>
  <line x1="265" y1="270" x2="600" y2="195" stroke="#2563eb" stroke-width="1.2" marker-end="url(#ar)"/>

  <text x="20" y="320" font-size="12" fill="#334155">• RUNNABLE 包含操作系统层面的"就绪"与"运行"；JVM 不区分二者。</text>
  <text x="20" y="342" font-size="12" fill="#334155">• BLOCKED 仅因等待进入 synchronized 监视器锁；WAITING/TIMED_WAITING 因 Object.wait / join / LockSupport.park。</text>
</svg>
