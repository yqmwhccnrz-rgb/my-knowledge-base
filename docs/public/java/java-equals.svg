<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="440" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">equals / hashCode 契约与 HashSet 查找过程</text>

  <defs>
    <marker id="ar6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 左：契约 -->
  <text x="20" y="56" font-size="12.5" font-weight="700" fill="#334155">① equals 必须满足的 5 条性质</text>
  <rect x="20" y="66" width="310" height="126" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="30" y="88" font-size="10.5" fill="#334155">自反性   x.equals(x) 恒为 true</text>
  <text x="30" y="108" font-size="10.5" fill="#334155">对称性   x.equals(y) ⇔ y.equals(x)</text>
  <text x="30" y="128" font-size="10.5" fill="#334155">传递性   x=y 且 y=z ⇒ x=z</text>
  <text x="30" y="148" font-size="10.5" fill="#334155">一致性   比较所用字段不变则结果不变</text>
  <text x="30" y="168" font-size="10.5" fill="#334155">非空性   x.equals(null) 恒为 false</text>
  <text x="30" y="186" font-size="10" fill="#b91c1c">＋ 若 a.equals(b) 为 true，则 a.hashCode() == b.hashCode()</text>

  <!-- 正确实现 -->
  <text x="20" y="216" font-size="12.5" font-weight="700" fill="#334155">② 标准实现（同一组字段！）</text>
  <rect x="20" y="226" width="310" height="112" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="30" y="246" font-size="10" fill="#1e293b">@Override public boolean equals(Object o) {</text>
  <text x="30" y="263" font-size="10" fill="#1e293b">    if (this == o) return true;</text>
  <text x="30" y="280" font-size="10" fill="#1e293b">    if (!(o instanceof Point p)) return false;</text>
  <text x="30" y="297" font-size="10" fill="#1e293b">    return x == p.x &amp;&amp; y == p.y;</text>
  <text x="30" y="314" font-size="10" fill="#1e293b">}</text>
  <text x="30" y="331" font-size="10" fill="#1e293b">@Override public int hashCode() { return Objects.hash(x, y); }</text>

  <!-- 右：HashSet 查找 -->
  <text x="350" y="56" font-size="12.5" font-weight="700" fill="#334155">③ HashSet.contains(k) / HashMap.get(k) 的查找</text>
  <rect x="350" y="66" width="310" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="505" y="84" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Step 1  计算 k.hashCode() → 定位到某个桶</text>
  <text x="505" y="100" text-anchor="middle" font-size="9.5" fill="#64748b">哈希码不同 ⇒ 直接判定「不存在」，根本不会调用 equals</text>
  <line x1="505" y1="108" x2="505" y2="122" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="350" y="126" width="310" height="42" rx="7" fill="#f0fdf4" stroke="#15803d"/>
  <text x="505" y="144" text-anchor="middle" font-size="10.5" fill="#15803d">Step 2  桶内逐个用 equals 比较，命中才算找到</text>
  <text x="505" y="160" text-anchor="middle" font-size="9.5" fill="#64748b">先比 hash 再比 equals，是为了把 O(n) 比较压缩到同桶的少量元素</text>
  <line x1="505" y1="168" x2="505" y2="182" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="350" y="186" width="310" height="66" rx="7" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="360" y="206" font-size="10.5" font-weight="700" fill="#991b1b">反例：只重写 equals，不重写 hashCode</text>
  <text x="360" y="224" font-size="10" fill="#334155">两个「相等」对象默认哈希码来自地址 → 不同 → 落在不同桶</text>
  <text x="360" y="241" font-size="10" fill="#334155">⇒ set.contains(new Point(1,2)) 返回 false；且 Set 里能存进两个重复元素</text>

  <!-- 易错 -->
  <line x1="20" y1="352" x2="660" y2="352" stroke="#e2e8f0"/>
  <text x="20" y="374" font-size="12" font-weight="700" fill="#334155">常见错误</text>
  <text x="20" y="394" font-size="11" fill="#334155">• equals 与 hashCode 用的字段不一致；或参与比较的字段在对象放入 HashSet / 作 HashMap 键之后被修改 → 再也找不到。</text>
  <text x="20" y="412" font-size="11" fill="#334155">• 用 == 比较引用类型字段（应为 Objects.equals(a,b)）；浮点用 Double.compare；数组用 Arrays.equals / Arrays.deepEquals。</text>
  <text x="20" y="430" font-size="10.5" fill="#64748b">• getClass() 严格同类型可保对称但有继承限制；instanceof 允许子类（配合「可定义对称的等价关系」时用）。BigDecimal 用 compareTo 判数值相等。</text>
</svg>
