<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#fbfdff"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Java 异常体系（Throwable 继承层次）</text>

  <!-- Throwable -->
  <rect x="285" y="48" width="110" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="340" y="69" text-anchor="middle" font-size="13" fill="#b91c1c">Throwable</text>

  <line x1="340" y1="80" x2="160" y2="120" stroke="#b91c1c" stroke-width="1.2"/>
  <line x1="340" y1="80" x2="520" y2="120" stroke="#b91c1c" stroke-width="1.2"/>

  <!-- Error -->
  <rect x="95" y="120" width="130" height="32" rx="6" fill="#fecaca" stroke="#b91c1c"/>
  <text x="160" y="141" text-anchor="middle" font-size="13" fill="#7f1d1d">Error（错误）</text>
  <!-- Exception -->
  <rect x="455" y="120" width="130" height="32" rx="6" fill="#fecaca" stroke="#b91c1c"/>
  <text x="520" y="141" text-anchor="middle" font-size="13" fill="#7f1d1d">Exception</text>

  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#991b1b">系统级严重错误，不应捕获</text>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#991b1b">（如 OutOfMemoryError）</text>

  <line x1="520" y1="152" x2="360" y2="210" stroke="#b91c1c" stroke-width="1.1"/>
  <line x1="520" y1="152" x2="520" y2="210" stroke="#b91c1c" stroke-width="1.1"/>

  <!-- RuntimeException -->
  <rect x="295" y="210" width="130" height="32" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="360" y="231" text-anchor="middle" font-size="12.5" fill="#854d0e">RuntimeException</text>
  <!-- checked other -->
  <rect x="455" y="210" width="130" height="32" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="520" y="231" text-anchor="middle" font-size="12.5" fill="#854d0e">其他 Exception</text>

  <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#713f12">未检查(unchecked)</text>
  <text x="360" y="278" text-anchor="middle" font-size="10.5" fill="#713f12">编译器不强制处理</text>
  <text x="520" y="262" text-anchor="middle" font-size="11.5" fill="#713f12">已检查(checked)</text>
  <text x="520" y="278" text-anchor="middle" font-size="10.5" fill="#713f12">编译器强制 try/catch 或 throws</text>

  <!-- examples -->
  <line x1="360" y1="242" x2="120" y2="300" stroke="#a16207"/>
  <line x1="360" y1="242" x2="250" y2="300" stroke="#a16207"/>
  <line x1="360" y1="242" x2="380" y2="300" stroke="#a16207"/>
  <line x1="360" y1="242" x2="510" y2="300" stroke="#a16207"/>
  <rect x="40" y="300" width="160" height="26" rx="5" fill="#fffbeb" stroke="#a16207"/>
  <text x="120" y="317" text-anchor="middle" font-size="11" fill="#713f12">NullPointerException</text>
  <rect x="180" y="300" width="150" height="26" rx="5" fill="#fffbeb" stroke="#a16207"/>
  <text x="255" y="317" text-anchor="middle" font-size="11" fill="#713f12">IndexOutOfBounds</text>
  <rect x="330" y="300" width="150" height="26" rx="5" fill="#fffbeb" stroke="#a16207"/>
  <text x="405" y="317" text-anchor="middle" font-size="11" fill="#713f12">ClassCastException</text>
  <rect x="480" y="300" width="160" height="26" rx="5" fill="#fffbeb" stroke="#a16207"/>
  <text x="560" y="317" text-anchor="middle" font-size="11" fill="#713f12">ArithmeticException</text>

  <line x1="520" y1="242" x2="520" y2="300" stroke="#a16207"/>
  <rect x="455" y="300" width="130" height="26" rx="5" fill="#fffbeb" stroke="#a16207"/>
  <text x="520" y="317" text-anchor="middle" font-size="11" fill="#713f12">IOException</text>

  <text x="20" y="360" font-size="12" fill="#334155">• 捕获顺序：子类异常必须写在父类（Exception）之前，否则编译报错。</text>
  <text x="20" y="382" font-size="12" fill="#334155">• try-with-resources：实现 AutoCloseable 的资源自动关闭，无需显式 finally。</text>
  <text x="20" y="404" font-size="12" fill="#334155">• 异常也是对象，可带 message / cause（异常链），自定义异常应继承 Exception 或 RuntimeException。</text>
</svg>
