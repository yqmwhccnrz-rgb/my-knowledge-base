<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Java 异常体系（Throwable 继承层次）</text>

  <!-- Throwable -->
  <rect x="275" y="46" width="130" height="32" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="340" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Throwable</text>
  <text x="340" y="92" text-anchor="middle" font-size="10.5" fill="#7f1d1d">只有 Throwable 及其子类才能被 throw / catch</text>

  <!-- 两分支 -->
  <line x1="340" y1="78" x2="170" y2="118" stroke="#b91c1c" stroke-width="1.2"/>
  <line x1="340" y1="78" x2="510" y2="118" stroke="#b91c1c" stroke-width="1.2"/>

  <!-- Error -->
  <rect x="105" y="118" width="130" height="32" rx="6" fill="#fecaca" stroke="#b91c1c"/>
  <text x="170" y="139" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Error（错误）</text>
  <text x="170" y="168" text-anchor="middle" font-size="10.5" fill="#991b1b">系统级严重错误 · 不应捕获</text>

  <!-- Exception -->
  <rect x="445" y="118" width="130" height="32" rx="6" fill="#fecaca" stroke="#b91c1c"/>
  <text x="510" y="139" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Exception（异常）</text>
  <text x="510" y="168" text-anchor="middle" font-size="10.5" fill="#991b1b">程序可处理 · 分 checked / unchecked</text>

  <!-- Exception 两个子类 -->
  <line x1="510" y1="150" x2="360" y2="196" stroke="#b91c1c" stroke-width="1.1"/>
  <line x1="510" y1="150" x2="565" y2="196" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="290" y="196" width="140" height="30" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="360" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">RuntimeException</text>
  <rect x="495" y="196" width="140" height="30" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="565" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">其他 Exception</text>

  <text x="360" y="242" text-anchor="middle" font-size="10.5" fill="#713f12">未检查 unchecked · 编译器不强制处理</text>
  <text x="565" y="242" text-anchor="middle" font-size="10.5" fill="#713f12">已检查 checked · 强制 catch 或 throws</text>

  <!-- 左栏 unchecked 示例 -->
  <rect x="20" y="256" width="315" height="132" rx="8" fill="#ffffff" stroke="#a16207"/>
  <rect x="20" y="256" width="315" height="26" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="32" y="274" font-size="11.5" font-weight="700" fill="#854d0e">unchecked 常见子类（改代码来避免）</text>
  <text x="32" y="300" font-size="11" fill="#334155">• NullPointerException            空引用调用</text>
  <text x="32" y="320" font-size="11" fill="#334155">• IndexOutOfBoundsException    下标越界</text>
  <text x="32" y="340" font-size="11" fill="#334155">• ClassCastException              错误的强转</text>
  <text x="32" y="360" font-size="11" fill="#334155">• ArithmeticException            整数除零</text>
  <text x="32" y="380" font-size="11" fill="#334155">• IllegalArgumentException       非法实参</text>

  <!-- 右栏 checked 示例 -->
  <rect x="345" y="256" width="315" height="132" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <rect x="345" y="256" width="315" height="26" rx="8" fill="#cffafe" stroke="#0891b2"/>
  <text x="357" y="274" font-size="11.5" font-weight="700" fill="#155e75">checked 常见子类（必须显式处理）</text>
  <text x="357" y="300" font-size="11" fill="#334155">• IOException / FileNotFoundException   文件 IO</text>
  <text x="357" y="320" font-size="11" fill="#334155">• SQLException                          数据库访问</text>
  <text x="357" y="340" font-size="11" fill="#334155">• ClassNotFoundException               反射加载类</text>
  <text x="357" y="360" font-size="11" fill="#334155">• InterruptedException                  线程被中断</text>
  <text x="357" y="380" font-size="11" fill="#334155">• ParseException                        格式解析</text>

  <!-- Error 示例 -->
  <rect x="20" y="196" width="240" height="30" rx="5" fill="#fff1f2" stroke="#fda4af"/>
  <text x="30" y="215" font-size="10.5" fill="#9f1239">Error 例：OutOfMemoryError / StackOverflowError</text>
  <line x1="170" y1="150" x2="140" y2="196" stroke="#b91c1c" stroke-width="1"/>

  <!-- 要点 -->
  <text x="20" y="412" font-size="11.5" fill="#334155">• 捕获顺序：子类在前、父类在后；先写 catch(Exception) 会使其后的子类 catch 编译报错（不可达）。</text>
  <text x="20" y="432" font-size="11.5" fill="#334155">• finally 总会执行（除非 JVM 退出）；但若 finally 里 return，会覆盖 try/catch 的返回值 —— 不要在 finally 中 return。</text>
  <text x="20" y="452" font-size="11.5" fill="#334155">• try-with-resources：实现 AutoCloseable 的资源按声明的逆序自动关闭，异常可用 getSuppressed() 取回。</text>
</svg>
