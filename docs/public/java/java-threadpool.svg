<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="470" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">ThreadPoolExecutor：7 个参数与任务执行流程</text>

  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 7 参数 -->
  <text x="20" y="56" font-size="12.5" font-weight="700" fill="#334155">① 构造参数（建议显式 new，不要用 Executors 的无界队列工厂）</text>
  <rect x="20" y="66" width="640" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="30" y="86" font-size="10.5" fill="#1e293b">new ThreadPoolExecutor(</text>
  <text x="30" y="104" font-size="10.5" fill="#1e293b">    corePoolSize, maximumPoolSize, keepAliveTime, TimeUnit.SECONDS,   // 核心数 / 最大数 / 空闲存活 / 时间单位</text>
  <text x="30" y="122" font-size="10.5" fill="#1e293b">    new ArrayBlockingQueue&lt;&gt;(200),                                   // workQueue：有界队列</text>
  <text x="30" y="140" font-size="10.5" fill="#1e293b">    Executors.defaultThreadFactory(), new ThreadPoolExecutor.CallerRunsPolicy());  // 线程工厂 / 拒绝策略</text>
  <text x="30" y="154" font-size="10" fill="#64748b">核心线程默认不回收（除非 allowCoreThreadTimeOut(true)）；非核心线程空闲超过 keepAliveTime 才被回收。</text>

  <!-- 执行流程 -->
  <text x="20" y="186" font-size="12.5" font-weight="700" fill="#334155">② submit / execute 后的判断顺序（重点：先入队，再扩到最大线程数）</text>

  <rect x="20" y="196" width="116" height="42" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="78" y="214" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">提交任务</text>
  <text x="78" y="230" text-anchor="middle" font-size="9.5" fill="#64748b">execute(Runnable)</text>
  <line x1="136" y1="217" x2="154" y2="217" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="158" y="196" width="128" height="42" rx="7" fill="#ffffff" stroke="#7c3aed"/>
  <text x="222" y="214" text-anchor="middle" font-size="10.5" fill="#5b21b6">① 核心线程未满？</text>
  <text x="222" y="230" text-anchor="middle" font-size="9.5" fill="#64748b">是 → 新建核心线程执行</text>
  <line x1="286" y1="217" x2="304" y2="217" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="308" y="196" width="128" height="42" rx="7" fill="#ffffff" stroke="#7c3aed"/>
  <text x="372" y="214" text-anchor="middle" font-size="10.5" fill="#5b21b6">② 队列未满？</text>
  <text x="372" y="230" text-anchor="middle" font-size="9.5" fill="#64748b">是 → 入队等待</text>
  <line x1="436" y1="217" x2="454" y2="217" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar5)"/>

  <rect x="458" y="196" width="128" height="42" rx="7" fill="#ffffff" stroke="#7c3aed"/>
  <text x="522" y="214" text-anchor="middle" font-size="10.5" fill="#5b21b6">③ 线程数 &lt; maximum？</text>
  <text x="522" y="230" text-anchor="middle" font-size="9.5" fill="#64748b">是 → 建临时线程执行</text>
  <line x1="586" y1="217" x2="604" y2="217" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#ar5)"/>
  <rect x="606" y="196" width="54" height="42" rx="7" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="633" y="214" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">④ 拒绝</text>
  <text x="633" y="230" text-anchor="middle" font-size="9" fill="#991b1b">handler</text>

  <text x="20" y="258" font-size="10.5" fill="#334155">• 使用无界队列时 maximumPoolSize 几乎不生效（永远走不到第 ③ 步），任务会无限堆积 → OOM。所以要有界队列 + 明确拒绝策略。</text>

  <!-- 拒绝策略 -->
  <text x="20" y="284" font-size="12.5" font-weight="700" fill="#334155">③ 四种内置拒绝策略（RejectedExecutionHandler）</text>
  <rect x="20" y="294" width="155" height="56" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="30" y="313" font-size="10.5" font-weight="700" fill="#991b1b">AbortPolicy（默认）</text>
  <text x="30" y="330" font-size="10" fill="#334155">抛 RejectedExecution-</text>
  <text x="30" y="345" font-size="10" fill="#334155">Exception，让调用方感知</text>

  <rect x="183" y="294" width="155" height="56" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="193" y="313" font-size="10.5" font-weight="700" fill="#92400e">CallerRunsPolicy</text>
  <text x="193" y="330" font-size="10" fill="#334155">由提交任务的线程自己</text>
  <text x="193" y="345" font-size="10" fill="#334155">执行，天然限流</text>

  <rect x="346" y="294" width="155" height="56" rx="6" fill="#ffffff" stroke="#0891b2"/>
  <text x="356" y="313" font-size="10.5" font-weight="700" fill="#155e75">DiscardPolicy</text>
  <text x="356" y="330" font-size="10" fill="#334155">静默丢弃任务，</text>
  <text x="356" y="345" font-size="10" fill="#334155">不抛异常（易丢数据）</text>

  <rect x="509" y="294" width="151" height="56" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="519" y="313" font-size="10.5" font-weight="700" fill="#5b21b6">DiscardOldestPolicy</text>
  <text x="519" y="330" font-size="10" fill="#334155">丢队列里最老的任务，</text>
  <text x="519" y="345" font-size="10" fill="#334155">再重试提交</text>

  <!-- 补充 -->
  <line x1="20" y1="362" x2="660" y2="362" stroke="#e2e8f0"/>
  <text x="20" y="382" font-size="11" fill="#334155">• 提交方式：execute(Runnable) 无返回、异常直接抛给未捕获处理器；submit(Callable/Runnable) 返回 Future，异常被装进 Future，只有 get() 时才抛出 ExecutionException。</text>
  <text x="20" y="400" font-size="11" fill="#334155">• 关闭：shutdown() 温和（跑完队列再停）、shutdownNow() 立即中断并返回未执行任务列表；awaitTermination 可等待收尾。</text>
  <text x="20" y="418" font-size="11" fill="#334155">• Executors 工厂的坑：newFixedThreadPool / newSingleThreadExecutor 用无界 LinkedBlockingQueue；newCachedThreadPool 最大线程数近乎无限，都可能 OOM。</text>
  <text x="20" y="438" font-size="10.5" fill="#64748b">• 相关：Future.get() 会阻塞；CompletableFuture 支持 thenApply/thenCompose/allOf 组合异步；ForkJoinPool 适合分治型 CPU 密集任务（也是 parallelStream 的默认池）。</text>
</svg>
