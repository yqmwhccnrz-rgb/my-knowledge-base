<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="460" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">泛型：类型擦除、桥方法与 PECS 通配符</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 上半：擦除 -->
  <text x="20" y="58" font-size="13" font-weight="700" fill="#334155">① 编译期泛型 → 运行期擦除（JVM 里没有泛型）</text>

  <rect x="20" y="70" width="196" height="112" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="30" y="90" font-size="11" font-weight="700" fill="#1e3a8a">源码（.java）</text>
  <text x="30" y="112" font-size="10.5" fill="#1e293b">class Box&lt;T extends Number&gt; {</text>
  <text x="30" y="130" font-size="10.5" fill="#1e293b">  private T value;</text>
  <text x="30" y="148" font-size="10.5" fill="#1e293b">  T get() { return value; }</text>
  <text x="30" y="166" font-size="10.5" fill="#1e293b">}</text>

  <line x1="220" y1="126" x2="248" y2="126" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar2)"/>
  <text x="234" y="116" text-anchor="middle" font-size="9.5" fill="#2563eb">javac</text>

  <rect x="252" y="70" width="196" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="262" y="90" font-size="11" font-weight="700" fill="#15803d">字节码（擦除后）</text>
  <text x="262" y="112" font-size="10.5" fill="#1e293b">class Box {</text>
  <text x="262" y="130" font-size="10.5" fill="#1e293b">  private Number value;   // 取第一个 bound</text>
  <text x="262" y="148" font-size="10.5" fill="#1e293b">  Number get() { ... }</text>
  <text x="262" y="166" font-size="10.5" fill="#1e293b">}</text>

  <line x1="452" y1="126" x2="478" y2="126" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar2)"/>

  <rect x="482" y="70" width="178" height="112" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="492" y="90" font-size="11" font-weight="700" fill="#92400e">调用处自动补强转</text>
  <text x="492" y="112" font-size="10.5" fill="#1e293b">Box&lt;Integer&gt; b = ...;</text>
  <text x="492" y="130" font-size="10.5" fill="#1e293b">Integer x = b.get();</text>
  <text x="492" y="150" font-size="10.5" fill="#1e293b">// 编译器插入</text>
  <text x="492" y="168" font-size="10.5" fill="#1e293b">checkcast Integer</text>

  <text x="20" y="204" font-size="11" fill="#334155">• 无界 T → Object；有界 T extends A &amp; B → 第一个 bound A（故应把最重要的接口放前面）。</text>
  <text x="20" y="222" font-size="11" fill="#334155">• 覆盖泛型父类方法时，擦除后签名不一致 → 编译器生成<tspan font-weight="700">桥方法</tspan>（bridge）转发并强转，维持多态。</text>
  <text x="20" y="240" font-size="11" fill="#334155">• 因此运行时 List&lt;String&gt; 与 List&lt;Integer&gt; 都是同一个 List.class，无法用 instanceof 区分泛型参数。</text>

  <!-- 下半：PECS -->
  <line x1="20" y1="254" x2="660" y2="254" stroke="#e2e8f0"/>
  <text x="20" y="278" font-size="13" font-weight="700" fill="#334155">② 通配符与 PECS（Producer Extends, Consumer Super）</text>

  <rect x="20" y="290" width="310" height="106" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <rect x="20" y="290" width="310" height="26" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="32" y="308" font-size="11.5" font-weight="700" fill="#5b21b6">? extends Number  — 生产者 / 只读</text>
  <text x="32" y="334" font-size="10.5" fill="#334155">void f(List&lt;? extends Number&gt; src) {</text>
  <text x="32" y="352" font-size="10.5" fill="#15803d">  Number n = src.get(0);   // ✔ 读，返回 Number</text>
  <text x="32" y="370" font-size="10.5" fill="#b91c1c">  src.add(1);              // ✘ 写，具体子类型未知</text>
  <text x="32" y="388" font-size="10.5" fill="#334155">}   可接收 List&lt;Integer&gt; / List&lt;Double&gt;</text>

  <rect x="350" y="290" width="310" height="106" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <rect x="350" y="290" width="310" height="26" rx="8" fill="#cffafe" stroke="#0891b2"/>
  <text x="362" y="308" font-size="11.5" font-weight="700" fill="#155e75">? super Integer  — 消费者 / 只写</text>
  <text x="362" y="334" font-size="10.5" fill="#334155">void g(List&lt;? super Integer&gt; dst) {</text>
  <text x="362" y="352" font-size="10.5" fill="#15803d">  dst.add(1);              // ✔ 写 Integer 及其子类</text>
  <text x="362" y="370" font-size="10.5" fill="#b45309">  Object o = dst.get(0);   // △ 读只剩 Object</text>
  <text x="362" y="388" font-size="10.5" fill="#334155">}   可接收 List&lt;Number&gt; / List&lt;Object&gt;</text>

  <text x="20" y="420" font-size="11.5" fill="#334155">• 记忆：从集合<tspan font-weight="700">取数据</tspan>用 extends，往集合<tspan font-weight="700">放数据</tspan>用 super；既读又写就用精确类型 T，别用通配符。</text>
  <text x="20" y="440" font-size="11" fill="#64748b">• 典型应用：Collections.copy(dest, src) 签名中 src 是 &lt;? extends T&gt;，dest 是 &lt;? super T&gt;。</text>
</svg>
