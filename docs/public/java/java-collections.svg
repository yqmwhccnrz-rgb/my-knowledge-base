<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="480" fill="#fbfdff"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Java 集合框架（Java Collections Framework）继承层次</text>

  <!-- Iterable -->
  <rect x="285" y="48" width="110" height="30" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#1e3a8a">«interface» Iterable</text>

  <!-- Collection -->
  <rect x="285" y="100" width="110" height="30" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.2"/>
  <text x="340" y="120" text-anchor="middle" font-size="13" fill="#1e3a8a">«interface» Collection</text>
  <line x1="340" y1="78" x2="340" y2="100" stroke="#1e3a8a" stroke-width="1.2"/>

  <!-- Map (separate root) -->
  <rect x="525" y="100" width="120" height="30" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="585" y="120" text-anchor="middle" font-size="13" fill="#b45309">«interface» Map</text>

  <!-- three branches -->
  <line x1="340" y1="130" x2="120" y2="160" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="340" y1="130" x2="340" y2="160" stroke="#1e3a8a" stroke-width="1"/>
  <line x1="340" y1="130" x2="560" y2="160" stroke="#1e3a8a" stroke-width="1"/>

  <!-- List -->
  <rect x="65" y="160" width="110" height="30" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="120" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a">«interface» List</text>
  <!-- Set -->
  <rect x="285" y="160" width="110" height="30" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="340" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a">«interface» Set</text>
  <!-- Queue -->
  <rect x="505" y="160" width="110" height="30" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
  <text x="560" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a">«interface» Queue</text>

  <!-- List impls -->
  <line x1="120" y1="190" x2="60" y2="220" stroke="#2563eb"/>
  <line x1="120" y1="190" x2="180" y2="220" stroke="#2563eb"/>
  <rect x="10" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="60" y="238" text-anchor="middle" font-size="12" fill="#1e293b">ArrayList</text>
  <rect x="130" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="180" y="238" text-anchor="middle" font-size="12" fill="#1e293b">LinkedList</text>

  <!-- Set impls -->
  <line x1="340" y1="190" x2="280" y2="220" stroke="#2563eb"/>
  <line x1="340" y1="190" x2="400" y2="220" stroke="#2563eb"/>
  <rect x="230" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#1e293b">HashSet</text>
  <rect x="350" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="400" y="238" text-anchor="middle" font-size="12" fill="#1e293b">TreeSet</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">LinkedHashSet 继承 HashSet</text>

  <!-- Queue impls -->
  <line x1="560" y1="190" x2="500" y2="220" stroke="#2563eb"/>
  <line x1="560" y1="190" x2="620" y2="220" stroke="#2563eb"/>
  <rect x="450" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="500" y="238" text-anchor="middle" font-size="12" fill="#1e293b">ArrayDeque</text>
  <rect x="570" y="220" width="100" height="28" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="620" y="238" text-anchor="middle" font-size="12" fill="#1e293b">PriorityQueue</text>

  <!-- Map impls -->
  <line x1="585" y1="130" x2="540" y2="160" stroke="#b45309"/>
  <line x1="585" y1="130" x2="630" y2="160" stroke="#b45309"/>
  <rect x="480" y="220" width="100" height="28" rx="5" fill="#fffbeb" stroke="#b45309"/>
  <text x="530" y="238" text-anchor="middle" font-size="12" fill="#92400e">HashMap</text>
  <rect x="600" y="220" width="100" height="28" rx="5" fill="#fffbeb" stroke="#b45309"/>
  <text x="650" y="238" text-anchor="middle" font-size="12" fill="#92400e">TreeMap</text>
  <text x="530" y="262" text-anchor="middle" font-size="10.5" fill="#92400e">LinkedHashMap 继承 HashMap</text>
  <rect x="600" y="262" width="100" height="24" rx="5" fill="#fffbeb" stroke="#b45309" stroke-dasharray="3 2"/>
  <text x="650" y="278" text-anchor="middle" font-size="11" fill="#92400e">Hashtable(遗留,线程安全)</text>

  <!-- notes -->
  <text x="20" y="320" font-size="12.5" fill="#334155">要点：</text>
  <text x="20" y="342" font-size="12" fill="#334155">• Collection 与 Map 是两大根接口；Collection 继承 Iterable，可用增强 for / 迭代器遍历。</text>
  <text x="20" y="364" font-size="12" fill="#334155">• List 有序可重复（ArrayList 数组实现、随机访问快；LinkedList 链表、插入删除快）。</text>
  <text x="20" y="386" font-size="12" fill="#334155">• Set 无序不重复：HashSet 哈希( O(1) )、TreeSet 红黑树(有序 O(log n))。</text>
  <text x="20" y="408" font-size="12" fill="#334155">• Queue/Deque：ArrayDeque 双端队列，PriorityQueue 优先级堆。</text>
  <text x="20" y="430" font-size="12" fill="#334155">• Map 键值对：HashMap 哈希、TreeMap 红黑树有序；Hashtable 线程安全但已过时。</text>
  <text x="20" y="456" font-size="11.5" fill="#64748b">注：除遗留类（Vector/Hashtable/Stack）外，现代集合均非线程安全，并发用 java.util.concurrent。</text>
</svg>
