<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">加法器、ALU 与补码加减运算</text>

  <!-- 全加器 -->
  <rect x="16" y="44" width="210" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="64" font-size="11" font-weight="700" fill="#334155">① 一位全加器 FA</text>
  <text x="28" y="86" font-size="10" fill="#1e293b">输入 A, B, C_in（低位进位）</text>
  <text x="28" y="106" font-size="10" fill="#1e293b">S = A ⊕ B ⊕ C_in</text>
  <text x="28" y="126" font-size="10" fill="#1e293b">C_out = A·B + (A⊕B)·C_in</text>
  <text x="28" y="150" font-size="9.5" fill="#64748b">记 G = A·B（进位生成）</text>
  <text x="28" y="168" font-size="9.5" fill="#64748b">　 P = A⊕B（进位传递）</text>
  <text x="28" y="190" font-size="9.5" fill="#64748b">则 C_out = G + P·C_in</text>

  <!-- 进位链 -->
  <rect x="236" y="44" width="210" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="248" y="64" font-size="11" font-weight="700" fill="#334155">② 进位方式</text>
  <text x="248" y="86" font-size="10" font-weight="700" fill="#1e3a8a">行波进位 RCA</text>
  <text x="248" y="104" font-size="9.5" fill="#1e293b">C_i = G_i + P_i·C_(i−1)，逐级串行</text>
  <text x="248" y="122" font-size="9.5" fill="#1e293b">n 位时延 ∝ n（最坏等全部进位）</text>
  <text x="248" y="144" font-size="10" font-weight="700" fill="#15803d">先行进位 CLA</text>
  <text x="248" y="162" font-size="9.5" fill="#1e293b">把 C_i 展开为 G/P 的与或式，</text>
  <text x="248" y="180" font-size="9.5" fill="#1e293b">各级进位并行产生，时延 ∝ log n</text>
  <text x="248" y="198" font-size="9.5" fill="#64748b">成组先行进位可折中面积与速度</text>

  <!-- 溢出判断 -->
  <rect x="456" y="44" width="208" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="468" y="64" font-size="11" font-weight="700" fill="#334155">③ 溢出判断</text>
  <text x="468" y="86" font-size="9.5" fill="#1e293b">方法一：最高数值位进位 C_(n−1)</text>
  <text x="468" y="104" font-size="9.5" fill="#1e293b">与符号位进位 C_n 相异或，</text>
  <text x="468" y="122" font-size="9.5" fill="#1e293b">OV = C_n ⊕ C_(n−1) = 1 溢出</text>
  <text x="468" y="144" font-size="9.5" fill="#1e293b">方法二：双符号位（变形补码）</text>
  <text x="468" y="162" font-size="9.5" fill="#1e293b">00/11 正常，01 正溢出，10 负溢出</text>
  <text x="468" y="184" font-size="9.5" fill="#64748b">无符号数溢出看最高位进位 C_n = 1</text>

  <!-- 补码运算 -->
  <rect x="16" y="218" width="648" height="88" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="28" y="238" font-size="11.5" font-weight="700" fill="#1e3a8a">④ 补码加减运算公式</text>
  <text x="28" y="260" font-size="11" fill="#1e293b">[X + Y]补 = [X]补 + [Y]补　　[X − Y]补 = [X]补 + [−Y]补（[−Y]补 = [Y]补 连同符号位按位取反、末位加 1）</text>
  <text x="28" y="282" font-size="10.5" fill="#1e293b">符号位与数值位一起参加运算，进位自然丢弃；只要结果不溢出，符号位就是正确的运算结果符号。</text>

  <!-- 工作示例 -->
  <rect x="16" y="316" width="648" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="336" font-size="11" font-weight="700" fill="#334155">工作示例 · 8 位补码</text>
  <text x="28" y="355" font-size="10" fill="#1e293b">X=+9 → 0000 1001；Y=+5 → 0000 0101；X−Y = 0000 1001 + 1111 1011 = 1 0000 0100 → 丢进位得 0000 0100 = +4 ✓</text>
  <text x="28" y="374" font-size="10" fill="#1e293b">X=+120 → 0111 1000；Y=+10 → 0000 1010；相加 = 1000 0010 = −126（应为 +130）→ 正溢出（C_n=0, C_(n−1)=1）</text>
  <text x="28" y="391" font-size="9.5" fill="#64748b">ALU 在加法器基础上加入与/或/非/异或、移位、比较等逻辑，由操作控制线选择功能，并输出 N/Z/C/V 标志位。</text>
</svg>
