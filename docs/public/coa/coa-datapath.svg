<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">CPU 数据通路与控制器（单周期 / 多周期）</text>

  <defs>
    <marker id="dp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 数据通路 -->
  <text x="20" y="52" font-size="11.5" font-weight="700" fill="#334155">① 典型单周期数据通路（R 型 / Load / Store / Branch 共用）</text>
  <rect x="20" y="66" width="86" height="38" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="63" y="90" text-anchor="middle" font-size="10" fill="#1e3a8a">PC 程序计数器</text>
  <line x1="106" y1="85" x2="132" y2="85" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dp)"/>
  <rect x="134" y="66" width="100" height="38" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="184" y="84" text-anchor="middle" font-size="9.5" fill="#1e3a8a">指令存储器</text>
  <text x="184" y="98" text-anchor="middle" font-size="9" fill="#1e3a8a">IF 取指</text>
  <line x1="234" y1="85" x2="260" y2="85" stroke="#2563eb" stroke-width="1.5" marker-end="url(#dp)"/>
  <rect x="262" y="66" width="108" height="38" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="316" y="84" text-anchor="middle" font-size="9.5" fill="#92400e">译码 / 寄存器堆</text>
  <text x="316" y="98" text-anchor="middle" font-size="9" fill="#92400e">ID 读寄存器</text>
  <line x1="370" y1="85" x2="396" y2="85" stroke="#b45309" stroke-width="1.5" marker-end="url(#dp)"/>
  <rect x="398" y="66" width="94" height="38" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="445" y="84" text-anchor="middle" font-size="9.5" fill="#14532d">ALU 运算</text>
  <text x="445" y="98" text-anchor="middle" font-size="9" fill="#14532d">EX 执行 / 算地址</text>
  <line x1="492" y1="85" x2="518" y2="85" stroke="#15803d" stroke-width="1.5" marker-end="url(#dp)"/>
  <rect x="520" y="66" width="100" height="38" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="570" y="84" text-anchor="middle" font-size="9.5" fill="#5b21b6">数据存储器</text>
  <text x="570" y="98" text-anchor="middle" font-size="9" fill="#5b21b6">MEM 访存</text>
  <text x="626" y="88" font-size="9" fill="#64748b">→ WB 写回</text>

  <text x="20" y="126" font-size="9.5" fill="#64748b">PC → 取指 → 译码读寄存器 → ALU（运算 / 计算有效地址 / 比较分支）→ 访存 → 结果写回寄存器堆；PC 每拍 +4，或由分支目标改写。</text>

  <!-- 控制信号 -->
  <rect x="16" y="140" width="648" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="160" font-size="11" font-weight="700" fill="#334155">② 主要控制信号（控制器依据 OP 译码产生）</text>
  <text x="28" y="180" font-size="9.5" fill="#1e293b">RegDst：写回目标选 rt 还是 rd　｜　ALUSrc：ALU 第二操作数选寄存器还是立即数（符号扩展）</text>
  <text x="28" y="198" font-size="9.5" fill="#1e293b">ALUOp/ALUControl：决定 ALU 做加/减/与/或/比较　｜　MemRead / MemWrite：数据存储器读写使能</text>
  <text x="28" y="216" font-size="9.5" fill="#1e293b">MemtoReg：写回数据来自 ALU 结果还是存储器　｜　RegWrite：寄存器堆写使能</text>
  <text x="28" y="234" font-size="9.5" fill="#1e293b">Branch / PCSrc：分支条件成立时 PC ← 分支目标（由 Zero 标志与 Branch 相与得到）</text>

  <!-- 单周期 vs 多周期 -->
  <rect x="16" y="254" width="318" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="28" y="274" font-size="11" font-weight="700" fill="#1e3a8a">③ 单周期处理器</text>
  <text x="28" y="293" font-size="9.5" fill="#1e293b">一条指令在<tspan font-weight="700">一个</tspan>时钟周期内完成；</text>
  <text x="28" y="310" font-size="9.5" fill="#1e293b">时钟周期必须按<tspan font-weight="700">最慢指令</tspan>（通常是 Load）定；</text>
  <text x="28" y="327" font-size="9.5" fill="#1e293b">CPI = 1，但主频被拉低、硬件资源不能复用。</text>
  <text x="28" y="344" font-size="9.5" fill="#64748b">需要独立的指令存储器与数据存储器（避免结构冲突）。</text>

  <rect x="346" y="254" width="318" height="96" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="358" y="274" font-size="11" font-weight="700" fill="#15803d">④ 多周期 / 硬连线 / 微程序</text>
  <text x="358" y="293" font-size="9.5" fill="#1e293b">把一条指令拆成多个节拍，部件分时复用；</text>
  <text x="358" y="310" font-size="9.5" fill="#1e293b">CPI &gt; 1 但时钟周期短，整体更快；</text>
  <text x="358" y="327" font-size="9.5" fill="#1e293b">硬连线控制器：组合逻辑 + 状态机，快但难改；</text>
  <text x="358" y="344" font-size="9.5" fill="#64748b">微程序控制器：微指令存控制存储器，规整易改、较慢。</text>

  <text x="16" y="370" font-size="10" fill="#334155">⑤ 异常与中断：保存 PC（EPC）→ 置 Cause → 切换到内核态并跳转到异常向量 → 服务程序 → 恢复现场返回。</text>
  <text x="16" y="390" font-size="10" fill="#334155">精确异常要求：发生异常的指令之前的指令全部完成、之后的指令不得产生副作用（流水线设计的重要约束）。</text>
  <text x="16" y="408" font-size="9.5" fill="#64748b">补充：现代 CPU 在此基础上加入乱序执行、重命名寄存器、重排序缓冲 ROB、分支预测与多发射，但 ISA 层看到的仍是顺序执行语义。</text>
</svg>
