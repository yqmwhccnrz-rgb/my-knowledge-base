<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="410" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">浮点数加减运算：五步流程与对阶示例</text>

  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 五步 -->
  <rect x="16" y="44" width="126" height="72" rx="7" fill="#dbeafe" stroke="#2563eb"/>
  <text x="79" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">① 对阶</text>
  <text x="79" y="86" text-anchor="middle" font-size="9.5" fill="#1e3a8a">小阶向大阶看齐</text>
  <text x="79" y="103" text-anchor="middle" font-size="9.5" fill="#1e3a8a">尾数右移 ΔE 位</text>
  <line x1="142" y1="80" x2="158" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#fa)"/>

  <rect x="160" y="44" width="126" height="72" rx="7" fill="#dcfce7" stroke="#15803d"/>
  <text x="223" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">② 尾数加减</text>
  <text x="223" y="86" text-anchor="middle" font-size="9.5" fill="#14532d">按补码做加/减</text>
  <text x="223" y="103" text-anchor="middle" font-size="9.5" fill="#14532d">保留保护位 G/R/S</text>
  <line x1="286" y1="80" x2="302" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#fa)"/>

  <rect x="304" y="44" width="126" height="72" rx="7" fill="#fef3c7" stroke="#b45309"/>
  <text x="367" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">③ 规格化</text>
  <text x="367" y="86" text-anchor="middle" font-size="9.5" fill="#78350f">左规 / 右规，</text>
  <text x="367" y="103" text-anchor="middle" font-size="9.5" fill="#78350f">同步调整阶码</text>
  <line x1="430" y1="80" x2="446" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#fa)"/>

  <rect x="448" y="44" width="102" height="72" rx="7" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="499" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">④ 舍入</text>
  <text x="499" y="86" text-anchor="middle" font-size="9.5" fill="#4c1d95">就近 / 向零</text>
  <text x="499" y="103" text-anchor="middle" font-size="9.5" fill="#4c1d95">/ 向 ±∞</text>
  <line x1="550" y1="80" x2="566" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#fa)"/>

  <rect x="568" y="44" width="96" height="72" rx="7" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="616" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">⑤ 判溢出</text>
  <text x="616" y="86" text-anchor="middle" font-size="9.5" fill="#7f1d1d">阶码上溢 → ∞</text>
  <text x="616" y="103" text-anchor="middle" font-size="9.5" fill="#7f1d1d">下溢 → 0/非规格化</text>

  <text x="16" y="136" font-size="10" fill="#64748b">注：尾数右移时阶码增大；丢失的低位用 G（保护位）、R（舍入位）、S（粘滞位）保留，保证舍入精度。</text>

  <!-- 工作示例 -->
  <rect x="16" y="150" width="648" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="170" font-size="11.5" font-weight="700" fill="#334155">工作示例 · X = 1.0 × 2³，Y = 1.0 × 2¹，求 X + Y（尾数用 4 位二进制补码示意）</text>
  <text x="28" y="192" font-size="10" fill="#1e293b">① 对阶：ΔE = E_X − E_Y = 3 − 1 = 2，Y 的尾数右移 2 位 → 0.0100 × 2³（小阶向大阶看齐）</text>
  <text x="28" y="212" font-size="10" fill="#1e293b">② 尾数相加：1.0000 + 0.0100 = 1.0100（× 2³）</text>
  <text x="28" y="232" font-size="10" fill="#1e293b">③ 规格化：已是 1.M 形式（最高数值位为 1），无需左规/右规</text>
  <text x="28" y="252" font-size="10" fill="#1e293b">④ 舍入：本例无额外低位，无舍入误差；⑤ 阶码 3 未超出表示范围，无溢出</text>
  <text x="28" y="274" font-size="10.5" font-weight="700" fill="#15803d">结果 = 1.01₂ × 2³ = 1.25 × 8 = 10（十进制验证：8 + 2 = 10 ✓）</text>
  <text x="28" y="292" font-size="9.5" fill="#64748b">若尾数出现 01.xxx 或 10.xxx（双符号位）需右规；出现 00.0xxx / 11.1xxx 需左规，并相应 ±1 阶码。</text>

  <!-- 底部 -->
  <rect x="16" y="312" width="648" height="84" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="332" font-size="11" font-weight="700" fill="#334155">浮点乘除与运算精度</text>
  <text x="28" y="351" font-size="10" fill="#1e293b">• 乘法：阶码相加（减 bias）、尾数相乘；除法：阶码相减（加 bias）、尾数相除；之后同样要规格化、舍入、判溢出。</text>
  <text x="28" y="369" font-size="10" fill="#1e293b">• 浮点运算<tspan font-weight="700">不满足结合律</tspan>：(a+b)+c 与 a+(b+c) 可能不同；对阶右移会丢失小数的低位精度。</text>
  <text x="28" y="387" font-size="10" fill="#64748b">• IEEE 754 默认舍入为「就近偶数」；另有向零、向 +∞、向 −∞ 三种定向舍入，用于区间运算。</text>
</svg>
