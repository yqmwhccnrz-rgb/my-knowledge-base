<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="430" fill="#fbfdff"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">数据的机器级表示：机器码与 IEEE 754</text>

  <!-- 左：4 种机器码 -->
  <rect x="16" y="44" width="318" height="216" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="28" y="64" font-size="11.5" font-weight="700" fill="#334155">① 8 位机器码对照（以真值 −5 为例）</text>
  <rect x="26" y="74" width="296" height="22" fill="#f1f5f9"/>
  <text x="34" y="89" font-size="9.5" font-weight="700" fill="#334155">编码</text>
  <text x="130" y="89" font-size="9.5" font-weight="700" fill="#334155">+5</text>
  <text x="216" y="89" font-size="9.5" font-weight="700" fill="#334155">−5</text>
  <text x="34" y="112" font-size="10" fill="#1e293b">原码（符号 + 绝对值）</text>
  <text x="130" y="112" font-size="10" fill="#1e293b">0000 0101</text>
  <text x="216" y="112" font-size="10" fill="#1e293b">1000 0101</text>
  <text x="34" y="134" font-size="10" fill="#1e293b">反码（负数按位取反）</text>
  <text x="130" y="134" font-size="10" fill="#1e293b">0000 0101</text>
  <text x="216" y="134" font-size="10" fill="#1e293b">1111 1010</text>
  <rect x="26" y="142" width="296" height="22" fill="#dcfce7"/>
  <text x="34" y="157" font-size="10" font-weight="700" fill="#14532d">补码（反码 +1）</text>
  <text x="130" y="157" font-size="10" fill="#14532d">0000 0101</text>
  <text x="216" y="157" font-size="10" fill="#14532d">1111 1011</text>
  <text x="34" y="179" font-size="10" fill="#1e293b">移码（补码符号取反）</text>
  <text x="130" y="179" font-size="10" fill="#1e293b">1000 0101</text>
  <text x="216" y="179" font-size="10" fill="#1e293b">0111 1011</text>
  <text x="28" y="206" font-size="9.5" fill="#334155">n 位补码范围：−2^(n−1) ~ 2^(n−1)−1（8 位为 −128~+127）</text>
  <text x="28" y="224" font-size="9.5" fill="#334155">原码/反码的 ±0 有两种表示；补码 0 唯一，且能多表示 −2^(n−1)</text>
  <text x="28" y="242" font-size="9.5" fill="#64748b">移码便于比较阶码大小，故用于浮点数的指数部分</text>

  <!-- 右：IEEE754 -->
  <rect x="346" y="44" width="318" height="216" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="358" y="64" font-size="11.5" font-weight="700" fill="#334155">② IEEE 754 单精度（32 bit）</text>
  <rect x="358" y="76" width="36" height="30" fill="#fecaca" stroke="#b91c1c"/>
  <text x="376" y="96" text-anchor="middle" font-size="10" fill="#7f1d1d">S</text>
  <rect x="394" y="76" width="96" height="30" fill="#fde68a" stroke="#b45309"/>
  <text x="442" y="96" text-anchor="middle" font-size="10" fill="#78350f">阶码 E（8 bit）</text>
  <rect x="490" y="76" width="162" height="30" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="571" y="96" text-anchor="middle" font-size="10" fill="#1e3a8a">尾数 M（23 bit）</text>
  <text x="358" y="122" font-size="9.5" fill="#334155">真值 = (−1)^S × (1.M)₂ × 2^(E−127)　（规格化数，隐藏位 1）</text>
  <text x="358" y="140" font-size="9.5" fill="#334155">阶码用移码表示，偏置值 bias = 127（双精度 E 11 bit、bias = 1023）</text>
  <rect x="358" y="150" width="294" height="22" fill="#f1f5f9"/>
  <text x="364" y="165" font-size="9.5" font-weight="700" fill="#334155">E / M</text>
  <text x="440" y="165" font-size="9.5" font-weight="700" fill="#334155">表示</text>
  <text x="364" y="185" font-size="9.5" fill="#1e293b">E=0, M=0</text>
  <text x="440" y="185" font-size="9.5" fill="#1e293b">±0（符号位决定）</text>
  <text x="364" y="203" font-size="9.5" fill="#1e293b">E=0, M≠0</text>
  <text x="440" y="203" font-size="9.5" fill="#1e293b">非规格化数（0.M × 2^−126）</text>
  <text x="364" y="221" font-size="9.5" fill="#1e293b">E=255, M=0</text>
  <text x="440" y="221" font-size="9.5" fill="#1e293b">±∞</text>
  <text x="364" y="239" font-size="9.5" fill="#1e293b">E=255, M≠0</text>
  <text x="440" y="239" font-size="9.5" fill="#1e293b">NaN（非数）</text>
  <text x="358" y="254" font-size="9" fill="#64748b">双精度：S1 | E11 | M52，bias=1023，隐藏位同为 1</text>

  <!-- 底部 -->
  <rect x="16" y="270" width="648" height="146" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="290" font-size="11.5" font-weight="700" fill="#334155">③ 其他编码与存储要点</text>
  <text x="28" y="310" font-size="10" fill="#1e293b">• BCD 用 4 bit 表示一个十进制位（8421 码）；ASCII 用 7 bit，汉字用 GB2312 / GBK / Unicode（UTF-8 变长 1~4 B）。</text>
  <text x="28" y="328" font-size="10" fill="#1e293b">• <tspan font-weight="700">大端</tspan>：高位字节存低地址（网络字节序、早期 MIPS）；<tspan font-weight="700">小端</tspan>：低位字节存低地址（x86、多数 ARM）。多字节数据跨平台传输必须统一字节序。</text>
  <text x="28" y="346" font-size="10" fill="#1e293b">• 数据宽度：位 bit / 字节 B / 字 word（字长 = CPU 一次可处理的二进制位数，如 32/64 位）；按边界对齐可避免多次访存。</text>
  <text x="28" y="364" font-size="10" fill="#1e293b">• 校验码：奇偶校验（检 1 位错）、<tspan font-weight="700">海明码</tspan>（可纠 1 位错，需满足 2^k ≥ n+k+1）、CRC（检多位突发错，用于磁盘/网络）。</text>
  <text x="28" y="382" font-size="10" fill="#1e293b">• 补码的核心价值：把减法变加法，符号位可与数值位一起参与运算，0 的表示唯一，硬件只需加法器。</text>
  <text x="28" y="402" font-size="10" fill="#64748b">• 现代补充：半精度 FP16 / bfloat16 用于深度学习；FP8、TF32 用于 AI 加速；十进制浮点 IEEE 754-2008 用于金融计算。</text>
</svg>
