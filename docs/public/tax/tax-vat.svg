<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" style="max-width:900px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">增值税：计税方法选择与应纳税额计算</text>

  <rect x="24" y="46" width="852" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="66" font-size="13" font-weight="700" fill="#1e3a8a">第一步：判定纳税人身份（年应征增值税销售额 500 万元为界）</text>
  <rect x="36" y="76" width="400" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="236" y="97" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="600">≤ 500 万 → 小规模纳税人 → 简易计税</text>
  <rect x="448" y="76" width="416" height="32" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="656" y="97" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">&gt; 500 万 → 一般纳税人 → 一般计税</text>

  <text x="24" y="146" font-size="14" font-weight="700" fill="#166534">第二步（一般计税）：销项 − 进项</text>
  <rect x="24" y="158" width="852" height="96" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="40" y="174" width="240" height="64" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="160" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">销项税额</text>
  <text x="160" y="215" text-anchor="middle" font-size="11" fill="#374151">销售额 × 适用税率</text>
  <text x="160" y="231" text-anchor="middle" font-size="10" fill="#6b7280">含税价需 ÷(1+税率) 换算</text>
  <text x="300" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">−</text>
  <rect x="322" y="174" width="240" height="64" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="442" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">进项税额</text>
  <text x="442" y="215" text-anchor="middle" font-size="11" fill="#374151">凭专票 / 海关缴款书抵扣</text>
  <text x="442" y="231" text-anchor="middle" font-size="10" fill="#6b7280">不得抵扣项目需转出</text>
  <text x="582" y="212" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">=</text>
  <rect x="604" y="174" width="256" height="64" rx="8" fill="#166534"/>
  <text x="732" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">当期应纳税额</text>
  <text x="732" y="222" text-anchor="middle" font-size="11" fill="#dcfce7">负值结转下期 → 留抵退税</text>

  <text x="24" y="284" font-size="14" font-weight="700" fill="#1e3a8a">第三步：税率与征收率</text>
  <g>
    <rect x="24" y="296" width="204" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="126" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">13%</text>
    <text x="126" y="335" text-anchor="middle" font-size="10" fill="#374151">销售货物、加工修理修配</text>
    <text x="126" y="351" text-anchor="middle" font-size="10" fill="#374151">有形动产租赁</text>
    <rect x="236" y="296" width="204" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="338" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">9%</text>
    <text x="338" y="335" text-anchor="middle" font-size="10" fill="#374151">交通运输、邮政、基础电信</text>
    <text x="338" y="351" text-anchor="middle" font-size="10" fill="#374151">建筑、不动产、农产品等</text>
    <rect x="448" y="296" width="204" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="550" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">6%</text>
    <text x="550" y="335" text-anchor="middle" font-size="10" fill="#374151">增值电信、金融、生活服务</text>
    <text x="550" y="351" text-anchor="middle" font-size="10" fill="#374151">一般无形资产</text>
    <rect x="660" y="296" width="216" height="66" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="768" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">0%</text>
    <text x="768" y="335" text-anchor="middle" font-size="10" fill="#78350f">出口货物、跨境应税行为</text>
    <text x="768" y="351" text-anchor="middle" font-size="10" fill="#78350f">零税率 ≠ 免税（可退进项）</text>
  </g>

  <text x="24" y="392" font-size="14" font-weight="700" fill="#1e3a8a">简易计税 &amp; 进口环节</text>
  <rect x="24" y="404" width="416" height="64" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="36" y="423" font-size="11" font-weight="600" fill="#1e3a8a">简易：应纳税额 = 销售额（不含税）× 征收率</text>
  <text x="36" y="440" font-size="10" fill="#374151">征收率 3%；特定 5%、2%、1.5%、1%、0.5%</text>
  <text x="36" y="457" font-size="10" fill="#374151">不得抵扣进项税额</text>
  <rect x="452" y="404" width="424" height="64" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="464" y="423" font-size="11" font-weight="600" fill="#991b1b">进口组价 = 关税完税价格 + 关税 + 消费税</text>
  <text x="464" y="440" font-size="10" fill="#7f1d1d">应纳增值税 = 组成计税价格 × 税率（13% 或 9%）</text>
  <text x="464" y="457" font-size="10" fill="#7f1d1d">由海关代征，报关进口当天纳税，15 日内缴款</text>
</svg>
